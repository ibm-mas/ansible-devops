---
# Retrieve IBM Event Streams certificate chain
# -----------------------------------------------------------------------------
- name: Retrieve IBM Event Streams certificates using openssl
  vars:
    es_host_name: "{{hostports[0][0] }}"
    es_port: "{{hostports[0][1] }}"
  shell:
    cmd: "openssl s_client -servername {{ es_host_name }} -connect {{ es_host_name }}:{{ es_port }} -showcerts </dev/null  2>/dev/null"
  register: get_certs_r
  #ignore_errors: true
  failed_when: get_certs_r.rc != 0
  retries: 5
  delay: 10
  until: get_certs_r.rc == 0
- debug:
    msg:
      - "Openssl command output .................... {{ get_certs_r.stdout }}"

- name: "Extract IBM Event Streams certificate content"
  set_fact:
    es_tls_crt: '{{ get_certs_r.stdout | regex_findall( "(-----BEGIN .+?-----[\s\S]*?-----END .*?-----)" ,multiline=true,ignorecase=true) }}'

# ISRG Root X1 is the universal trust anchor for all Let's Encrypt chains.
# Brokers never send the root CA in the TLS handshake (RFC 5246), so it is
# never present in the openssl s_client -showcerts output.  For Event Streams
# instances that use the YR2 intermediate (svc08+), the chain sent by the
# broker is: leaf → YR2 → Root YR.  Root YR is cross-signed by ISRG Root X1,
# so without ISRG Root X1 in the trust store librdkafka raises _TRANSPORT
# (verify error:num=2 unable to get issuer certificate).
# Appending ISRG Root X1 unconditionally is safe: for older chains (R13 →
# ISRG Root X1) it is already the trust anchor and adding it again is a no-op
# for librdkafka's verification.
- name: "Append ISRG Root X1 trust anchor to certificate chain"
  set_fact:
    es_tls_crt: "{{ es_tls_crt + [isrg_root_x1] }}"
  vars:
    isrg_root_x1: |
      -----BEGIN CERTIFICATE-----
      MIIFazCCA1OgAwIBAgIRAIIQz7DSQONZRGPgu2OCiwAwDQYJKoZIhvcNAQELBQAw

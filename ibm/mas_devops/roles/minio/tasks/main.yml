---
# minio/tasks/main.yml
# =============================================================================
# Main dispatcher for MinIO actions
# Supports: install, backup, uninstall

- name: "Run the selected action"
  include_tasks: "tasks/{{ minio_action }}/main.yml"
  when:
    - minio_action != "none"
    - minio_action in ["install", "backup", "uninstall"]

- name: "Fail if minio_action is invalid"
  fail:
    msg: "minio_action must be one of ['install', 'backup', 'uninstall', 'none']"
  when:
    - minio_action not in ["none", "install", "backup", "uninstall"]


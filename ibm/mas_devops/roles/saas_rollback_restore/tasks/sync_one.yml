---
# Hard refresh and sync one Application; wait for Synced and Healthy. Loop var: app
# =============================================================================

- name: "[sync] Refresh {{ app.name }}"
  ansible.builtin.include_tasks: helper.yml
  vars:
    _rr_h_name: "[sync] Refresh {{ app.name }}"
    _rr_h_args: ["argo-refresh", "--ns", "{{ saas_rollback_argo_ns }}", "--app", "{{ app.name }}"]

- name: "[sync] Sync {{ app.name }}"
  ansible.builtin.include_tasks: helper.yml
  vars:
    _rr_h_name: "[sync] Sync {{ app.name }} (wave {{ app.wave }})"
    _rr_h_args: ["argo-sync", "--ns", "{{ saas_rollback_argo_ns }}", "--app", "{{ app.name }}", "--timeout", "{{ saas_rollback_timeout }}"]

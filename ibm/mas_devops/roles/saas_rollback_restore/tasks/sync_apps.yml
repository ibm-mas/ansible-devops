---
# git-first A5, part 2: sync the Manage, Facilities, app config, add-on and postsync Applications (waves 300 and up).
# Runs after the start phase. No prune; prune is re-enabled last by the resume phase. Changes state unless dry run.
# =============================================================================

- name: "[sync_apps] Sync the instance Applications in wave order"
  ansible.builtin.include_tasks: sync_waves.yml
  vars:
    _rr_sw_min: 300
    _rr_sw_max: 99999
  loop: "{{ _rr_inst_list }}"
  loop_control:
    loop_var: inst

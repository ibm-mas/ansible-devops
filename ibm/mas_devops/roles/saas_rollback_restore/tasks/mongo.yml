---
# Phase S6: Mongo / DocumentDB data (03 section 8). Changes state unless dry run.
# The Mongo operator and pods keep running; MAS operators and workloads are already stopped (stop phase).
# =============================================================================

- name: "[mongo] Restore each instance"
  ansible.builtin.include_tasks: mongo_instance.yml
  loop: "{{ _rr_inst_list }}"
  loop_control:
    loop_var: inst

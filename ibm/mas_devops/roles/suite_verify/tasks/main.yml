---
# tasks file for suite

# 1. Check for undefined properties that do not have a default
# -----------------------------------------------------------------------------
- name: "Fail if mas_instance_id is not provided"
  assert:
    that:
      - mas_instance_id is defined
      - mas_instance_id != ""
    fail_msg: "mas_instance_id property is required"


# 2. Configure target namespace
# -----------------------------------------------------------------------------
- name: "Configure namespace"
  set_fact:
    mas_namespace: "mas-{{ mas_instance_id }}-core"


# 3. Follow Suite Status
# -----------------------------------------------------------------------------
- name: "Wait for Suite Components to be ready"
  ibm.mas_devops.wait_for_conditions:
    api_version: v1
    name: "{{mas_instance_id}}"
    namespace: "{{mas_namespace}}"
    kind: Suite
    conditions:
      - SystemDatabaseReady
      - BASIntegrationReady
      - SLSIntegrationReady
  register: suite_cr_result

# Older versions of MAS Core may not have the CoreIDPReady status check so it is seperated here and it only runs if the check is present
- name: "Wait for CoreIDP to be ready if check is present"
  when: suite_cr_result.resource.status.conditions | selectattr('type', 'equalto', 'CoreIDPReady') | map(attribute='status') | list | length > 0
  ibm.mas_devops.wait_for_conditions:
    api_version: v1
    name: "{{mas_instance_id}}"
    namespace: "{{mas_namespace}}"
    kind: Suite
    conditions:
      - CoreIDPReady
  register: suite_cr_result

- name: "Wait for Suite to be ready overall"
  ibm.mas_devops.wait_for_conditions:
    api_version: v1
    name: "{{mas_instance_id}}"
    namespace: "{{mas_namespace}}"
    kind: Suite
    conditions:
      - Ready

# 4. Lookup for superuser credentials
# -----------------------------------------------------------------------------
- name: "Lookup MAS superuser credentials"
  when: not mas_hide_superuser_credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ mas_instance_id }}-credentials-superuser"
    namespace: "{{mas_namespace}}"
  register: superuser_credentials

- name: "Show the username/password"
  when: not mas_hide_superuser_credentials
  set_fact:
    superuser_username: "{{ superuser_credentials.resources[0].data.username | b64decode }}"
    superuser_password: "{{ superuser_credentials.resources[0].data.password | b64decode }}"

- name: "Hide actual username/password"
  when: mas_hide_superuser_credentials
  set_fact:
    superuser_username: "Available in Secret/{{ mas_instance_id }}-credentials-superuser"
    superuser_password: "Available in Secret/{{ mas_instance_id }}-credentials-superuser"

# 5. Print MAS login information
# -----------------------------------------------------------------------------
# When manual route management is enabled (always the case with Service Mesh) MAS
# does not create any Routes. Instead it writes a routeref-<route-name> ConfigMap
# that holds the Route definition, so the admin host is read from there.
- name: Lookup Route for admin
  when: not mas_manual_route_mgmt
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: "{{ mas_instance_id}}-admin"
    namespace: "{{ mas_namespace }}"
  register: admin_route

- name: "Lookup routeref ConfigMap for admin (manual route management)"
  when: mas_manual_route_mgmt
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "routeref-{{ mas_instance_id }}-admin"
    namespace: "{{ mas_namespace }}"
  register: admin_routeref

- name: "Check routeref ConfigMap for admin exists (manual route management)"
  when: mas_manual_route_mgmt
  debug:
    msg: >-
      {{
        'Found ConfigMap routeref-' ~ mas_instance_id ~ '-admin in namespace ' ~ mas_namespace
        if admin_routeref.resources | default([]) | length > 0
        else 'WARNING: Manual route management is enabled but ConfigMap routeref-' ~ mas_instance_id ~ '-admin was not found in namespace ' ~ mas_namespace
      }}

- name: "Lookup cluster subdomain"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: cluster_subdomain

- name: "Maximo Application Suite Authentication Summary:"
  when: not mas_manual_route_mgmt
  debug:
    msg:
      - "Maximo Application Suite is Ready, use the superuser credentials to authenticate"
      - "Admin Dashboard ... https://{{ admin_route.resources[0].spec.host | default ('UNDEFINED')}}{{ '/admin' if mas_routing_mode == 'path' else '' }}"
      - "Username .......... {{ superuser_username }}"
      - "Password .......... {{ superuser_password }}"

- name: "Maximo Application Suite Authentication Summary (manual route management):"
  when: mas_manual_route_mgmt
  debug:
    msg:
      - "Maximo Application Suite is Ready"
      - "Route management ... Manual (manualRouteMgmt is enabled): MAS has not created any Routes instead routeref-{{ mas_instance_id }}-admin configMap is created which contains admin route reference which can be used to create the route manually."
      - "Once the routes are configured, use the superuser credentials to authenticate"
      - "Username .......... {{ superuser_username }}"
      - "Password .......... {{ superuser_password }}"

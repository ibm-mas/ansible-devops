---
# 1. Check mas core backup required variables
# -----------------------------------------------------------------------------
- name: "Verify required variables for suite backup"
  ibm.mas_devops.verify_backup_restore_vars:
    component: suite
    action: backup
    mas_instance_id: "{{ mas_instance_id }}"
    mas_backup_dir: "{{ mas_backup_dir }}"

- name: "Check if SUITE_BACKUP_VERSION is provided, if not set to default 'YYYYMMDD-HHMMSS' format"
  set_fact:
    suite_backup_version: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
  when: suite_backup_version is not defined or suite_backup_version == "" or suite_backup_version == "None"

- name: "Set fact: mas core namespace name"
  set_fact:
    mas_core_namespace: "mas-{{ mas_instance_id }}-core"

- name: "Set fact: mas suite backup base directory path"
  set_fact:
    suite_backup_path: "{{ mas_backup_dir }}/backup-{{ suite_backup_version }}-suite"

# 2. Determine version of cert-manager in use on the cluster
# -----------------------------------------------------------------------------
- name: Detect Certificate Manager installation
  include_tasks: "{{ role_path }}/../../common_tasks/detect_cert_manager.yml"

# 3. Determine if a public clusterissuer is being used
# -----------------------------------------------------------------------------
- name: Detect MAS Public Cluster Issuer
  ibm.mas_devops.get_mas_cluster_issuer:
    instance_id: "{{ mas_instance_id }}"
  register: mas_cluster_issuer

- name: "Display detected MAS cluster issuer"
  debug:
    msg: "Detected MAS cluster issuer: {{ mas_cluster_issuer.issuer_name }}"
  when: mas_cluster_issuer.success

- name: "Fail if MAS cluster issuer detection failed"
  fail:
    msg: "Failed to detect MAS cluster issuer"
  when: mas_cluster_issuer.failed

# 3.1 Strict named-only guard rails
# -----------------------------------------------------------------------------
- name: "Strict named-only: workspace ID is required"
  assert:
    that:
      - mas_workspace_id is defined
      - mas_workspace_id != ""
      - mas_workspace_id != "None"
    fail_msg: "mas_workspace_id (MAS_WORKSPACE_ID) is required when strict_named_only is enabled"
  when: strict_named_only | bool

- name: "CA key-pair Secrets: opt-in is blocked until backup encryption is approved"
  fail:
    msg: >-
      include_ca_keys=true was requested, but CA key-pair Secrets (tls.key/tls.crt) may never be written in plaintext
      (MASCORE-20742 CA policy: opt-in requires an approved backup-encryption mechanism, DR_ENCRYPT_CMD, which this role
      does not implement). CA key-pair Secrets are NOT exported. Unset INCLUDE_CA_KEYS to continue.
  when: include_ca_keys | bool

# 4. Build the config.mas.ibm.com resource list based on include flags
# -----------------------------------------------------------------------------
- name: "Set fact: base config resources list (non-strict mode)"
  set_fact:
    config_resources:
      - kind: AiCfg # 9.2 and later
        api_version: config.mas.ibm.com/v1
      - kind: AppCfg
        api_version: config.mas.ibm.com/v1
      - kind: CouchCfg
        api_version: config.mas.ibm.com/v1
      - kind: IDPCfg
        api_version: config.mas.ibm.com/v1
      - kind: JdbcCfg
        api_version: config.mas.ibm.com/v1
      - kind: KafkaCfg
        api_version: config.mas.ibm.com/v1
      - kind: MongoCfg
        api_version: config.mas.ibm.com/v1
      - kind: ObjectStorageCfg
        api_version: config.mas.ibm.com/v1
      - kind: PushNotificationCfg
        api_version: config.mas.ibm.com/v1
      - kind: ScimCfg
        api_version: config.mas.ibm.com/v1
      - kind: SmtpCfg
        api_version: config.mas.ibm.com/v1
      - kind: WatsonStudioCfg
        api_version: config.mas.ibm.com/v1
  when: not (strict_named_only | bool)

# Strict mode: only the Suite config CRs confirmed by the MASCORE-20742 POC inventory
- name: "Set fact: base config resources list (strict named-only mode)"
  set_fact:
    config_resources:
      - kind: MongoCfg
        api_version: config.mas.ibm.com/v1
        name: "{{ mas_instance_id }}-mongo-system"
      - kind: JdbcCfg
        api_version: config.mas.ibm.com/v1
        name: "{{ mas_instance_id }}-jdbc-wsapp-{{ mas_workspace_id }}-manage"
  when: strict_named_only | bool

- name: "Add BasCfg to config resources if include_dro is true (non-strict)"
  set_fact:
    config_resources: "{{ config_resources + [{'kind': 'BasCfg', 'api_version': 'config.mas.ibm.com/v1'}] }}"
  when:
    - include_dro | bool
    - not (strict_named_only | bool)

- name: "Add BasCfg to config resources if include_dro is true (strict named-only)"
  set_fact:
    config_resources: "{{ config_resources + [{'kind': 'BasCfg', 'api_version': 'config.mas.ibm.com/v1', 'name': mas_instance_id + '-bas-system'}] }}"
  when:
    - include_dro | bool
    - strict_named_only | bool

- name: "Add SlsCfg to config resources if include_sls is true (non-strict)"
  set_fact:
    config_resources: "{{ config_resources + [{'kind': 'SlsCfg', 'api_version': 'config.mas.ibm.com/v1'}] }}"
  when:
    - include_sls | bool
    - not (strict_named_only | bool)

- name: "Add SlsCfg to config resources if include_sls is true (strict named-only)"
  set_fact:
    config_resources: "{{ config_resources + [{'kind': 'SlsCfg', 'api_version': 'config.mas.ibm.com/v1', 'name': mas_instance_id + '-sls-system'}] }}"
  when:
    - include_sls | bool
    - strict_named_only | bool

# 5. Build the core namespace resources list
# -----------------------------------------------------------------------------
- name: "Set fact: mas core namespace resources (non-strict mode)"
  set_fact:
    mas_core_namespace_resources:
      - kind: Project
        api_version: project.openshift.io/v1
        name: "{{ mas_core_namespace }}"
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-credentials-superuser"
      # subscription
      - kind: Subscription
        api_version: operators.coreos.com/v1alpha1
        name: ibm-mas-operator
      - kind: OperatorGroup
        api_version: operators.coreos.com/v1
        name: ibm-mas-operator-group
      # secrets
      - kind: Secret
        api_version: v1
        name: ibm-entitlement
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-credentials-superuser"
      # local password policy settings
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-password-policy"
      # public cert in case of manual managed certs
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-cert-public"
      # certificates
      - kind: Certificate
        api_version: cert-manager.io/v1
        labels:
          - "mas.ibm.com/instanceId={{ mas_instance_id }}"
      # addons.mas.ibm.com (9.1 and later)
      - kind: MVIEdge
        api_version: addons.mas.ibm.com/v1
      - kind: ReplicaDB
        api_version: addons.mas.ibm.com/v1
      - kind: GenericAddon
        api_version: addons.mas.ibm.com/v1
      # core.mas.ibm.com
      - kind: Suite
        api_version: core.mas.ibm.com/v1
      - kind: Workspace
        api_version: core.mas.ibm.com/v1
      # internal.mas.ibm.com
      - kind: CoreIDP
        api_version: internal.mas.ibm.com/v1
  when: not (strict_named_only | bool)

# Strict mode: exact Suite inventory from the MASCORE-20742 POC (names verified against the
# gitops chart templates 130-ibm-mas-suite and 550-ibm-mas-addons-config, and the POC backup script)
- name: "Set fact: mas core namespace resources (strict named-only mode)"
  set_fact:
    mas_core_namespace_resources:
      - kind: Project
        api_version: project.openshift.io/v1
        name: "{{ mas_core_namespace }}"
      # OLM (metadata.name of the Subscription is ibm-mas-operator; spec.name is ibm-mas)
      - kind: Subscription
        api_version: operators.coreos.com/v1alpha1
        name: ibm-mas-operator
      - kind: OperatorGroup
        api_version: operators.coreos.com/v1
        name: ibm-mas-operator-group
      # Mandatory DR secrets
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-credentials-superuser"
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-keys-jwt"
      # Recommended continuity secret
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-keys-ltpa"
      # External prerequisite / policy / manual-cert secrets
      - kind: Secret
        api_version: v1
        name: ibm-entitlement
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-password-policy"
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-cert-public"
      - kind: Secret
        api_version: v1
        name: "{{ mas_instance_id }}-admindashboard-cert-internal"
      # Suite ConfigMaps (POC-observed)
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-catalog-items"
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-catalog-settings"
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-nps"
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-settings-applications"
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-suite-reconcile"
      - kind: ConfigMap
        api_version: v1
        name: "{{ mas_instance_id }}-supported-applications"
      # Suite CRs
      - kind: Suite
        api_version: core.mas.ibm.com/v1
        name: "{{ mas_instance_id }}"
      - kind: Workspace
        api_version: core.mas.ibm.com/v1
        name: "{{ mas_instance_id }}-{{ mas_workspace_id }}"
      - kind: GenericAddon
        api_version: addons.mas.ibm.com/v1
        name: "{{ mas_instance_id }}-addons-production-database-access"
  when: strict_named_only | bool

- name: "Combine core namespace resources with config resources"
  set_fact:
    mas_core_namespace_resources: "{{ mas_core_namespace_resources + config_resources }}"

# 6. Set the backup_resources we want to backup. Note that if the resource doesn't
#    exist, the backup will still succeed. If a resource contains `secretName` key
#    then the secret will be backed up as well (non-strict mode only).
# -----------------------------------------------------------------------------
- name: "Set fact: mas suite backup resources"
  set_fact:
    suite_backup_resources:
      - resources:
          - kind: ClusterIssuer
            api_version: cert-manager.io/v1
            name: "{{ mas_cluster_issuer.issuer_name }}"
          - kind: ClusterIssuer
            api_version: cert-manager.io/v1
            name: "mas-{{ mas_instance_id }}-core-internal-issuer"
          - kind: ClusterIssuer
            api_version: cert-manager.io/v1
            name: "mas-{{ mas_instance_id }}-ca"
      - namespace: "{{ cert_manager_cluster_resource_namespace }}"
        resources:
          - kind: Issuer
            api_version: cert-manager.io/v1
            name: "mas-{{ mas_instance_id }}-core-internal-ca-issuer"
          - kind: Issuer
            api_version: cert-manager.io/v1
            name: "mas-{{ mas_instance_id }}-core-public-ca-issuer"
          - kind: Certificate
            api_version: cert-manager.io/v1
            name: "{{ mas_instance_id }}-cert-internal-ca"
          - kind: Certificate
            api_version: cert-manager.io/v1
            name: "{{ mas_instance_id }}-cert-public-ca"
      - namespace: "{{ mas_core_namespace }}"
        resources: "{{ mas_core_namespace_resources }}"

# Strict mode: back up the explicitly named Suite CRDs (cluster-scoped). See suite_backup_crds in defaults.
- name: "Add explicitly named Suite CRDs to backup resources (strict named-only)"
  set_fact:
    suite_backup_resources: "{{ suite_backup_resources + [{'resources': suite_backup_crds}] }}"
  when: strict_named_only | bool

# 7. Call the backup_resources plugin to execute the backup to the path provided
# -----------------------------------------------------------------------------
- name: "Backup MAS Suite resources (referenced secrets are auto-discovered)"
  ibm.mas_devops.backup_resource:
    backup_resources: "{{ suite_backup_resources }}"
    backup_path: "{{ suite_backup_path }}"
    strict_named_only: "{{ strict_named_only | bool }}"
    auto_discover_secrets: "{{ auto_discover_secrets | bool }}"
  register: backup_result

# 7.1 Environment configuration snapshot (saas-envs instance folder, gitops-envs if one is provided)
# -----------------------------------------------------------------------------
- name: "Snapshot environment configuration"
  include_tasks: "{{ role_path }}/../../common_tasks/backup_env_snapshot.yml"
  vars:
    env_snapshot_backup_path: "{{ suite_backup_path }}"

# 8. Show the results
# -----------------------------------------------------------------------------
- name: "Display backup results"
  debug:
    msg:
      - "Backup completed{{ ' with failures' if backup_result.failed_count > 0 else ' successfully' }}"
      - "Total resources backed up: {{ backup_result.backed_up_count }}"
      - "Total resources failed: {{ backup_result.failed_count }}"
      - "Resources not found: {{ backup_result.not_found_count }}"
      - "Not found (named resources): {{ backup_result.not_found_resources | to_json }}"
      - "Secrets auto-discovered: {{ backup_result.discovered_secrets_count }}"
      - "Backup location: {{ suite_backup_path }}"

# 9. Fail task if any errors occurred.
# -----------------------------------------------------------------------------
- name: "Display failed resources"
  debug:
    msg:
      - "Failed resources:"
      - "{{ backup_result.failed_resources | to_nice_yaml }}"
  when: backup_result.failed_count > 0

- name: "Fail if backup had errors"
  fail:
    msg: |
      Backup failed for {{ backup_result.failed_count }} resource(s):
      {% for resource in backup_result.failed_resources %}
      - {{ resource.description }} in {{ resource.scope }}
      {% endfor %}
  when: backup_result.failed_count > 0

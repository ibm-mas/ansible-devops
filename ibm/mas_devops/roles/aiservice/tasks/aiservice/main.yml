---
# 1. Provide Debug information
# -----------------------------------------------------------------------------
- name: "Debug information - IBM Maximo AI Service"
  debug:
    msg:
      - "Namespace ......................... {{ aiservice_namespace }}"
      - "Channel ........................... {{ aiservice_channel }}"
      - "MAS Instance Id ................... {{ aiservice_instance_id }}"
      - "aiservice_s3_region ............... {{ aiservice_s3_region }}"
      - "aiservice_s3_host ................. {{ aiservice_s3_host }}"
      - "aiservice_s3_port ................. {{ aiservice_s3_port }}"
      - "aiservice_s3_host_with_port ....... {{ aiservice_s3_host_with_port }}"
      - "aiservice_s3_bucket_prefix ........ {{ aiservice_s3_bucket_prefix }}"


# 2. Install the operator & create entitlement secret
# -----------------------------------------------------------------------------
- name: "Create IBM Entitlement Key"
  ibm.mas_devops.update_ibm_entitlement:
    namespace: "{{ aiservice_namespace }}"
    icr_username: "{{ mas_entitlement_username }}"
    icr_password: "{{ mas_entitlement_key }}"
    artifactory_username: "{{ artifactory_username }}"
    artifactory_password: "{{ artifactory_token }}"
    namespace_kyverno_label: "audit"

- name: "Create ibm-aiservice Subscription"
  ibm.mas_devops.apply_subscription:
    namespace: "{{ aiservice_namespace }}"
    package_name: ibm-aiservice
    package_channel: "{{ aiservice_channel }}"
    catalog_source: "{{ mas_catalog_source }}"
  register: subscription


# 3. Wait until the IBM Maximo AI Service CRD is available
# -----------------------------------------------------------------------------
- name: "Wait until the IBM Maximo AI Service Operator CRD is available"
  include_tasks: "{{ role_path }}/../../common_tasks/wait_for_crd.yml"
  vars:
    crd_name: aiserviceapps.aiservice.ibm.com


# 4. Lookup storage class availability
# -----------------------------------------------------------------------------
- name: "Load default storage class information"
  include_tasks: "{{ role_path }}/../../common_tasks/default_storage_classes.yml"


# 5. Set AI Service Storage (Required)
# -----------------------------------------------------------------------------
- name: "Default AI Service Storage if not set by user"
  when: aiservice_storage_class is not defined or aiservice_storage_class == ""
  set_fact:
    aiservice_storage_class: "{{ defaultStorageClasses.rwx }}"

- name: "Assert that primary storage class has been defined"
  assert:
    that: aiservice_storage_class is defined and aiservice_storage_class != ""
    fail_msg: "aiservice_storage_class must be defined"

- name: "Debug"
  debug:
    msg: "AI Service storage class ................. {{ aiservice_storage_class }}"


# 6. Create/Update km-s3-secret
# -----------------------------------------------------------------------------
- name: "Create km-s3-secret"
  kubernetes.core.k8s:
    state: present
    template: templates/aiservice/s3-secret.yml.j2
  register: km_s3_secret_result

# 6a. Restart km-controller if secret changed so pods immediately pick up new S3 credentials
# (Kubernetes does NOT auto-restart pods when envFrom secret changes — pods must restart manually)
# The operator will also trigger restarts on all 3 kmodels deployments (controller/store/watcher)
# when the AIServiceApp CR s3.ca field changes (deployment spec diff → rolling restart).
# This patch is the safety net for credential-only rotations where spec doesn't change
# (e.g. same CA cert, only access/secret keys rotated).
#
# Only runs if:
#   1. km-s3-secret actually changed (km_s3_secret_result.changed)
#   2. The deployment already exists (fresh install: operator hasn't created it yet → skip)
# -----------------------------------------------------------------------------
- name: "Check if km-controller deployment exists"
  when: km_s3_secret_result.changed
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ aiservice_instance_id }}-km-controller"
    namespace: "{{ aiservice_namespace }}"
  register: km_controller_deployment
  failed_when: false

- name: "Restart km-controller deployment to pick up new S3 credentials"
  when:
    - km_s3_secret_result.changed
    - km_controller_deployment.resources is defined
    - km_controller_deployment.resources | length > 0
  shell: >
    kubectl rollout restart deployment/{{ aiservice_instance_id }}-km-controller
    -n {{ aiservice_namespace }}
  ignore_errors: true

# 7. Check if aiservice_watsonxai_ca_crt exist and if do - update aiservice_watsonxai_verify to true
- name: "Check if aiservice_watsonxai_verify needs to be updated"
  set_fact:
    aiservice_watsonxai_verify: true
  when: aiservice_watsonxai_ca_crt | length > 0

# 8. IBM Maximo AI Broker installation
# -----------------------------------------------------------------------------
- name: Create AI Service CR
  vars:
    annotation_dict: "{{ mas_annotations | string | ibm.mas_devops.getAnnotations() }}"
  kubernetes.core.k8s:
    state: present
    template: templates/aiservice/aiserviceapp.yml.j2

# 9. Wait IBM Maximo AI Service custom resource to be complete
# -----------------------------------------------------------------------------
- name: "Wait for AIServiceApp custom resource to be ready (60s delay)"
  kubernetes.core.k8s_info:
    api_version: aiservice.ibm.com/v1
    name: "{{ aiservice_instance_id }}"
    namespace: "{{ aiservice_namespace }}"
    kind: AIServiceApp
  register: aiserviceapp_cr_result
  until:
    - aiserviceapp_cr_result.resources is defined and aiserviceapp_cr_result.resources | length == 1
    - aiserviceapp_cr_result.resources[0].status is defined
    - aiserviceapp_cr_result.resources | json_query('[*].status.conditions[?type==`Successful`][].status') | select ('match','True') | list | length == 1
  retries: 45 # approx 45 minutes before we give up
  delay: 60 # 1 minute

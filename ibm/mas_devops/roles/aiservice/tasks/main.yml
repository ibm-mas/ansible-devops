---
# Main dispatcher for AI Service actions
# Supports: install (default), update
# -----------------------------------------------------------------------------
- name: "Fail if aiservice_action is invalid"
  assert:
    that: aiservice_action in ['install', 'update']
    fail_msg: "aiservice_action must be one of ['install', 'update'], got '{{ aiservice_action }}'"

- name: "Run the selected action"
  include_tasks: "tasks/{{ aiservice_action }}/main.yml"

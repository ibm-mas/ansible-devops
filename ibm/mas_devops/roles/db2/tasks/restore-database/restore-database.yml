---
# Check db2 Restore required variables
# -----------------------------------------------------------------------------
- name: "Set default db2_backup_version for profile-based restore"
  set_fact:
    db2_backup_version: >-
      {{
        backup_release_tag if (backup_retention_profile == 'release' and backup_release_tag != '')
        else backup_ticket_id if (backup_retention_profile == 'adhoc' and backup_ticket_id != '')
        else backup_retention_profile
      }}
  when:
    - db2_backup_version is not defined or db2_backup_version == "" or db2_backup_version == "None"
    - backup_retention_profile is defined
    - backup_retention_profile != ""
    - backup_retention_profile in ["daily", "adhoc", "golden", "release"]

- name: Verify DB2 restore variables
  ibm.mas_devops.verify_backup_restore_vars:
    component: "db2"
    action: "restore-database"
    db2_backup_version: "{{ db2_backup_version }}"
    mas_backup_dir: "{{ mas_backup_dir }}"
    db2_instance_name: "{{ db2_instance_name }}"
    backup_vendor: "{{ backup_vendor }}"
    mas_application_id: "{{ mas_application_id }}"

# Check s3 variables when backup vendor is s3
# -----------------------------------------------------------------------------
- name: "Verify DB2 S3 variables"
  ibm.mas_devops.verify_backup_restore_vars:
    component: "db2"
    action: "s3_setup"
    backup_vendor: "{{ backup_vendor }}"
    backup_s3_alias: "{{ backup_s3_alias }}"
    backup_s3_endpoint: "{{ backup_s3_endpoint }}"
    backup_s3_bucket: "{{ backup_s3_bucket }}"
    backup_s3_access_key: "{{ backup_s3_access_key }}"
    backup_s3_secret_key: "{{ backup_s3_secret_key }}"
  when: backup_vendor == "s3"

- name: Debug – "Start database restore process"
  ansible.builtin.debug:
    msg:
      - "================== STARTING RESTORE DB2 DATABASE =============================="
      - "DB2 INSTANCE NAME  : {{ db2_instance_name | default('UNDEFINED') }}"
      - "MAS APPLICATION ID : {{ mas_application_id | default('UNDEFINED') }}"
      - "BACKUP VERSION     : {{ db2_backup_version | default('UNDEFINED') }}"
      - "VENDOR             : {{ backup_vendor | default('UNDEFINED') }}"
      - "S3 ENDPOINT        : {{ backup_s3_endpoint | default('UNDEFINED') }}"
      - "S3 BUCKET          : {{ backup_s3_bucket | default('UNDEFINED') }}"
      - "BACKUP DIR         : {{ mas_backup_dir | default('UNDEFINED') }}"
      - "================================================================================"

# Pipeline-driven retention profile pre-processing (MASR-12127)
# Run only when backup_vendor=s3 AND a retention profile is explicitly set.
# -------------------------------------------------------------------------
- name: "Run profile-based S3 routing for restore"
  include_tasks: "{{ role_path }}/tasks/restore-database/restore-database-with-profile.yml"
  when:
    - backup_vendor == "s3"
    - backup_retention_profile is defined
    - backup_retention_profile != ""
    - backup_retention_profile in ["daily", "adhoc", "golden", "release"]

- name: "Run restore-db-from-disk.yml when backup vendor is disk"
  include_tasks: "{{ role_path }}/tasks/restore-database/restore-db-from-{{ backup_vendor }}.yml"

---
# Define where IBM Maximo Location Service for Esri will be installed, the default values below
# -----------------------------------------------------------------------------
mas_arcgis_channel_default: 9.1.x
mas_arcgis_channel: "{{ lookup('env', 'MAS_ARCGIS_CHANNEL') | default(mas_arcgis_channel_default, true) }}"

mas_arcgis_namespace: "mas-{{ mas_instance_id }}-arcgis"
mas_catalog_source: "{{ lookup('env', 'MAS_CATALOG_SOURCE') | default('ibm-operator-catalog', true) }}"
mas_arcgis_sitename: arcgis
arcgis_ingress_controller_service_name: "{{ mas_arcgis_sitename }}-ingress-nginx"

# MAS Configuration
# -----------------------------------------------------------------------------
mas_instance_id: "{{ lookup('env', 'MAS_INSTANCE_ID') }}"
mas_config_dir: "{{ lookup('env', 'MAS_CONFIG_DIR') }}"

# Custom Labels
# -----------------------------------------------------------------------------
custom_labels: "{{ lookup('env', 'CUSTOM_LABELS') | default(None, true) | string | ibm.mas_devops.string2dict() }}"

# Source container registry
# -----------------------------------------------------------------------------
mas_icr_cp: "{{ lookup('env', 'MAS_ICR_CP') | default('cp.icr.io/cp', true) }}"
mas_icr_cpopen: "{{ lookup('env', 'MAS_ICR_CPOPEN') | default('icr.io/cpopen', true) }}"

# MAS Entitlement
# -----------------------------------------------------------------------------
mas_entitlement_username: "{{ lookup('env', 'MAS_ENTITLEMENT_USERNAME') | default('cp', true) }}"
ibm_entitlement_key: "{{ lookup('env', 'IBM_ENTITLEMENT_KEY') }}"
mas_entitlement_key: "{{ lookup('env', 'MAS_ENTITLEMENT_KEY') | default(ibm_entitlement_key, true) }}"

# Development Registry Entitlement
artifactory_username: "{{ lookup('env', 'ARTIFACTORY_USERNAME') | lower }}"
artifactory_token: "{{ lookup('env', 'ARTIFACTORY_TOKEN') }}"

# MAS Annotation block
# -----------------------------------------------------------------------------
mas_annotations: "{{ lookup('env', 'MAS_ANNOTATIONS') | default(None, true) }}"

# ArcGIS Enterprise Organization Configuration (configure.sh)
# Set arcgis_configure_org=true to run configure.sh after deployment
# -----------------------------------------------------------------------------
arcgis_configure_org: "{{ lookup('env', 'ARCGIS_CONFIGURE_ORG') | default(false, true) }}"
arcgis_configure_dest: "{{ lookup('env', 'ARCGIS_CONFIGURE_DEST') | default('/tmp/arcgis-setup-' + mas_instance_id, true) }}"

arcgis_arch_profile: "{{ lookup('env', 'ARCGIS_ARCH_PROFILE') | default('development', true) }}"
arcgis_license_file: "{{ lookup('env', 'ARCGIS_LICENSE_FILE') | default('', true) }}"
arcgis_license_type_id: "{{ lookup('env', 'ARCGIS_LICENSE_TYPE_ID') | default('creatorUT', true) }}"

arcgis_admin_username: "{{ lookup('env', 'ARCGIS_ADMIN_USERNAME') | default('', true) }}"
arcgis_admin_password: "{{ lookup('env', 'ARCGIS_ADMIN_PASSWORD') | default('', true) }}"
arcgis_admin_email: "{{ lookup('env', 'ARCGIS_ADMIN_EMAIL') | default('', true) }}"
arcgis_admin_first_name: "{{ lookup('env', 'ARCGIS_ADMIN_FIRST_NAME') | default('', true) }}"
arcgis_admin_last_name: "{{ lookup('env', 'ARCGIS_ADMIN_LAST_NAME') | default('', true) }}"

arcgis_security_question_index: "{{ lookup('env', 'ARCGIS_SECURITY_QUESTION_INDEX') | default(1, true) }}"
arcgis_security_question_answer: "{{ lookup('env', 'ARCGIS_SECURITY_QUESTION_ANSWER') | default('', true) }}"

arcgis_log_setting: "{{ lookup('env', 'ARCGIS_LOG_SETTING') | default('WARNING', true) }}"
arcgis_log_retention_max_days: "{{ lookup('env', 'ARCGIS_LOG_RETENTION_MAX_DAYS') | default(60, true) }}"

arcgis_storage_class: "{{ lookup('env', 'ARCGIS_STORAGE_CLASS') | default('', true) }}"
arcgis_storage_size_relational: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_RELATIONAL') | default('16Gi', true) }}"
arcgis_storage_size_object: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_OBJECT') | default('64Gi', true) }}"
arcgis_storage_size_memory: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_MEMORY') | default('16Gi', true) }}"
arcgis_storage_size_queue: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_QUEUE') | default('16Gi', true) }}"
arcgis_storage_size_indexer: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_INDEXER') | default('16Gi', true) }}"
arcgis_storage_size_sharing: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_SHARING') | default('16Gi', true) }}"
arcgis_storage_size_prometheus: "{{ lookup('env', 'ARCGIS_STORAGE_SIZE_PROMETHEUS') | default('30Gi', true) }}"

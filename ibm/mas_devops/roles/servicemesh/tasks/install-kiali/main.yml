---
# install-kiali/main.yml
# Installs the Kiali operator and creates a Kiali instance in the
# Istio control-plane namespace. Called from install/main.yml when
# install_kiali is true, or directly via servicemesh_action=install-kiali.
#
# Steps:
#   1. Subscribe to the Kiali operator via OLM
#   2. Ensure the Istio control-plane namespace exists
#   3. Create the Kiali instance
# -----------------------------------------------------------------------------

# 1. Subscribe to the Kiali operator via OLM
# -----------------------------------------------------------------------------
- name: "install-kiali : Create Kiali {{ kiali_channel }} Subscription"
  ibm.mas_devops.apply_subscription:
    namespace: "openshift-operators"
    package_name: kiali-ossm
    package_channel: "{{ kiali_channel }}"
    catalog_source: redhat-operators
    catalog_source_namespace: openshift-marketplace
    starting_csv: "{{ kiali_starting_csv }}"
    install_plan_approval: Automatic
  register: subscription

# 2. Ensure the Istio control-plane namespace exists
# -----------------------------------------------------------------------------
- name: "install-kiali : Ensure namespace {{ servicemesh_namespace }} exists"
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ servicemesh_namespace }}"

# 3. Create the Kiali instance
# -----------------------------------------------------------------------------
- name: "install-kiali : Apply Kiali instance"
  kubernetes.core.k8s:
    template: "templates/kiali.yml.j2"
    wait: yes
    wait_timeout: 120
    wait_condition:
      status: "True"
      type: Successful

---
# install/main.yml
# Installs Red Hat OpenShift Service Mesh (OSSM v3 / Sail Operator).
# Optionally installs Kiali when install_kiali is true.
#
# Steps:
#   1. Subscribe to the Service Mesh operator via OLM
#   2. Create required namespaces (istio-system, istio-cni)
#   3. Create the Istio control-plane instance
#   4. Create the IstioCNI plugin instance
#   5. Optionally install Kiali
# -----------------------------------------------------------------------------

# 1. Subscribe to the Service Mesh operator via OLM
# -----------------------------------------------------------------------------
- name: "install : Create Service Mesh {{ servicemesh_channel }} Subscription"
  ibm.mas_devops.apply_subscription:
    namespace: "openshift-operators"
    package_name: servicemeshoperator3
    package_channel: "{{ servicemesh_channel }}"
    catalog_source: redhat-operators
    catalog_source_namespace: openshift-marketplace
    starting_csv: "{{ servicemesh_starting_csv }}"
    install_plan_approval: Automatic
  register: subscription

# 2. Create required namespaces
# -----------------------------------------------------------------------------
- name: "install : Create Istio control-plane namespace {{ servicemesh_namespace }}"
  kubernetes.core.k8s:
    apply: yes
    template: "{{ role_path }}/../../common_templates/namespace.yml.j2"
  vars:
    namespace_name: "{{ servicemesh_namespace }}"

- name: "install : Create Istio CNI namespace {{ servicemesh_cni_namespace }}"
  kubernetes.core.k8s:
    apply: yes
    template: "{{ role_path }}/../../common_templates/namespace.yml.j2"
  vars:
    namespace_name: "{{ servicemesh_cni_namespace }}"

# 3. Create the Istio control-plane instance
# -----------------------------------------------------------------------------
- name: "install : Apply Istio control-plane instance"
  kubernetes.core.k8s:
    template: "templates/istio.yml.j2"
    wait: yes
    wait_timeout: 120
    wait_condition:
      status: "True"
      type: Ready

# 4. Create the IstioCNI plugin instance
# -----------------------------------------------------------------------------
- name: "install : Apply IstioCNI plugin instance"
  kubernetes.core.k8s:
    template: "templates/istio-cni.yml.j2"
    wait: yes
    wait_timeout: 120

# 5. Optionally install Kiali
# -----------------------------------------------------------------------------
- name: "install : Install Kiali"
  when: install_kiali
  include_tasks: tasks/install-kiali/main.yml

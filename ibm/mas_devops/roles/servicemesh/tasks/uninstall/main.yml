---
# uninstall/main.yml
# Removes Red Hat OpenShift Service Mesh (OSSM v3), Kiali, and their
# associated namespaces from the cluster.
#
# Steps:
#   1. Delete the Kiali instance
#   2. Delete the IstioCNI plugin instance
#   3. Delete the Istio control-plane instance
#   4. Remove OLM Subscriptions and CSVs for both operators
#   5. Delete the Service Mesh namespaces
# -----------------------------------------------------------------------------

# 1. Delete the Kiali instance
# -----------------------------------------------------------------------------
- name: "uninstall : Delete Kiali instance"
  kubernetes.core.k8s:
    state: absent
    template: "templates/kiali.yml.j2"
    wait: yes
    wait_timeout: 120

# 2. Delete the IstioCNI plugin instance
# -----------------------------------------------------------------------------
- name: "uninstall : Delete IstioCNI instance"
  kubernetes.core.k8s:
    api_version: sailoperator.io/v1
    kind: IstioCNI
    name: default
    state: absent
    wait: yes
    wait_timeout: 120

# 3. Delete the Istio control-plane instance
# -----------------------------------------------------------------------------
- name: "uninstall : Delete Istio control-plane instance"
  kubernetes.core.k8s:
    template: "templates/istio.yml.j2"
    state: absent
    wait: yes
    wait_timeout: 120

# 4. Remove OLM Subscriptions and CSVs
# -----------------------------------------------------------------------------
- name: "uninstall : Delete Service Mesh Subscription"
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "openshift-operators"
    name: servicemeshoperator3
    state: absent
    wait: yes
    wait_timeout: 120

- name: "uninstall : Delete Service Mesh CSV"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "openshift-operators"
    label_selectors:
      - operators.coreos.com/servicemeshoperator3.openshift-operators

- name: "uninstall : Delete Kiali Subscription"
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "openshift-operators"
    name: kiali-ossm
    state: absent
    wait: yes
    wait_timeout: 120

- name: "uninstall : Delete Kiali CSV"
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "openshift-operators"
    label_selectors:
      - operators.coreos.com/kiali-ossm.openshift-operators

# 5. Delete the Service Mesh namespaces
# -----------------------------------------------------------------------------
- name: "uninstall : Delete Istio control-plane namespace {{ servicemesh_namespace }}"
  kubernetes.core.k8s:
    state: absent
    template: "{{ role_path }}/../../common_templates/namespace.yml.j2"
  vars:
    namespace_name: "{{ servicemesh_namespace }}"

- name: "uninstall : Delete Istio CNI namespace {{ servicemesh_cni_namespace }}"
  kubernetes.core.k8s:
    state: absent
    template: "{{ role_path }}/../../common_templates/namespace.yml.j2"
  vars:
    namespace_name: "{{ servicemesh_cni_namespace }}"

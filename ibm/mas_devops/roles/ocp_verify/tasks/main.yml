---
# 1. Check the cluster is ready
# -----------------------------------------------------------------------------
- name: Check if cluster is ready
  when: verify_cluster
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    name: version
    kind: ClusterVersion
  register: ocp_info
  retries: 60 # ~approx 1 hour before we give up
  delay: 60 # 1 minute
  until:
    - ocp_info.resources is defined
    - ocp_info.resources | json_query('[*].status.conditions[?type==`Available`][].status') | select ('match','True') | list | length == 1

# 2. Wait for all catalogsources to be healthy
# -----------------------------------------------------------------------------
- name: Check CatalogSource Status
  when: verify_catalogsources
  ibm.mas_devops.verify_catalogsources:
    retries: 30 # Allow up to 30 minutes
    delay: 60 # 1 minute

# 3. Wait for any install plans awaiting manual approval (cluster-wide), then
#    wait for all subscriptions in all namespaces to get into AtLatestKnown state
# -----------------------------------------------------------------------------
# The approval gate is the update's convergence point: subscriptions roll
# implicitly after a catalog digest update, and this is where the automation
# waits for the human to approve them (the full scope is disclosed up front,
# in any order). Under Automatic mode pending install plans fail fast with
# instructions instead of slow-failing the subscription/workload checks below.
# Gated on its own flag and off by default: it is enabled only where waiting
# is the job (the update pipeline's post-update-verify). In pure verification
# contexts (pre-flight and final checks) it must NOT run -- a pending approval
# there is not this check's problem, and inviting an approval workflow seconds
# before a catalog change would be wrong. It is a no-op when nothing is
# pending.
- name: Wait for install plan approval
  when: verify_subscription_approvals
  ibm.mas_devops.wait_for_subscription_approval:

- name: Check Subscription Status
  when: verify_subscriptions
  ibm.mas_devops.verify_subscriptions:
    retries: 25 # Allow up to 2 hours
    delay: 300 # 5 minutes

# 4. Wait for all deployments & statefulsets in all namespaces to be healthy
# -----------------------------------------------------------------------------
- name: Check Deployment & StatefulSet Status
  when: verify_workloads
  ibm.mas_devops.verify_workloads:
    retries: 40 # Allow up to 3 hours
    delay: 300 # 5 minutes

# 5. Check for router and ingress secrets
# -----------------------------------------------------------------------------
- name: "Lookup the default cluster ingress secret"
  when: verify_ingress
  include_tasks: "{{ role_path }}/../../common_tasks/get_ingress_cert.yml"

---
# 1. Wait for ccs-cr to be created
# -----------------------------------------------------------------------------
- name: "wait-ccs : Wait for ccs-cr to be created"
  kubernetes.core.k8s_info:
    api_version: ccs.cpd.ibm.com/v1beta1
    name: ccs-cr
    namespace: "{{ cpd_instance_namespace }}"
    kind: CCS
  register: ccscr_output
  until:
    - ccscr_output.resources is defined
    - ccscr_output.resources | length > 0
  retries: 60 # approx 30 minutes before we give up
  delay: 30 # seconds

# check if ccs cr is already patched
- set_fact:
    is_ccs_already_patched: "{{ ccscr_output.resources[0].spec.couchdb_resources is defined and ccscr_output.resources[0].spec.blockStorageClass is defined and ccscr_output.resources[0].spec.imagePullSecret is defined }}"

- debug:
    msg:
      - "CCS CR already patched? .............. {{ is_ccs_already_patched }}"
      - "CCS Block Storage Class .............. {{ ccscr_output.resources[0].spec.blockStorageClass | default('<undefined>', true) }}"

# 2. Apply the patch per recommendation from CP4D team
# https://github.ibm.com/NGP-TWC/ml-planning/issues/32683
# https://medium.com/@dany.drouin/scaling-watson-knowledge-catalog-on-cloud-pak-for-data-11623f41f7df
# -----------------------------------------------------------------------------
# only run following block if is_ccs_already_patched == False
- block:
    - name: "wait-ccs : Patch ccs-cr to increase resource limits"
      kubernetes.core.k8s:
        api_version: ccs.cpd.ibm.com/v1beta1
        name: ccs-cr
        namespace: "{{ cpd_instance_namespace }}"
        kind: CCS
        definition:
          spec:
            imagePullSecret: "{{ ibm_entitlement_key_secret }}"
            blockStorageClass: "{{ cpd_service_block_storage_class }}"
            fileStorageClass: "{{ cpd_service_storage_class }}"
            couchdb_resources:
              limits:
                cpu: "16"
                memory: 16Gi
              requests:
                cpu: "3"
                memory: 256Mi
            couchdb_search_resources:
              limits:
                cpu: "4"
                memory: 6Gi
              requests:
                cpu: 250m
                memory: 256Mi
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    # 3. Delete ccs-operator pod to force the reconcile from the beginning after ccs-cr is patched.
    # -----------------------------------------------------------------------------
    - name: "wait-ccs : Scale down ccs-operator"
      kubernetes.core.k8s:
        api_version: apps/v1
        name: ibm-cpd-ccs-operator
        namespace: "{{ cpd_operators_namespace }}"
        kind: Deployment
        definition:
          spec:
            replicas: 0
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: "wait-ccs : Scale up ccs-operator"
      kubernetes.core.k8s:
        api_version: apps/v1
        name: ibm-cpd-ccs-operator
        namespace: "{{ cpd_operators_namespace }}"
        kind: Deployment
        definition:
          spec:
            replicas: 1
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    # 4. Wait for ccs operator ...
    # -----------------------------------------------------------------------------
    - name: "wait-ccs : Wait for ccs-operator to be ready again (60s delay)"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        name: ibm-cpd-ccs-operator
        namespace: "{{ cpd_operators_namespace }}"
        kind: Deployment
      register: ccs_operator_lookup
      until: ccs_operator_lookup.resources[0].status.availableReplicas is defined
      retries: 20 # Approximately 20 minutes before we give up
      delay: 60 # 1 minute

  when: not is_ccs_already_patched

# 3. Patch CCS CR for CP4D 5.2.0 Hotfix
# -----------------------------------------------------------------------------
- block:
    - name: "wait-ccs : Scale down ccs-operator before applying hotfix"
      kubernetes.core.k8s:
        api_version: apps/v1
        name: ibm-cpd-ccs-operator
        namespace: "{{ cpd_operators_namespace }}"
        kind: Deployment
        definition:
          spec:
            replicas: 0
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: "wait-ccs : Patch ccs-cr with CP4D 5.2.0 hotfix images"
      kubernetes.core.k8s:
        api_version: ccs.cpd.ibm.com/v1beta1
        name: ccs-cr
        namespace: "{{ cpd_instance_namespace }}"
        kind: CCS
        definition:
          spec:
            image_digests:
              wdp_connect_connection_image: "sha256:18991b832353516349e123ecdfb0149e59e131000a9aed319946efa337a2fad7"
              wdp_connect_connector_image: "sha256:438fcdce3ede772fdf46a2598c1f802f30e7391ffced5a3223cba9ae1a947545"
              wdp_connect_flight_image: "sha256:2b7ed88915d69ec8bef7333ba86fd9b4dbbacea3c1ffaabdfc90865aeb784568"
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

    - name: "wait-ccs : Scale up ccs-operator after applying hotfix"
      kubernetes.core.k8s:
        api_version: apps/v1
        name: ibm-cpd-ccs-operator
        namespace: "{{ cpd_operators_namespace }}"
        kind: Deployment
        definition:
          spec:
            replicas: 1
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true

  when: cpd_520

# 3b. Ensure ccs-role allows 'create' on pods/exec (CPD 5.4.0+)
# -----------------------------------------------------------------------------
# On some OCP versions (e.g. 4.22) the ccs-role Role created by the CCS operator has
# pods/exec without the 'create' verb, so the operator fails with "Handshake status 403
# Forbidden" at task 'Setup couchdb wdp-couchdb cluster'. Exec is a POST (create) on the
# pods/exec subresource. The role is only patched when the permission is actually missing,
# so clusters that are not affected are left untouched.
- name: "wait-ccs : Ensure ccs-role grants 'create' on pods/exec"
  when: cpd_product_version is version('5.4.0', '>=')
  block:
    - name: "wait-ccs : Wait for ccs-role to exist"
      kubernetes.core.k8s_info:
        api_version: rbac.authorization.k8s.io/v1
        kind: Role
        name: ccs-role
        namespace: "{{ cpd_instance_namespace }}"
      register: ccs_role_lookup
      until:
        - ccs_role_lookup.resources is defined
        - ccs_role_lookup.resources | length > 0
      retries: 60 # approx 10 minutes before we give up waiting
      delay: 10 # seconds
      failed_when: false

    - name: "wait-ccs : Warn if ccs-role was not found"
      when: ccs_role_lookup.resources is not defined or ccs_role_lookup.resources | length == 0
      debug:
        msg: "WARNING: ccs-role not found in {{ cpd_instance_namespace }}; pods/exec patch skipped. If ccsStatus fails with 403 Forbidden on wdp-couchdb-0, add 'create' to the pods/exec rule of ccs-role manually."

    - name: "wait-ccs : Check whether ccs-role already allows 'create' on pods/exec"
      when:
        - ccs_role_lookup.resources is defined
        - ccs_role_lookup.resources | length > 0
      set_fact:
        ccs_role_exec_ok: >-
          {%- set ns = namespace(ok=false) -%}
          {%- for rule in (ccs_role_lookup.resources[0].rules | default([])) -%}
          {%- if ('pods/exec' in (rule.resources | default([])) or '*' in (rule.resources | default([])))
                 and ('create' in (rule.verbs | default([])) or '*' in (rule.verbs | default([]))) -%}
          {%- set ns.ok = true -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.ok }}

    - name: "wait-ccs : Add 'create' on pods/exec to ccs-role"
      when:
        - ccs_role_lookup.resources is defined
        - ccs_role_lookup.resources | length > 0
        - not (ccs_role_exec_ok | default(false) | bool)
      kubernetes.core.k8s_json_patch:
        api_version: rbac.authorization.k8s.io/v1
        kind: Role
        name: ccs-role
        namespace: "{{ cpd_instance_namespace }}"
        patch:
          - op: add
            path: /rules/-
            value:
              apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create

- include_tasks: "tasks/wait/wait-opensearch.yml"
  when:
    - not skip_ibm_entitlement_injection
    - cpd_52_or_higher

- include_tasks: "tasks/wait/wait-elasticsearch.yml"
  when:
    - not skip_ibm_entitlement_injection
    - cpd_51

# 5. Wait for CCS CR to be ready
# -----------------------------------------------------------------------------
# Note: We can't fail early when we see Failed status, as the operator will
# report failed multiple times during initial reconcile.
- name: "wait-ccs : Wait for ccsStatus 'Completed' (5m interval)"
  kubernetes.core.k8s_info:
    api_version: "ccs.cpd.ibm.com/v1beta1"
    kind: CCS
    name: "ccs-cr"
    namespace: "{{ cpd_instance_namespace }}"
  register: ccs_cr_lookup
  until:
    - ccs_cr_lookup.resources is defined
    - ccs_cr_lookup.resources | length == 1
    - ccs_cr_lookup.resources[0].status is defined
    - ccs_cr_lookup.resources[0].status.ccsStatus is defined
    - ccs_cr_lookup.resources[0].status.ccsStatus == "Completed" #  or ccs_cr_lookup.resources[0].status.wmlStatus == "Failed"
  retries: 50 # Just over 4 hours
  delay: 300 # Every 5 minutes

- name: "wait-ccs : Check that the CCS ccsStatus is 'Completed'"
  assert:
    that: ccs_cr_lookup.resources[0].status.ccsStatus == "Completed"
    fail_msg: "CCS install failed (ccsStatus)"

---
# 1. Create olm-utils-cm config maps
# -----------------------------------------------------------------------------
# These contains the version info for all CPD related services and dependencies
# This will be used by the CPD operators to automatically set the target versions
# to be installed/upgraded
- name: "Create olm-utils-cm config map for Cloud Pak for Data release {{ cpd_product_version }}"
  kubernetes.core.k8s:
    apply: yes
    template: "{{ role_path }}/../cp4d/templates/config_maps/olm-utils-cm-{{ cpd_product_version }}.yml.j2"

- name: "Lookup olm-utils-cm config map to map versioning matrix for Cloud Pak for Data services release {{ cpd_product_version }}"
  kubernetes.core.k8s_info:
    api_version: v1
    name: "olm-utils-cm"
    kind: ConfigMap
    namespace: "{{ cpd_instance_namespace }}"
  register: cpd_cm_info

- set_fact:
    cpd_components_meta: "{{ cpd_cm_info.resources[0].data.release_components_meta | from_yaml }}"
    cpd_assembly_name: "{{ cpd_service_info[cpd_service_name].assembly_name }}"
    cpd_service_package_name: "{{ cpd_service_info[cpd_service_name].package_name }}"
    cpd_service_csv_name: "{{ cpd_service_info[cpd_service_name].csv_name }}"
    cpd_service_kind: "{{ cpd_service_info[cpd_service_name].crd_kind }}"
    cpd_service_cr_name: "{{ cpd_service_info[cpd_service_name].cr_name }}"
    cpd_service_api_version: "{{ cpd_service_info[cpd_service_name].api_version }}"

- name: "Set {{ cpd_service_name }} versions for cr, csv and sub_channel"
  set_fact:
    cpd_service_cr_version: "{{ cpd_components_meta[cpd_assembly_name].cr_version }}"
    cpd_service_csv_version: "{{ cpd_components_meta[cpd_assembly_name].csv_version }}"
    cpd_service_channel: "{{ cpd_components_meta[cpd_assembly_name].sub_channel | default(cpd_service_info[cpd_service_name].sub_channel, true) }}" # search sub_channel in olm-utils-cm, if does not exist then use the default

# Debug upgrade or new install
- name: "Lookup existing {{ cpd_service_kind }} CR named '{{ cpd_service_cr_name }}'"
  kubernetes.core.k8s_info:
    api_version: "{{ cpd_service_api_version }}"
    name: "{{ cpd_service_cr_name }}"
    namespace: "{{ cpd_instance_namespace }}"
    kind: "{{ cpd_service_kind }}"
  register: existing_cpd_service_lookup

- debug:
    var: existing_cpd_service_lookup

# This is needed to understand existing and target versions for the upgrade
- name: Set existing '{{ cpd_service_cr_name }}' version if needed
  when:
    - existing_cpd_service_lookup.resources is defined
    - existing_cpd_service_lookup.resources | length > 0
    - existing_cpd_service_lookup.resources[0].spec.version is defined
    - existing_cpd_service_lookup.resources[0].spec.version != ""
  set_fact:
    existing_cpd_service_cr_version: "{{ existing_cpd_service_lookup.resources[0].spec.version }}"
    existing_cpd_service_minor_version: "{{ existing_cpd_service_lookup.resources[0].spec.version | regex_search('(?<=)(.*)(?=..)') }}"

- name: "Debug existing {{ cpd_service_name }} installed version"
  when: existing_cpd_service_cr_version is defined
  debug:
    var: existing_cpd_service_cr_version

- name: Check if this is a new install or upgrade
  set_fact:
    is_cpd_service_upgrade: "{{ (existing_cpd_service_cr_version is defined and existing_cpd_service_cr_version is version(cpd_service_cr_version, '<')) | ternary(true, false) | bool }}"


# 2. Load default storage classes and debug
# -----------------------------------------------------------------------------
- name: "Determine storage classes"
  include_tasks: "determine-storage-classes.yml"

- name: "Debug: Cloud Pak for Data service '{{ cpd_service_name }}' - version {{ cpd_product_version }} : Debug information"
  debug:
    msg:
      - "CPD Operator Namespace ................. {{ cpd_operators_namespace }}"
      - "CPD Instance Namespace ................. {{ cpd_instance_namespace }}"
      - "CPD Service Name ....................... {{ cpd_service_name }}"
      - "CPD Service File storage class ......... {{ cpd_service_storage_class }}"
      - "CPD Service Block storage class ........ {{ cpd_service_block_storage_class | default('N/A', true) }}"
      - "CPD Service Action ..................... {{ (is_cpd_service_upgrade) | ternary('Upgrading from version '+existing_cpd_service_cr_version | default('N/A', true), 'New Install') }}"
      - "CPD Service Version .................... {{ cpd_service_cr_version }}"
      - "CPD Service Subscription channel ....... {{ cpd_service_channel }}"
      - "CPD Service CSV name ................... {{ cpd_service_csv_name }}"
      - "CPD Service CSV version ................ {{ cpd_service_csv_version }}"


# 3. Run Pre-req task
# -----------------------------------------------------------------------------
# Only Watson Discovery has special pre-reqs currently (EDB Postgress in CPD 4.5 and 4.6)
- name: Run Install Prereqs
  when:
    - cpd_service_name is in ['wd', 'spss']
  include_tasks: "prereqs/prereqs-{{ cpd_service_name }}.yml"


# 4. Install Operand Configs and Operand Registries
# -----------------------------------------------------------------------------
# If it's CPD 4.6, only Watson Studio, Watson Discovery and Cognos Analytics requires these operand configs to be applied via this automation.
# If it's CPD 4.5, only Watson Studio and Watson Discovery requires these operand configs to be applied via this automation.
# If it's CPD 4.0.x, no need to apply operand configs at all, as these will be automatically be set while installing services requiring it.
- name: Install Operand Configs and Operand Registries
  kubernetes.core.k8s:
    apply: yes
    template: "templates/operand_config/cpd_dependencies.yml.j2"
  when: cpd_service_name is in ['wd', 'wsl', 'ca', 'spss']

# Pre-create Cloud Pak for Data service accounts including ibm-entitlement-key in imagePullSecrets
# -----------------------------------------------------------------------------
- name: Pre-create Cloud Pak for Data service accounts including ibm-entitlement-key in imagePullSecrets
  include_tasks: "tasks/create-cpd-service-accounts.yml"
  when: not skip_ibm_entitlement_injection

# TODO: Add code to check if existing sub cvs is different from the olm-utils, if so then delete sub otherwise skip sub deletion
# Clean up old ibm-common-service operator
- name: "Clean up existing CP4D Service 'cpd-{{ cpd_service_name }}-operator' csv from {{ cpd_operators_namespace }}"
  vars:
    operator_name: "{{ cpd_service_package_name }}"
    operator_namespace: "{{ cpd_operators_namespace }}"
    operator_expected_csv: "{{ cpd_service_package_name }}.v{{ cpd_service_csv_version }}"
  include_tasks: "{{ role_path }}/../cp4d/tasks/prereqs/uninstall-operator.yml"


# 5. Install CP4D Service Subscriptions
# -----------------------------------------------------------------------------
- name: "Create CP4D Service Subscription"
  ibm.mas_devops.apply_subscription:
    namespace: "{{ cpd_operators_namespace }}"
    package_name: "{{ cpd_service_package_name }}"
    package_channel: "{{ cpd_service_channel }}"
    catalog_source: "{{ cpd_service_info[cpd_service_name].catalog_source }}"
  register: subscription

# Install dependency subscriptions for services requiring CCS
# (Watson Studio, Watson Machine Learning, Cognos Analytics)
# For each subscription: look up any existing sub, delete it (plus its orphaned CSV)
# if InstallPlanMissing=True, then create fresh via apply_subscription.
# This avoids OLM getting stuck with a stale subscription that has no InstallPlan.

- name: "Pre-flight: lookup existing CCS subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ cpd_operators_namespace }}"
    label_selectors:
      - "operators.coreos.com/ibm-cpd-ccs.{{ cpd_operators_namespace }}"
  register: existing_ccs_sub

- when:
    - cpd_service_name is in cpd_services_requiring_ccs
    - existing_ccs_sub.resources | length > 0
    - existing_ccs_sub.resources[0].status.conditions | default([]) | selectattr('type','equalto','InstallPlanMissing') | selectattr('status','equalto','True') | list | length > 0
  block:
    - name: "Pre-flight: delete CCS subscription (InstallPlanMissing=True)"
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ existing_ccs_sub.resources[0].metadata.name }}"
        namespace: "{{ cpd_operators_namespace }}"

    - name: "Pre-flight: delete orphaned CCS CSV"
      when: existing_ccs_sub.resources[0].status.installedCSV | default('') != ''
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ existing_ccs_sub.resources[0].status.installedCSV }}"
        namespace: "{{ cpd_operators_namespace }}"

- name: "Create CCS Subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  ibm.mas_devops.apply_subscription:
    namespace: "{{ cpd_operators_namespace }}"
    package_name: "ibm-cpd-ccs"
    package_channel: "{{ cpd_components_meta.ccs.sub_channel }}"
    catalog_source: "ibm-operator-catalog"

- name: "Pre-flight: lookup existing DataRefinery subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ cpd_operators_namespace }}"
    label_selectors:
      - "operators.coreos.com/ibm-cpd-datarefinery.{{ cpd_operators_namespace }}"
  register: existing_datarefinery_sub

- when:
    - cpd_service_name is in cpd_services_requiring_ccs
    - existing_datarefinery_sub.resources | length > 0
    - existing_datarefinery_sub.resources[0].status.conditions | default([]) | selectattr('type','equalto','InstallPlanMissing') | selectattr('status','equalto','True') | list | length > 0
  block:
    - name: "Pre-flight: delete DataRefinery subscription (InstallPlanMissing=True)"
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ existing_datarefinery_sub.resources[0].metadata.name }}"
        namespace: "{{ cpd_operators_namespace }}"

    - name: "Pre-flight: delete orphaned DataRefinery CSV"
      when: existing_datarefinery_sub.resources[0].status.installedCSV | default('') != ''
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ existing_datarefinery_sub.resources[0].status.installedCSV }}"
        namespace: "{{ cpd_operators_namespace }}"

- name: "Create DataRefinery Subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  ibm.mas_devops.apply_subscription:
    namespace: "{{ cpd_operators_namespace }}"
    package_name: "ibm-cpd-datarefinery"
    package_channel: "{{ cpd_components_meta.datarefinery.sub_channel }}"
    catalog_source: "ibm-operator-catalog"

- name: "Pre-flight: lookup existing WS Runtimes subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ cpd_operators_namespace }}"
    label_selectors:
      - "operators.coreos.com/ibm-cpd-ws-runtimes.{{ cpd_operators_namespace }}"
  register: existing_wsruntimes_sub

- when:
    - cpd_service_name is in cpd_services_requiring_ccs
    - existing_wsruntimes_sub.resources | length > 0
    - existing_wsruntimes_sub.resources[0].status.conditions | default([]) | selectattr('type','equalto','InstallPlanMissing') | selectattr('status','equalto','True') | list | length > 0
  block:
    - name: "Pre-flight: delete WS Runtimes subscription (InstallPlanMissing=True)"
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ existing_wsruntimes_sub.resources[0].metadata.name }}"
        namespace: "{{ cpd_operators_namespace }}"

    - name: "Pre-flight: delete orphaned WS Runtimes CSV"
      when: existing_wsruntimes_sub.resources[0].status.installedCSV | default('') != ''
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ existing_wsruntimes_sub.resources[0].status.installedCSV }}"
        namespace: "{{ cpd_operators_namespace }}"

- name: "Create WS Runtimes Subscription"
  when: cpd_service_name is in cpd_services_requiring_ccs
  ibm.mas_devops.apply_subscription:
    namespace: "{{ cpd_operators_namespace }}"
    package_name: "ibm-cpd-ws-runtimes"
    package_channel: "{{ cpd_components_meta.ws_runtimes.sub_channel }}"
    catalog_source: "ibm-operator-catalog"

# Install Elasticsearch subscription for specific services
- name: "Pre-flight: delete Elasticsearch subscription and orphaned CSV if InstallPlanMissing=True"
  when: cpd_service_name is in ['wsl','wml','ca']
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ cpd_operators_namespace }}"
    label_selectors:
      - "operators.coreos.com/ibm-elasticsearch-operator.{{ cpd_operators_namespace }}"
  register: existing_elasticsearch_sub

- when:
    - cpd_service_name is in ['wsl','wml','ca']
    - existing_elasticsearch_sub.resources | length > 0
    - existing_elasticsearch_sub.resources[0].status.conditions | default([]) | selectattr('type','equalto','InstallPlanMissing') | selectattr('status','equalto','True') | list | length > 0
  block:
    - name: "Pre-flight: delete Elasticsearch subscription (InstallPlanMissing=True)"
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ existing_elasticsearch_sub.resources[0].metadata.name }}"
        namespace: "{{ cpd_operators_namespace }}"

    - name: "Pre-flight: delete orphaned Elasticsearch CSV"
      when: existing_elasticsearch_sub.resources[0].status.installedCSV | default('') != ''
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ existing_elasticsearch_sub.resources[0].status.installedCSV }}"
        namespace: "{{ cpd_operators_namespace }}"

- name: "Create Elasticsearch Subscription"
  when: cpd_service_name is in ['wsl','wml','ca']
  ibm.mas_devops.apply_subscription:
    namespace: "{{ cpd_operators_namespace }}"
    package_name: "ibm-elasticsearch-operator"
    package_channel: "{{ cpd_components_meta.opencontent_elasticsearch.sub_channel }}"
    catalog_source: "ibm-operator-catalog"


# 6. Wait until the Service CRD is available
# -----------------------------------------------------------------------------
- name: "Wait until the {{ cpd_service_info[cpd_service_name].crd_name }} CRD is available"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    name: "{{ cpd_service_info[cpd_service_name].crd_name }}"
    kind: CustomResourceDefinition
    wait: yes
    wait_sleep: 10
    wait_timeout: 300 # 5 mins until we give up waiting for the CRD to get into the expected state
    wait_condition:
      type: NamesAccepted
      status: "True"
  register: service_crd_info
  retries: 120 # ~approx 5 minutes before we give up waiting for the CRD to be created
  delay: 5 # seconds
  until:
    - service_crd_info.resources is defined
    - service_crd_info.resources | length > 0


# 7. Install CP4D Service CRs
# -----------------------------------------------------------------------------
- name: "Install Service CR"
  kubernetes.core.k8s:
    apply: yes
    template: "templates/services/{{ cpd_service_name }}.yml.j2"

# 7a. Explicitly patch CAService (ca-addon-cr) version on upgrade
# -----------------------------------------------------------------------------
# apply: yes on the template above does not reliably update spec.version on an existing
# CAService CR because the field is owned by the operator's field manager (OpenAPI-Generator).
# An explicit merge patch forces the version and ccs_operand_version fields to the new values
# so the ibm-ca-operator picks up the upgrade.
# Gate: uses per-resource version comparison (not is_cpd_service_upgrade) so this fires even
# on re-runs where ca-addon-cr was already patched in a prior interrupted run.
- name: "cp4d_service : Lookup current CAService/ca-addon-cr version"
  when: cpd_service_name == 'ca'
  kubernetes.core.k8s_info:
    api_version: ca.cpd.ibm.com/v1
    kind: CAService
    name: ca-addon-cr
    namespace: "{{ cpd_instance_namespace }}"
  register: ca_addon_current

- name: "cp4d_service : Patch Cognos Analytics addon (CAService/ca-addon-cr) to version {{ cpd_components_meta.cognos_analytics.cr_version }}"
  when:
    - cpd_service_name == 'ca'
    - ca_addon_current.resources | length > 0
    - ca_addon_current.resources[0].spec.version is version(cpd_components_meta.cognos_analytics.cr_version, '<')
  kubernetes.core.k8s:
    api_version: ca.cpd.ibm.com/v1
    kind: CAService
    name: ca-addon-cr
    namespace: "{{ cpd_instance_namespace }}"
    merge_type: merge
    definition:
      spec:
        version: "{{ cpd_components_meta.cognos_analytics.cr_version }}"
        ccs_operand_version: "{{ cpd_components_meta.ccs.cr_version }}"

- name: "cp4d_service : Wait for Cognos Analytics addon (CAService/ca-addon-cr) to reach caAddonStatus 'Completed' and reconciled version (5m interval)"
  when:
    - cpd_service_name == 'ca'
    - ca_addon_current.resources | length > 0
    - ca_addon_current.resources[0].spec.version is version(cpd_components_meta.cognos_analytics.cr_version, '<')
  kubernetes.core.k8s_info:
    api_version: ca.cpd.ibm.com/v1
    kind: CAService
    name: ca-addon-cr
    namespace: "{{ cpd_instance_namespace }}"
  register: ca_addon_upgrade_wait
  retries: 10  # Up to ~50 minutes
  delay: 300   # Every 5 minutes
  until:
    - ca_addon_upgrade_wait.resources is defined
    - ca_addon_upgrade_wait.resources | length == 1
    - ca_addon_upgrade_wait.resources[0].status is defined
    - ca_addon_upgrade_wait.resources[0].status.caAddonStatus is defined
    - ca_addon_upgrade_wait.resources[0].status.caAddonStatus == "Completed"
    - ca_addon_upgrade_wait.resources[0].status.versions is defined
    - ca_addon_upgrade_wait.resources[0].status.versions.reconciled is version(cpd_components_meta.cognos_analytics.cr_version, '>=')

- name: "cp4d_service : Assert Cognos Analytics addon (CAService/ca-addon-cr) reached caAddonStatus 'Completed'"
  when:
    - cpd_service_name == 'ca'
    - ca_addon_current.resources | length > 0
    - ca_addon_current.resources[0].spec.version is version(cpd_components_meta.cognos_analytics.cr_version, '<')
  assert:
    that:
      - ca_addon_upgrade_wait.resources[0].status.caAddonStatus == "Completed"
      - ca_addon_upgrade_wait.resources[0].status.versions.reconciled is version(cpd_components_meta.cognos_analytics.cr_version, '>=')
    fail_msg: "Cognos Analytics addon (CAService/ca-addon-cr) failed to upgrade (caAddonStatus != Completed or reconciled version mismatch)"

# 7a-post. Verify CCS is ready at target version before patching tenant instances
# -----------------------------------------------------------------------------
# ca-addon-cr reconcile upgrades the CCS dependency. We must confirm ccs-cr has also
# reached ccsStatus=Completed at the target version before touching CAServiceInstance CRs,
# otherwise the ibm-ca-operator will reject the instance upgrade with a version mismatch.
- name: "cp4d_service : Wait for CCS (ccs-cr) to reach ccsStatus 'Completed' at version {{ cpd_components_meta.ccs.cr_version }} (5m interval)"
  when: cpd_service_name == 'ca'
  kubernetes.core.k8s_info:
    api_version: ccs.cpd.ibm.com/v1beta1
    kind: CCS
    name: ccs-cr
    namespace: "{{ cpd_instance_namespace }}"
  register: ccs_readiness_wait
  retries: 12  # Up to ~60 minutes
  delay: 300   # Every 5 minutes
  until:
    - ccs_readiness_wait.resources is defined
    - ccs_readiness_wait.resources | length == 1
    - ccs_readiness_wait.resources[0].status is defined
    - ccs_readiness_wait.resources[0].status.ccsStatus is defined
    - ccs_readiness_wait.resources[0].status.ccsStatus == "Completed"
    - ccs_readiness_wait.resources[0].spec.version is version(cpd_components_meta.ccs.cr_version, '>=')

- name: "cp4d_service : Assert CCS (ccs-cr) is ready at target version {{ cpd_components_meta.ccs.cr_version }}"
  when: cpd_service_name == 'ca'
  assert:
    that:
      - ccs_readiness_wait.resources[0].status.ccsStatus == "Completed"
      - ccs_readiness_wait.resources[0].spec.version is version(cpd_components_meta.ccs.cr_version, '>=')
    fail_msg: "CCS (ccs-cr) is not ready at target version {{ cpd_components_meta.ccs.cr_version }} (ccsStatus={{ ccs_readiness_wait.resources[0].status.ccsStatus }}, version={{ ccs_readiness_wait.resources[0].spec.version }})"

# This is just a validation step to prevent the "wait tasks" to run before it gives enough time for the new cpd service operator version
# to start reconciling in case of an upgrade, otherwise it might not have given enough time for it to process the new version to be upgrade
# while its status' cr might still show 'completed'.
# With this, we ensure the new cpd service csv version operator is up and running with the new cr version before we check the cpd cr status
- name: "Wait CPD services subscription installedCSV version at {{ expected_installed_csv }}"
  vars:
    expected_installed_csv: "{{ cpd_service_info[cpd_service_name].csv_name }}.v{{ cpd_service_csv_version }}"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    namespace: "{{ cpd_operators_namespace }}"
    name: "{{ cpd_service_package_name }}"
    label_selectors:
      - "operators.coreos.com/{{ cpd_service_package_name }}.{{ cpd_operators_namespace }}"
  register: cpd_sub_info
  retries: 20
  delay: 60 # Retry for approx 20 minutes (60s * 20 attempts) before giving up
  until:
    - cpd_sub_info.resources is defined
    - cpd_sub_info.resources | length > 0
    - cpd_sub_info.resources[0].status is defined
    - cpd_sub_info.resources[0].status.installedCSV is defined
    - cpd_sub_info.resources[0].status.installedCSV == expected_installed_csv

# some service operators like wd takes quite some time to start reconciling the upgrade and set cr status to in progress
# so adding a wait to let operator have enough time to set the proper cr status, this entire install/upgrade process will take much more than 5 minutes anyway...
- name: "Pause for 5 minutes before checking cpd service {{ cpd_service_name }} cr status..."
  pause:
    minutes: 5


# 7b. Upgrade existing Cognos Analytics tenant instances (CAServiceInstance)
# -----------------------------------------------------------------------------
# When Cognos Analytics (ca) is upgraded, the CAService addon CR (ca-addon-cr) is patched
# above in step 7 via ca.yml.j2. However, user-created CAServiceInstance CRs (one per tenant,
# created from the CP4D UI) are not owned by the addon and retain their old spec.version
# unless explicitly patched here.
# Gate: only runs when cpd_service_name == 'ca'. Uses per-item version comparison instead of
# is_cpd_service_upgrade so it still fires when ca-addon-cr was already patched in a prior
# interrupted run (in which case is_cpd_service_upgrade would be False).
# Re-fetch instances here (after ca-addon-cr and CCS are confirmed complete) so the version
# comparison uses live data, not stale data from the pre-patch lookup.
- name: "cp4d_service : Discover existing Cognos Analytics tenant instances (CAServiceInstance) in {{ cpd_instance_namespace }}"
  when:
    - cpd_service_name == 'ca'
  kubernetes.core.k8s_info:
    api_version: ca.cpd.ibm.com/v1
    kind: CAServiceInstance
    namespace: "{{ cpd_instance_namespace }}"
  register: existing_ca_instances

- name: "cp4d_service : Debug - Cognos Analytics tenant instances found in {{ cpd_instance_namespace }}"
  when:
    - cpd_service_name == 'ca'
  debug:
    msg: >-
      {{ (existing_ca_instances.resources | length > 0)
         | ternary(
             'Found ' + (existing_ca_instances.resources | length | string) + ' CAServiceInstance(s): '
             + (existing_ca_instances.resources | map(attribute='metadata.name') | list | join(', '))
             + ' (target version: ' + cpd_components_meta.cognos_analytics.cr_version + ')',
             'No CAServiceInstance CRs found in ' + cpd_instance_namespace + ' - skipping Cognos tenant instance upgrade'
           ) }}

- name: "cp4d_service : Patch stale Cognos Analytics tenant instances to version {{ cpd_components_meta.cognos_analytics.cr_version }}"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
    - item.spec.version is version(cpd_components_meta.cognos_analytics.cr_version, '<')
  kubernetes.core.k8s:
    api_version: ca.cpd.ibm.com/v1
    kind: CAServiceInstance
    name: "{{ item.metadata.name }}"
    namespace: "{{ cpd_instance_namespace }}"
    merge_type: merge
    definition:
      spec:
        version: "{{ cpd_components_meta.cognos_analytics.cr_version }}"
  loop: "{{ existing_ca_instances.resources }}"
  loop_control:
    label: "{{ item.metadata.name }} ({{ item.spec.version }} → {{ cpd_components_meta.cognos_analytics.cr_version }})"

# Wait uses retries: 24 x delay: 300 = up to 120 minutes per instance.
# CAServiceInstance upgrades run a full Ansible playbook inside the operator pod and can
# easily take 60-90 minutes. The when condition uses item.metadata.name (stable) not
# item.spec.version (stale pre-patch data) so the wait always fires for patched instances.
# Also checks status.versions.reconciled >= target to avoid a stale Completed from the
# previous version's reconcile cycle.
- name: "cp4d_service : Wait for Cognos Analytics tenant instances to reach caStatus 'Completed' (5m interval, up to 2h)"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
  kubernetes.core.k8s_info:
    api_version: ca.cpd.ibm.com/v1
    kind: CAServiceInstance
    name: "{{ item.metadata.name }}"
    namespace: "{{ cpd_instance_namespace }}"
  register: ca_instance_upgrade_wait
  retries: 24  # Up to ~120 minutes per instance
  delay: 300   # Every 5 minutes
  until:
    - ca_instance_upgrade_wait.resources is defined
    - ca_instance_upgrade_wait.resources | length == 1
    - ca_instance_upgrade_wait.resources[0].status is defined
    - ca_instance_upgrade_wait.resources[0].status.caStatus is defined
    - ca_instance_upgrade_wait.resources[0].status.caStatus == "Completed"
    - ca_instance_upgrade_wait.resources[0].status.versions is defined
    - ca_instance_upgrade_wait.resources[0].status.versions.reconciled is version(cpd_components_meta.cognos_analytics.cr_version, '>=')
  loop: "{{ existing_ca_instances.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: "cp4d_service : Assert all Cognos Analytics tenant instances reached caStatus 'Completed'"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
  assert:
    that: ca_instance_upgrade_wait.results | map(attribute='resources') | map('first') | map(attribute='status.caStatus') | list | unique == ['Completed']
    fail_msg: "One or more Cognos Analytics tenant instances failed to upgrade (caStatus != Completed)"

# 7c. Sync zen metastore service_instance_version after CAServiceInstance upgrade
# -----------------------------------------------------------------------------
# The zen metastore (zen-metastore-edb) records the service instance version at
# provision time but is NOT updated by the CA operator when a CAServiceInstance is
# upgraded. This leaves service_instance_version and
# create_arguments->zenServiceInstanceInfo->zenServiceInstanceVersion stale,
# which causes the CP4D UI and any automation reading the metastore to show the
# old version. We fix this by running a direct postgres UPDATE via kubectl exec
# immediately after each instance reaches caStatus=Completed.
- name: "cp4d_service : Lookup zen metastore credentials"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: zen-metastore-edb-superuser
    namespace: "{{ cpd_instance_namespace }}"
  register: zen_metastore_secret

- name: "cp4d_service : Lookup zen metastore primary pod"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cpd_instance_namespace }}"
    label_selectors:
      - "postgresql=zen-metastore-edb"
      - "role=primary"
  register: zen_metastore_primary_pod

- name: "cp4d_service : Sync zen metastore version for upgraded CAServiceInstance CRs"
  when:
    - cpd_service_name == 'ca'
    - existing_ca_instances.resources is defined
    - existing_ca_instances.resources | length > 0
    - zen_metastore_secret.resources is defined
    - zen_metastore_secret.resources | length > 0
    - zen_metastore_primary_pod.resources is defined
    - zen_metastore_primary_pod.resources | length > 0
  no_log: true
  vars:
    zen_instance_id: "{{ item.metadata.name | regex_replace('^ca(\\d+)-cr$', '\\1') }}"
    zen_target_version: "{{ cpd_components_meta.cognos_analytics.cr_version }}"
    zen_primary_pod: "{{ zen_metastore_primary_pod.resources[0].metadata.name }}"

  kubernetes.core.k8s_exec:
    namespace: "{{ cpd_instance_namespace }}"
    pod: "{{ zen_primary_pod }}"
    container: postgres
    command: >-
      psql -U postgres -d zen -c
      "UPDATE service_instances
      SET service_instance_version = '{{ zen_target_version }}',
      create_arguments = jsonb_set(
      create_arguments,
      '{zenServiceInstanceInfo,zenServiceInstanceVersion}',
      to_jsonb('{{ zen_target_version }}'::text)
      ),
      updated_at = NOW()
      WHERE id = {{ zen_instance_id }};"
  loop: "{{ existing_ca_instances.resources }}"
  loop_control:
    label: "{{ item.metadata.name }} → metastore version {{ cpd_components_meta.cognos_analytics.cr_version }}"

# 8. Wait for CP4D Service to be ready
# -----------------------------------------------------------------------------
- name: "Wait for the service to be ready"
  include_tasks: "wait/wait-{{ cpd_service_name }}.yml"


# 9. Provide CP4D dashboard URL
# -----------------------------------------------------------------------------
- name: "Lookup admin credentials if they haven't been provided already"
  include_tasks: "{{ role_path }}/../cp4d/tasks/lookup-admin-credentials.yml"


# 10. Debug Cloud Pak for Data installation details
# -----------------------------------------------------------------------------
- name: "Debug : Cloud Pak for Data {{ cpd_product_version }} details"
  debug:
    msg:
      - "CP4D Dashboard ......................... {{ cpd_admin_url }}"
      - "CP4D Admin Username .................... {{ cpd_admin_username }}"
      - "CP4D Admin Password .................... {{ cpd_admin_password_text }}"
      - "CP4D Service Installed ................. {{ cpd_service_name }}"


# 11. Generate MAS Config
# -----------------------------------------------------------------------------
# Only Watson Studio and Watson Discovery generate a configuration in config
# folder for later usage
- name: Generate MAS Config into {{ mas_config_dir }} folder
  when:
    - mas_instance_id is defined and mas_instance_id != ""
    - mas_config_dir is defined and mas_config_dir != ""
    - cpd_service_name is in ['wsl','wd']
  include_tasks: "gencfg/gencfg-{{ cpd_service_name }}.yml"

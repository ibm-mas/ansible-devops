---
# Install a single Helm component (cluster-scoped + namespace-scoped charts)
# This task installs both the cluster-scoped chart (CRDs, ClusterRoles) and
# namespace-scoped chart (Operator, CR) for a CPD component

# Parameters expected:
# - component_name: Name of the component (e.g., 'wsl', 'ccs')
# - component_info: Component metadata from cpd_service_info

- name: "Get component metadata"
  set_fact:
    comp_info: "{{ dep_component_info | default(component_info, true) }}"
    comp_assembly: "{{ (dep_component_info | default(component_info, true)).assembly_name }}"
    comp_chart_name: "{{ (dep_component_info | default(component_info, true)).helm_chart_name }}"
    comp_cluster_chart: "{{ (dep_component_info | default(component_info, true)).helm_cluster_chart }}"
    comp_crd_name: "{{ (dep_component_info | default(component_info, true)).crd_name }}"
    comp_case_version: "{{ (dep_component_info | default(component_info, true)).case_version | default('') }}"
    helm_tls_flag: "{{ '--ca-file ' ~ lookup('env', 'HELM_REGISTRY_CA_FILE') if lookup('env', 'HELM_REGISTRY_CA_FILE') else '--insecure-skip-tls-verify' }}"

# Online: search the named helm repo for the chart version
- name: "Search for {{ component_name }} chart version {{ comp_case_version }}"
  when: not cpd_helm_airgap
  command: >
    helm search repo {{ cpd_helm_repo_name }}/{{ comp_chart_name }}
    {% if comp_case_version != '' %}--version {{ comp_case_version }}{% endif %}
    --output json
  register: chart_search
  changed_when: false

- name: "Extract chart version"
  set_fact:
    chart_version: "{{ (chart_search.stdout | from_json | first).version }}"
  when:
    - not cpd_helm_airgap
    - (chart_search.stdout | from_json | length) > 0

- name: "Fail if chart not found"
  when:
    - not cpd_helm_airgap
    - (chart_search.stdout | from_json | length) == 0
  fail:
    msg: "Chart {{ comp_chart_name }} version {{ comp_case_version }} not found in repository {{ cpd_helm_repo_name }}"

# Airgap: the registry may store charts with a build-stamped version such as
# "12.1.0+20260206.151111.23" while case_version is only "12.1.0".
# Pull Chart.yaml without specifying --version so we get the actual tag pushed
# to the registry, then use that full version string for helm template/upgrade.
- name: "Resolve chart version from OCI registry (airgap)"
  when: cpd_helm_airgap
  shell: >
    helm show chart {{ cpd_airgap_helm_repo_url }}/{{ comp_chart_name }}
    {{ helm_tls_flag }} 2>/dev/null
    | grep '^version:' | awk '{print $2}' | tr -d '"'
  register: chart_version_lookup
  changed_when: false

- name: "Set chart version from OCI registry (airgap)"
  when: cpd_helm_airgap
  set_fact:
    chart_version: "{{ chart_version_lookup.stdout | trim | default(comp_case_version) }}"

- name: "Component {{ component_name }} chart version"
  debug:
    msg:
      - "Component: {{ component_name }}"
      - "Assembly: {{ comp_assembly }}"
      - "Chart version: {{ chart_version }}"
      - "Chart name: {{ comp_chart_name }}"
      - "Cluster chart: {{ comp_cluster_chart }}"

# Build Helm values dict once — passed directly to kubernetes.core.helm and
# helm template shell commands. No temp file needed, no credentials on disk.
- name: "Set Helm values for {{ component_name }}"
  set_fact:
    helm_values:
      global:
        licenseAccept: true
        releaseVersion: "{{ cpd_product_version }}"
        operatorNamespace: "{{ cpd_operators_namespace }}"
        instanceNamespace: "{{ cpd_instance_namespace }}"
        blockStorageClass: "{{ cpd_service_block_storage_class }}"
        fileStorageClass: "{{ cpd_service_storage_class }}"
        imagePullSecret: "{{ ibm_entitlement_key_secret }}"
        imagePullPrefix: "cp.icr.io"
      "{{ comp_assembly }}":
        scaleConfig: "{{ cpd_service_scale_config }}"
        version: "{{ cpd_product_version }}"
        non_olm: true

# Install cluster-scoped chart (CRDs, ClusterRoles, etc.)
# kubernetes.core.helm only supports upgrade --install (namespace-scoped state).
# Cluster-scoped charts are applied with helm template piped to kubernetes.core.k8s
# so Ansible's connection context is used and no oc binary is required.
- name: "Render {{ component_name }} cluster-scoped chart manifests"
  when: comp_cluster_chart is defined and comp_cluster_chart != ""
  command: >
    helm template {{ component_name | replace('_', '-') }}-cluster
    {{ cpd_helm_repo_name if not cpd_helm_airgap else cpd_airgap_helm_repo_url }}/{{ comp_cluster_chart }}
    --version {{ chart_version }}
    --namespace {{ cpd_operators_namespace }}
    --set global.licenseAccept=true
    --set global.releaseVersion={{ cpd_product_version }}
    --set global.operatorNamespace={{ cpd_operators_namespace }}
    --set global.instanceNamespace={{ cpd_instance_namespace }}
    --set global.blockStorageClass={{ cpd_service_block_storage_class }}
    --set global.fileStorageClass={{ cpd_service_storage_class }}
    --set global.imagePullSecret={{ ibm_entitlement_key_secret }}
    --set global.imagePullPrefix=cp.icr.io
    --set {{ comp_assembly }}.scaleConfig={{ cpd_service_scale_config }}
    --set {{ comp_assembly }}.version={{ cpd_product_version }}
    --set {{ comp_assembly }}.non_olm=true
    {{ helm_tls_flag if cpd_helm_airgap else '' }}
  register: cluster_chart_manifests
  changed_when: false

- name: "Apply {{ component_name }} cluster-scoped chart manifests"
  when:
    - comp_cluster_chart is defined and comp_cluster_chart != ""
    - cluster_chart_manifests.stdout | length > 0
  kubernetes.core.k8s:
    state: present
    definition: "{{ cluster_chart_manifests.stdout | from_yaml_all | list }}"

- name: "Wait for {{ component_name }} CRD to be established"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ comp_crd_name }}"
  register: crd_check
  until:
    - crd_check.resources is defined
    - crd_check.resources | length > 0
    - crd_check.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | list | length > 0
  retries: 30
  delay: 10

# Install namespace-scoped chart using kubernetes.core.helm.
# Values passed as a dict — no temp file, no credentials written to disk.
# Idempotent (upgrade --install), retries handle transient helm lock errors.
- name: "Install/Upgrade {{ component_name }} namespace-scoped chart with Helm"
  when: not cpd_helm_airgap
  kubernetes.core.helm:
    name: "{{ component_name | replace('_', '-') }}"
    chart_ref: "{{ cpd_helm_repo_name }}/{{ comp_chart_name }}"
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ cpd_instance_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "{{ cpd_helm_timeout }}"
    values: "{{ helm_values }}"
  register: ns_install
  retries: 10
  delay: 60
  until: ns_install is not failed

- name: "Install/Upgrade {{ component_name }} namespace-scoped chart with Helm (airgap)"
  when: cpd_helm_airgap
  kubernetes.core.helm:
    name: "{{ component_name | replace('_', '-') }}"
    chart_ref: "{{ cpd_airgap_helm_repo_url }}/{{ comp_chart_name }}"
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ cpd_instance_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "{{ cpd_helm_timeout }}"
    values: "{{ helm_values }}"
  register: ns_install
  retries: 10
  delay: 60
  until: ns_install is not failed

- name: "{{ component_name }} Helm charts installed"
  debug:
    msg:
      - "✓ Cluster-scoped chart installed"
      - "✓ Namespace-scoped chart installed via Helm"
      - "✓ CRD established: {{ comp_crd_name }}"
      - "✓ CR will be created automatically by Helm"

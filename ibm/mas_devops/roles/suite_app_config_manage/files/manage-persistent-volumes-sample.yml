# Example persistent volume definitions for the suite_app_config_manage pvc
# action, provided via mas_manage_custom_persistent_volumes_file. Each entry
# requires pvcName, mountPath and size; storageClassName defaults to the cluster
# RWX storage class and accessModes is optional.
persistentVolumes:
  - accessModes:
      - ReadWriteMany
    mountPath: /MyMountPath
    pvcName: my-pvc-name-from-file
    size: 20Gi
    storageClassName: ibmc-file-gold-gid

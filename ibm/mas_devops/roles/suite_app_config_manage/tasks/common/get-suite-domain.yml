---
# Lookup the MAS Suite CR and set the mas_domain fact.
# Output:
#   mas_domain - the domain the MAS instance is serving on
- name: "get-suite-domain : Get Suite instance domain"
  kubernetes.core.k8s_info:
    api_version: core.mas.ibm.com/v1
    kind: Suite
    name: "{{ mas_instance_id }}"
    namespace: "mas-{{ mas_instance_id }}-core"
  register: suite_instance
  retries: 3
  delay: 10
  until:
    - suite_instance.resources is defined
    - suite_instance.resources | length > 0
    - suite_instance.resources[0].spec.domain is defined
    - suite_instance.resources[0].spec.domain | length > 0

- name: "get-suite-domain : Set MAS domain"
  set_fact:
    mas_domain: "{{ suite_instance.resources[0].spec.domain }}"
  when: mas_domain is not defined or mas_domain == ""

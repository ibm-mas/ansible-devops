---
# Import certificates action (was suite_manage_import_certs_config)
# Import certificates into the ManageWorkspace CR so they are added to the Manage
# truststore. Thin wrapper over the shared import-certs task file, which supports
# both the manage_certificates list (with manage_certificates_alias_prefix) and
# the manage_certificates_file_path_local file.
# ========================================================================
- name: "import-certs : Import certificates in ManageWorkspace CR"
  include_tasks: "tasks/common/import-certs.yml"

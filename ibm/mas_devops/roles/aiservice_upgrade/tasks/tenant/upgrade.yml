---

- name: "Upgrade ibm-aiservice-tenant subscription in namespace {{ tenant_subscription.metadata.namespace }}"
  kubernetes.core.k8s:
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: "{{ tenant_subscription.metadata.name }}"
    namespace: "{{ tenant_subscription.metadata.namespace }}"
    definition:
      spec:
        channel: "{{ aiservice_tenant_channel }}"
        name: "{{ tenant_subscription.spec.name }}"
        source: "{{ tenant_subscription.spec.source }}"
        sourceNamespace: "{{ tenant_subscription.spec.sourceNamespace }}"
    apply: true

- name: "Wait for install plan approval"
  ibm.mas_devops.wait_for_subscription_approval:
    namespace: "{{ tenant_subscription.metadata.namespace }}"
    package_name: ibm-aiservice-tenant

# The convergence gate returns only once the subscription has reached the new
# channel head, so the installPlanGeneration bump check and settle pause that
# used to follow it are no longer needed. This also makes tenant upgrades work
# under Manual approval: the gate surfaces the approval notices and waits for
# the out-of-band approval, where the former AtLatestKnown check would hang.

- name: "Lookup OperatorCondition for ibm-aiservice-tenant"
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v2
    kind: OperatorCondition
    namespace: "{{ tenant_subscription.metadata.namespace }}"
    label_selectors:
      - "operators.coreos.com/ibm-aiservice-tenant.{{ tenant_subscription.metadata.namespace }}"
  register: updated_opcon
  retries: 10
  delay: 60 # 1 minute
  until:
    - updated_opcon.resources is defined
    - updated_opcon.resources | length == 1
    - updated_opcon.resources[0].metadata.name is defined

- name: "Updated OperatorCondition info"
  debug:
    var: updated_opcon

# OperatorCondition names are in the format {packageName}.{packageVersion}
# We want to strip off the "v" prefix from the version while we do this
- name: "upgrade : Lookup operator version for ibm-aiservice-tenant"
  set_fact:
    updated_opcon_version: "{{ updated_opcon.resources[0].metadata.name.split('.v')[1] | ibm.mas_devops.format_pre_version_with_plus }}"

- name: "Operator upgrade info"
  debug:
    msg:
      - "Operator condition ..................... {{ updated_opcon.resources[0].metadata.name }}"
      - "Operator version (before) .............. {{ opcon_version }}"
      - "Operator version (after) ............... {{ updated_opcon_version }}"

- name: "Confirm AIServiceTenant CR is ready"
  kubernetes.core.k8s_info:
    api_version: aiservice.ibm.com/v1
    name: "{{ tenant_subscription.metadata.namespace }}"
    namespace: "{{ tenant_subscription.metadata.namespace }}"
    kind: AIServiceTenant
  retries: 20 # about 40 minutes
  delay: 120 # 2 minutes
  until:
    - updated_aiservice_info.resources[0].status.versions.reconciled == updated_opcon_version
    - updated_aiservice_info.resources | json_query('[*].status.conditions[?type==`Ready`][].reason') | select ('match','Ready') | list | length == 1
  register: updated_aiservice_info

- name: "Updated AIServiceTenant CR info"
  debug:
    var: updated_aiservice_info

- name: Clean up TrustStore operator
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/tenant/delete_truststore_operator.yml"
  vars:
    target_namespace: "{{ tenant_subscription.metadata.namespace }}"

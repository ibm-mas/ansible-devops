---
ums_action: "{{ lookup('env', 'UMS_ACTION') | default('install', true) }}"

# UMS namespace
# -----------------------------------------------------------------------------
ums_namespace: "{{ lookup('env', 'UMS_NAMESPACE') | default('ibm-usage-metering', true) }}"

# DRO migration
# -----------------------------------------------------------------------------
# Set to true to automatically uninstall DRO before installing UMS
ums_migrate_from_dro: "{{ lookup('env', 'UMS_MIGRATE_FROM_DRO') | default('true', true) | bool }}"
dro_namespace: "{{ lookup('env', 'DRO_NAMESPACE') | default('redhat-marketplace', true) }}"

# UMS catalog source image (OLM installation)
# -----------------------------------------------------------------------------
ums_catalog_image: "{{ lookup('env', 'UMS_CATALOG_IMAGE') | default('icr.io/cpopen/ibm-usage-metering-operator-catalog:latest', true) }}"

# UMS use existing installation
# -----------------------------------------------------------------------------
ums_endpoint_url: "{{ lookup('env', 'UMS_ENDPOINT_URL') }}"
ums_api_token: "{{ lookup('env', 'UMS_API_TOKEN') }}"
ums_crt_path: "{{ lookup('env', 'UMS_CERTIFICATE_PATH') }}"

# UmsCfg / BASCfg generation for UMS
# -----------------------------------------------------------------------------
ums_contact:
  email: "{{ lookup('env', 'UMS_CONTACT_EMAIL') }}"
  first_name: "{{ lookup('env', 'UMS_CONTACT_FIRSTNAME') }}"
  last_name: "{{ lookup('env', 'UMS_CONTACT_LASTNAME') }}"

ibm_entitlement_key: "{{ lookup('env', 'IBM_ENTITLEMENT_KEY') }}"
ums_include_isrg_root_cert: "{{ lookup('env', 'UMS_INCLUDE_ISRG_ROOT_CERT') | default('true', true) | bool }}"

# Software Central integration (optional)
# -----------------------------------------------------------------------------
ums_software_central_enable: "{{ lookup('env', 'UMS_SOFTWARE_CENTRAL_ENABLE') | default('false', true) | bool }}"
ums_software_central_anonymize: "{{ lookup('env', 'UMS_SOFTWARE_CENTRAL_ANONYMIZE') | default('false', true) | bool }}"
ums_software_central_frequency: "{{ lookup('env', 'UMS_SOFTWARE_CENTRAL_FREQUENCY') | default('5 0 * * *', true) }}"

# Custom Labels
# -----------------------------------------------------------------------------
custom_labels: "{{ lookup('env', 'CUSTOM_LABELS') | default(None, true) | string | ibm.mas_devops.string2dict() }}"

# PodTemplates configuration
# mas_pod_templates_dir: path to directory containing podTemplates configuration
# -----------------------------------------------------------------------------
mas_pod_templates_dir: "{{ lookup('env', 'MAS_POD_TEMPLATES_DIR') | default('', true) }}"

# MAS Configuration
mas_instance_id: "{{ lookup('env', 'MAS_INSTANCE_ID') }}"
mas_config_dir: "{{ lookup('env', 'MAS_CONFIG_DIR') }}"

---
# MongoDB Atlas Provider - Configure Cluster-Level Alert Monitoring
# Alerts that require cluster matchers (CLUSTER_NAME)
# Must be configured after cluster is created and ready

- name: "Configure Atlas cluster-level alert monitoring"
  when: atlas_enable_alerts | bool
  block:
    - name: "Display cluster-level alert configuration"
      debug:
        msg:
          - "=========================================="
          - "Atlas Cluster-Level Alert Configuration"
          - "=========================================="
          - "Cluster Name: {{ atlas_cluster_name }}"
          - "Cluster Health Alerts: {{ atlas_enable_cluster_health_alerts }}"
          - "Performance Alerts: {{ atlas_enable_performance_alerts }}"
          - "=========================================="

    # Fetch ALL existing alert configs for idempotency checks
    # Loops page by page (100 per page) until an empty results page is returned.
    # Using curl with Digest auth — uri module does not support Digest on GET requests.
    - name: "Initialise alert config accumulator"
      set_fact:
        atlas_all_alert_configs: []

    - name: "Fetch all existing alert configs from Atlas (paginated)"
      shell: |
        curl --digest \
          --user "{{ atlas_public_key }}:{{ atlas_private_key }}" \
          --silent --show-error --fail \
          "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs?pageNum={{ item }}&itemsPerPage=100"
      register: atlas_alert_page_raw
      changed_when: false
      failed_when: atlas_alert_page_raw.rc != 0
      no_log: true
      loop: "{{ range(1, 1000) | list }}"
      loop_control:
        label: "page {{ item }}"
      until: (atlas_alert_page_raw.stdout | from_json).get('results', []) | length == 0
      retries: 999
      delay: 0

    - name: "Accumulate alert configs from all pages"
      set_fact:
        atlas_all_alert_configs: "{{ atlas_all_alert_configs + (item.stdout | from_json).get('results', []) }}"
      loop: "{{ atlas_alert_page_raw.results }}"
      when: (item.stdout | from_json).get('results', []) | length > 0
      no_log: true

    # Optional: Cluster Health Alerts (require CLUSTER_NAME matcher)
    # Existence check matches on: eventTypeName + CLUSTER_NAME matcher + WEBHOOK notification
    - name: "Configure cluster health alerts"
      when: atlas_enable_cluster_health_alerts | bool
      block:
        - name: "Check if oplog window alert already exists"
          set_fact:
            oplog_window_exists: >-
              {{
                atlas_all_alert_configs
                | selectattr('eventTypeName', 'equalto', 'REPLICATION_OPLOG_WINDOW_RUNNING_OUT') | list
                | selectattr('notifications', 'defined') | list
                | json_query('[?notifications[?typeName==`WEBHOOK`]]') | list
                | json_query('[?matchers[?fieldName==`CLUSTER_NAME` && value==`' + atlas_cluster_name + '`]]') | length > 0
              }}

        - name: "Create oplog window low alert"
          when: not oplog_window_exists
          uri:
            url: "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs"
            method: POST
            user: "{{ atlas_public_key }}"
            password: "{{ atlas_private_key }}"
            force_basic_auth: false
            body:
              eventTypeName: "REPLICATION_OPLOG_WINDOW_RUNNING_OUT"
              enabled: true
              threshold:
                operator: "LESS_THAN"
                threshold: "{{ atlas_alert_oplog_window_threshold_minutes }}"
                units: "MINUTES"
              matchers:
                - fieldName: "CLUSTER_NAME"
                  operator: "EQUALS"
                  value: "{{ atlas_cluster_name }}"
              notifications: "{{ atlas_webhook_notifications }}"
            body_format: json
            status_code: [200, 201]
            timeout: "{{ atlas_api_timeout }}"
          register: alert_oplog_window

        - name: "Create replication lag notifications with required delay"
          set_fact:
            atlas_replication_lag_notifications: >-
              {{
                atlas_webhook_notifications | map('combine', {'delayMin': 1}) | list
              }}

        - name: "Check if replication lag alert already exists"
          set_fact:
            replication_lag_exists: >-
              {{
                atlas_all_alert_configs
                | selectattr('eventTypeName', 'equalto', 'OUTSIDE_METRIC_THRESHOLD') | list
                | selectattr('metricThreshold.metricName', 'equalto', 'OPLOG_SLAVE_LAG_MASTER_TIME') | list
                | selectattr('metricThreshold.threshold', 'equalto', atlas_alert_replication_lag_threshold | float) | list
                | selectattr('notifications', 'defined') | list
                | json_query('[?notifications[?typeName==`WEBHOOK`]]') | length > 0
              }}

        - name: "Create replication lag alert"
          when: not replication_lag_exists
          uri:
            url: "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs"
            method: POST
            user: "{{ atlas_public_key }}"
            password: "{{ atlas_private_key }}"
            force_basic_auth: false
            body:
              eventTypeName: "OUTSIDE_METRIC_THRESHOLD"
              enabled: true
              metricThreshold:
                metricName: "OPLOG_SLAVE_LAG_MASTER_TIME"
                operator: "GREATER_THAN"
                threshold: "{{ atlas_alert_replication_lag_threshold }}"
                units: "SECONDS"
                mode: "AVERAGE"
              notifications: "{{ atlas_replication_lag_notifications }}"
            body_format: json
            status_code: [200, 201]
            timeout: "{{ atlas_api_timeout }}"
          register: alert_replication_lag

        - name: "Check if primary elected alert already exists"
          set_fact:
            primary_elected_exists: >-
              {{
                atlas_all_alert_configs
                | selectattr('eventTypeName', 'equalto', 'PRIMARY_ELECTED') | list
                | selectattr('notifications', 'defined') | list
                | json_query('[?notifications[?typeName==`WEBHOOK`]]') | list
                | json_query('[?matchers[?fieldName==`CLUSTER_NAME` && value==`' + atlas_cluster_name + '`]]') | length > 0
              }}

        - name: "Create primary elected alert"
          when: not primary_elected_exists
          uri:
            url: "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs"
            method: POST
            user: "{{ atlas_public_key }}"
            password: "{{ atlas_private_key }}"
            force_basic_auth: false
            body:
              eventTypeName: "PRIMARY_ELECTED"
              enabled: true
              matchers:
                - fieldName: "CLUSTER_NAME"
                  operator: "EQUALS"
                  value: "{{ atlas_cluster_name }}"
              notifications: "{{ atlas_webhook_notifications }}"
            body_format: json
            status_code: [200, 201]
            timeout: "{{ atlas_api_timeout }}"
          register: alert_primary_elected

        - name: "Check if no primary alert already exists"
          set_fact:
            no_primary_exists: >-
              {{
                atlas_all_alert_configs
                | selectattr('eventTypeName', 'equalto', 'NO_PRIMARY') | list
                | selectattr('notifications', 'defined') | list
                | json_query('[?notifications[?typeName==`WEBHOOK`]]') | list
                | json_query('[?matchers[?fieldName==`CLUSTER_NAME` && value==`' + atlas_cluster_name + '`]]') | length > 0
              }}

        - name: "Create no primary alert"
          when: not no_primary_exists
          uri:
            url: "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs"
            method: POST
            user: "{{ atlas_public_key }}"
            password: "{{ atlas_private_key }}"
            force_basic_auth: false
            body:
              eventTypeName: "NO_PRIMARY"
              enabled: true
              matchers:
                - fieldName: "CLUSTER_NAME"
                  operator: "EQUALS"
                  value: "{{ atlas_cluster_name }}"
              notifications: "{{ atlas_webhook_notifications }}"
            body_format: json
            status_code: [200, 201]
            timeout: "{{ atlas_api_timeout }}"
          register: alert_no_primary

        - name: "Check if mongos missing alert already exists"
          set_fact:
            mongos_missing_exists: >-
              {{
                atlas_all_alert_configs
                | selectattr('eventTypeName', 'equalto', 'CLUSTER_MONGOS_IS_MISSING') | list
                | selectattr('notifications', 'defined') | list
                | json_query('[?notifications[?typeName==`WEBHOOK`]]') | list
                | json_query('[?matchers[?fieldName==`CLUSTER_NAME` && value==`' + atlas_cluster_name + '`]]') | length > 0
              }}

        - name: "Create cluster mongos missing alert"
          when: not mongos_missing_exists
          uri:
            url: "{{ atlas_api_base_url }}/groups/{{ atlas_project_id }}/alertConfigs"
            method: POST
            user: "{{ atlas_public_key }}"
            password: "{{ atlas_private_key }}"
            force_basic_auth: false
            body:
              eventTypeName: "CLUSTER_MONGOS_IS_MISSING"
              enabled: true
              matchers:
                - fieldName: "CLUSTER_NAME"
                  operator: "EQUALS"
                  value: "{{ atlas_cluster_name }}"
              notifications: "{{ atlas_webhook_notifications }}"
            body_format: json
            status_code: [200, 201]
            timeout: "{{ atlas_api_timeout }}"
          register: alert_mongos_missing

    - name: "Cluster-level alerts configured successfully"
      debug:
        msg:
          - "=========================================="
          - "Cluster-Level Alert Monitoring Status"
          - "=========================================="
          - "Status: Successfully Configured"
          - "Cluster Name: {{ atlas_cluster_name }}"
          - "Cluster Health Alerts: {{ 'Enabled' if atlas_enable_cluster_health_alerts else 'Disabled' }}"
          - "Oplog window alert: {{ 'skipped (already exists)' if oplog_window_exists else 'created' }}"
          - "Replication lag alert: {{ 'skipped (already exists)' if replication_lag_exists else 'created' }}"
          - "Primary elected alert: {{ 'skipped (already exists)' if primary_elected_exists else 'created' }}"
          - "No primary alert: {{ 'skipped (already exists)' if no_primary_exists else 'created' }}"
          - "Mongos missing alert: {{ 'skipped (already exists)' if mongos_missing_exists else 'created' }}"
          - "=========================================="

  rescue:
    - name: "Display cluster-level alert configuration error details"
      debug:
        msg:
          - "=========================================="
          - "Cluster-Level Alert Configuration Error"
          - "=========================================="
          - "Failed to configure cluster-level alerts"
          - "Common causes:"
          - "1. Cluster not yet ready"
          - "2. Invalid cluster name"
          - "3. Invalid or missing Atlas API credentials"
          - "=========================================="
          - "Error details:"
          - "{{ ansible_failed_result | default('No error details available') }}"

    - name: "Fail after displaying cluster-level alert configuration errors"
      fail:
        msg: "Cluster-level alert configuration failed. See error details above."

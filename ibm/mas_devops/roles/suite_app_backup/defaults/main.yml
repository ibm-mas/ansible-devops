---
# MAS Application Backup - Default Variables
# =============================================================================

# General Configuration
# -----------------------------------------------------------------------------
mas_instance_id: "{{ lookup('env', 'MAS_INSTANCE_ID') }}"
mas_workspace_id: "{{ lookup('env', 'MAS_WORKSPACE_ID') }}"
mas_app_id: "{{ lookup('env', 'MAS_APP_ID') }}"

# Backup Configuration
# -----------------------------------------------------------------------------
# Directory where backups will be stored
mas_backup_dir: "{{ lookup('env', 'MAS_BACKUP_DIR') }}"

# Optional: Specify a custom backup version (defaults to timestamp YYYYMMDD-HHMMSS)
mas_app_backup_version: "{{ lookup('env', 'MAS_APP_BACKUP_VERSION') }}"

# Optional: Include PVC backup for application (defaults to true)
mas_app_backup_include_pvc: "{{ lookup('env', 'MAS_APP_BACKUP_INCLUDE_PVC') | default('true', true) | bool }}"

# Strict named-only backup mode (fails if any resource definition lacks an explicit name)
strict_named_only: "{{ lookup('env', 'STRICT_NAMED_ONLY') | default('false', true) | bool }}"

# Auto-discover secret references in resource specs
auto_discover_secrets: "{{ lookup('env', 'AUTO_DISCOVER_SECRETS') | default('true', true) | bool }}"

# Environment configuration snapshot (explicit folders only; nothing is discovered)
env_snapshot_saas_envs_dir: "{{ lookup('env', 'SAAS_ENVS_INSTANCE_DIR') }}"
env_snapshot_gitops_envs_dir: "{{ lookup('env', 'GITOPS_ENVS_INSTANCE_DIR') }}"

# Explicit CustomResourceDefinition object names backed up for Manage in strict named-only mode.
# Verified against a live cluster (oc get crd); these are CRD names, not CR kinds.
manage_backup_crds:
  - { kind: CustomResourceDefinition, api_version: apiextensions.k8s.io/v1, name: manageapps.apps.mas.ibm.com }
  - { kind: CustomResourceDefinition, api_version: apiextensions.k8s.io/v1, name: manageworkspaces.apps.mas.ibm.com }
  - { kind: CustomResourceDefinition, api_version: apiextensions.k8s.io/v1, name: manageserverbundles.apps.mas.ibm.com }
  - { kind: CustomResourceDefinition, api_version: apiextensions.k8s.io/v1, name: managedeployments.apps.mas.ibm.com }
  - { kind: CustomResourceDefinition, api_version: apiextensions.k8s.io/v1, name: truststores.truststore-mgr.ibm.com }

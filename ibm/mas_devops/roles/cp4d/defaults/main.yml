---
# ------ CPD storage classes ------------------------------------------------------------------------------------------
cpd_primary_storage_class: "{{ lookup('env', 'CPD_PRIMARY_STORAGE_CLASS') }}"
cpd_metadata_storage_class: "{{ lookup('env', 'CPD_METADATA_STORAGE_CLASS') }}"
cpd_scale_config: "{{ lookup('env', 'CPD_SCALE_CONFIG') | default('medium', true) }}"
cpd_iam_integration: false # this is implicitly defaulted to false in cpd 4.6, but needs to be explicitly set in cpd 4.8

# ------ CPD entitlement ----------------------------------------------------------------------------------------------
cpd_entitlement_username: "{{ lookup('env', 'CPD_ENTITLEMENT_USERNAME') | default('cp', true) }}"
ibm_entitlement_key: "{{ lookup('env', 'IBM_ENTITLEMENT_KEY') }}"
cpd_entitlement_key: "{{ lookup('env', 'CPD_ENTITLEMENT_KEY') | default(ibm_entitlement_key, true) }}"
ibm_entitlement_key_secret: ibm-entitlement-key
skip_ibm_entitlement_injection: "{{ lookup('env', 'SKIP_IBM_ENTITLEMENT_INJECTION') | default('false', true) | bool }}" # if true, will skip service accounts to be patched with ibm-entitlement-key
# if true, then skip ibm-entitlement-key check, useful for upgrade scenarios when the entitlement secret is already present
# this check is used by `mas update` function in mas cli
skip_entitlement_key_flag: "{{ lookup('env', 'SKIP_ENTITLEMENT_KEY_FLAG') | default('false', true) | bool }}"

# ------ CPD namespaces -----------------------------------------------------------------------------------------------

# Specialized installations
# -------------------------
#
# https://www.ibm.com/docs/en/cloud-paks/cp-data/4.0?topic=planning-architecture#architecture__deployment-architecture
#
# A specialized installation allows a user with project administrator permissions to install the software after
# a cluster administrator completes the initial cluster setup.
# A specialized installation also facilitates strict division between Red Hat OpenShift Container Platform
# projects (Kubernetes namespaces).
# In a specialized installation, the IBM Cloud Pak foundational services operators are installed in the
# ibm-common-services project and the Cloud Pak for Data operators are installed in a separate project
# (typically cpd-operators). Each project has a dedicated:
#
# - Operator group, which specifies the OwnNamespace installation mode
# - NamespaceScope Operator, which allows the operators in the project to manage operators
#   and service workloads in specific projects
#
# In this way, you can specify different settings for the IBM Cloud Pak foundational services and
# for the Cloud Pak for Data operators.
common_services_channel: "{{ lookup('env', 'COMMON_SERVICES_CHANNEL') | default('', true) }}"
cpd_operators_namespace: "{{ lookup('env', 'CPD_OPERATORS_NAMESPACE') | default('ibm-cpd-operators', true) }}"
cpd_instance_namespace: "{{ lookup('env', 'CPD_INSTANCE_NAMESPACE') | default('ibm-cpd', true) }}"
cpd_product_version: "{{ lookup('env', 'CPD_PRODUCT_VERSION') }}"
cpd_platform_cr_name: "{{ lookup('env', 'CPD_PLATFORM_CR_NAME') | default('ibmcpd-cr', true) }}"
zen_cr_name: "lite-cr"
zen_operator_namespace: "{{ cpd_operators_namespace }}"

# ------ CPD Helm configuration ---------------------------------------------------------------------------------------
cpd_helm_repo_url: "{{ lookup('env', 'CPD_HELM_REPO_URL') | default('https://raw.githubusercontent.com/IBM/charts/master/repo/ibm-helm', true) }}"
cpd_helm_repo_name: "ibm-charts"
cpd_helm_timeout: "30m"
cpd_helm_wait_retries: 60
cpd_helm_wait_delay: 30

# Airgap Helm Configuration
cpd_airgap_helm_repo_url: "{{ lookup('env', 'CPD_AIRGAP_HELM_REPO_URL') | default('', true) }}"
cpd_helm_airgap: "{{ (cpd_airgap_helm_repo_url | default('', true)) | length > 0 }}"
registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') | default('', true) }}"
registry_password: "{{ lookup('env', 'REGISTRY_PASSWORD') | default('', true) }}"

# Core platform components installed via Helm starting from CPD 5.4.0+
cpd_platform_components:
  - name: ibm_licensing
    assembly_name: ibmLicensing
    helm_chart_name: ""  # Only cluster-scoped chart for licensing
    helm_cluster_chart: ibm-licensing-cluster-scoped
    crd_name: ibmlicensings.operator.ibm.com
    case_version: "{{ cpd_components_meta.ibm_licensing.case_version }}"
    namespace: "{{ cpd_ibm_licensing_namespace }}"  # ibm-licensing — chart creates SAs/RBAC in this namespace

  - name: ibm_common_service_operator
    assembly_name: cpfs
    helm_chart_name: ibm-common-service-operator
    helm_cluster_chart: ibm-common-service-operator-cluster-scoped
    crd_name: commonservices.operator.ibm.com
    case_version: "{{ cpd_components_meta.ibm_common_service_operator.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"
    # This Helm chart installs both CPFS and ODLM.
    # ODLM's OLM label is ibm-odlm (package name), not operand-deployment-lifecycle-manager-app (subscription name).
    # Both label selectors are listed so CSVs and subscriptions are caught correctly.
    olm_subscription_names:
      - ibm-common-service-operator
      - ibm-odlm

  - name: ibm_iam_operator
    assembly_name: ibmIamOperator
    helm_chart_name: ibm-iam-operator
    helm_cluster_chart: ibm-iam-operator-cluster-scoped
    crd_name: ""
    case_version: "{{ cpd_components_meta.ibm_iam_operator.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"

  - name: postgresql
    assembly_name: postgresql
    helm_chart_name: postgresql
    helm_cluster_chart: postgresql-cluster-scoped
    crd_name: clusters.postgresql.k8s.enterprisedb.io
    case_version: "{{ cpd_components_meta.postgresql.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"
    # cloud-native-postgresql is the OLM subscription name for the postgresql operator
    olm_subscription_names:
      - cloud-native-postgresql

  - name: ibm_pg_operator
    assembly_name: ibmPgOperator
    helm_chart_name: ibm-pg-operator
    helm_cluster_chart: ibm-pg-operator-cluster-scoped
    crd_name: ""
    case_version: "{{ cpd_components_meta.ibm_pg_operator.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"

  - name: ibm_swhcc
    assembly_name: ibmSwhcc
    helm_chart_name: ibm-swhcc
    helm_cluster_chart: ibm-swhcc-cluster-scoped
    crd_name: ibmswhccs.swh.ibm.com
    case_version: "{{ cpd_components_meta.ibm_swhcc.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"

  - name: ibm_namespace_scope_operator
    assembly_name: ibmNamespaceScopeOperator
    helm_chart_name: ""
    helm_cluster_chart: ""
    crd_name: ""
    case_version: ""
    namespace: "{{ cpd_operators_namespace }}"
    # ibm-namespace-scope-operator is installed by the OLM path and must be removed
    # before Helm takes over — it is not reinstalled by Helm in 5.4.0
    olm_subscription_names:
      - ibm-namespace-scope-operator

  - name: cpd_platform
    assembly_name: cpdPlatform
    helm_chart_name: cpd-platform
    helm_cluster_chart: cpd-platform-cluster-scoped
    crd_name: ibmcpds.cpd.ibm.com
    case_version: "{{ cpd_components_meta.cpd_platform.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"
    olm_subscription_names:
      - cpd-platform-operator

  - name: zen
    assembly_name: zen
    helm_chart_name: zen
    helm_cluster_chart: zen-cluster-scoped
    crd_name: zenservices.zen.cpd.ibm.com
    case_version: "{{ cpd_components_meta.zen.case_version }}"
    namespace: "{{ cpd_operators_namespace }}"
    olm_subscription_names:
      - ibm-zen-operator

# ------ CPD 4.8+ specific -----------------------------------------------------------------------------------------------
cpd_cs_control_namespace: "{{ lookup('env', 'CPD_CS_CONTROL_NAMESPACE') | default('cs-control', true) }}"
cpd_cpfs_namespace: ibm-common-services
cpd_ibm_licensing_namespace: ibm-licensing
cpd_cpfs_minimum_csv_version: "4.0.0" # minimum cpfs version required for cpd 4.8
cpd_admin_login_sa: "mas-cpd-cluster-admin-sa"
cpfs_size: small

# These catalog sources will be responsible for feeding subscription for the following operators:
# - cpd-operator
# - ibm-common-service-operator
# - ibm-zen-operator
# - operand-deployment-lifecycle-manager
# - ibm-idp-config-ui-operator
# - ibm-mongodb-operator
# - ibm-commonui-operator
# - ibm-iam-operator
# - ibm-namespace-scope-operator
cpd_custom_catalog_sources:
  - "cpd-platform"
  - "opencloud-operators"

cpd_platform_operator_name: cpd-platform-operator
cpd_catalog_source_name: cpd-platform
cpd_catalog_source_namespace: "{{ cpd_operators_namespace }}"

cpfs_catalog_source_name: "opencloud-operators"
cpfs_catalog_source_namespace: "{{ cpd_operators_namespace }}"

cpd_ibm_licensing_catalog_source_name: ibm-operator-catalog
cpd_ibm_licensing_catalog_source_namespace: openshift-marketplace

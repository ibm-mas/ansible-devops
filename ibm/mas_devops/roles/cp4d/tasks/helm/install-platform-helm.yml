---
# Helm Platform Installation Path for CPD (CPD 5.4.0+)
# This file defines the full, clean sequence for Helm-based installation of CPD Platform.

# 1. Create olm-utils-cm and load version metadata (matches OLM pattern)
# -----------------------------------------------------------------------------
- name: "Create olm-utils-cm configmap for CPD {{ cpd_product_version }}"
  kubernetes.core.k8s:
    apply: yes
    template: "{{ role_path }}/templates/config_maps/olm-utils-cm-{{ cpd_product_version }}.yml.j2"

- name: "Lookup olm-utils-cm to load version metadata for CPD {{ cpd_product_version }}"
  kubernetes.core.k8s_info:
    api_version: v1
    name: "olm-utils-cm"
    kind: ConfigMap
    namespace: "{{ cpd_instance_namespace }}"
  register: cpd_cm_info

- name: "Set cpd_components_meta from olm-utils-cm"
  set_fact:
    cpd_components_meta: "{{ cpd_cm_info.resources[0].data.release_components_meta | from_yaml }}"

- name: "Set zen_cr_version from cpd_components_meta"
  set_fact:
    zen_cr_version: "{{ cpd_components_meta.zen.cr_version }}"

# 2. Setup storage classes
# -----------------------------------------------------------------------------
- name: "Determine storage classes"
  include_tasks: "../determine-storage-classes.yml"

# 4. Authorize admin SA
# -----------------------------------------------------------------------------
- name: "Grant permissions to {{ cpd_admin_login_sa }} service account in Cloud Pak For Data namespaces"
  include_tasks: "../authorize-user-cpd-admin.yml"

# 5. Setup Helm repository
# -----------------------------------------------------------------------------
- name: "Setup Helm repository"
  include_tasks: "setup-helm-repo.yml"

# 6. Create IBM entitlement secrets
# -----------------------------------------------------------------------------
- name: "Check if ibm-entitlement-key already exists in operator namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ibm_entitlement_key_secret }}"
    namespace: "{{ cpd_operators_namespace }}"
  register: entitlement_secret_operators_check

- name: "Check if ibm-entitlement-key already exists in instance namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ ibm_entitlement_key_secret }}"
    namespace: "{{ cpd_instance_namespace }}"
  register: entitlement_secret_instance_check

- name: "Create IBM entitlement secrets"
  when: ibm_entitlement_key is defined and ibm_entitlement_key | length > 0
  block:
    - name: "Create IBM entitlement secret in operator namespace"
      when: entitlement_secret_operators_check.resources | length == 0
      vars:
        dockerconfig:
          auths:
            cp.icr.io/cp:
              username: cp
              password: "{{ ibm_entitlement_key }}"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ibm_entitlement_key_secret }}"
            namespace: "{{ cpd_operators_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"

    - name: "Create IBM entitlement secret in instance namespace"
      when: entitlement_secret_instance_check.resources | length == 0
      vars:
        dockerconfig:
          auths:
            cp.icr.io/cp:
              username: cp
              password: "{{ ibm_entitlement_key }}"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ ibm_entitlement_key_secret }}"
            namespace: "{{ cpd_instance_namespace }}"
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ dockerconfig | to_json | b64encode }}"

# 7. Install all platform components via Helm in order
# -----------------------------------------------------------------------------
- name: "Install CPD platform component {{ component_item.name }} via Helm"
  include_tasks: "install-component.yml"
  when: >-
    (component_item.name != 'ibm_iam_operator') or
    (component_item.name == 'ibm_iam_operator' and (cpd_iam_integration | bool))
  loop: "{{ cpd_platform_components }}"
  loop_control:
    loop_var: component_item
    label: "{{ component_item.name }}"

# 8. Wait and Configure CPD Platform
# -----------------------------------------------------------------------------
- name: "Install and Configure Cloud Pak For Data (shared tasks)"
  include_tasks: "../install-cp4d.yml"

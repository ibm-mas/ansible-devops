---
# Install a single Helm component for CPD Platform (cluster-scoped + namespace-scoped charts)
# This task is independent and custom-tailored for cp4d platform installation.
#
# Parameters expected:
# - component_item: Component definition block containing:
#   - name
#   - assembly_name
#   - helm_chart_name
#   - helm_cluster_chart
#   - crd_name
#   - case_version
#   - namespace

- name: "Get component metadata for {{ component_item.name }}"
  set_fact:
    comp_name: "{{ component_item.name }}"
    comp_assembly: "{{ component_item.assembly_name }}"
    comp_chart_name: "{{ component_item.helm_chart_name }}"
    comp_cluster_chart: "{{ component_item.helm_cluster_chart }}"
    comp_crd_name: "{{ component_item.crd_name }}"
    comp_case_version: "{{ component_item.case_version }}"
    comp_namespace: "{{ component_item.namespace }}"
    helm_tls_flag: "{{ '--ca-file ' ~ lookup('env', 'HELM_REGISTRY_CA_FILE') if lookup('env', 'HELM_REGISTRY_CA_FILE') else '--insecure-skip-tls-verify' }}"

# helm search repo has no module equivalent - command is used for a read-only repo index query.
- name: "Resolve chart version from repo index"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
  vars:
    search_chart_name: "{{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }}"
  command: >
    helm search repo {{ cpd_helm_repo_name }}/{{ search_chart_name }}
    {% if comp_case_version != '' %}--version {{ comp_case_version }}{% endif %}
    --output json
  register: chart_search
  changed_when: false

- name: "Fail if chart not found in repository"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
    - (chart_search.stdout | from_json | length) == 0
  fail:
    msg: "Chart {{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }} version {{ comp_case_version }} not found in repository {{ cpd_helm_repo_name }}"

- name: "Set chart version from repo index"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
    - (chart_search.stdout | from_json | length) > 0
  set_fact:
    chart_version: "{{ (chart_search.stdout | from_json | first).version }}"

# Airgap: pull Chart.yaml from OCI registry to resolve actual version string.
# helm show chart has no module equivalent - shell is required here.
- name: "Resolve chart version from OCI registry (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
  vars:
    search_chart_name: "{{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }}"
  shell: >
    helm show chart {{ cpd_airgap_helm_repo_url }}/{{ search_chart_name }}
    {{ helm_tls_flag }} 2>/dev/null
    | grep '^version:' | awk '{print $2}' | tr -d '"'
  register: chart_version_lookup
  changed_when: false

- name: "Set chart version from OCI registry (airgap)"
  when: cpd_helm_airgap
  set_fact:
    chart_version: "{{ chart_version_lookup.stdout | trim | default(comp_case_version) }}"

- name: "Component {{ comp_name }} chart version"
  debug:
    msg:
      - "Component: {{ comp_name }}"
      - "Assembly: {{ comp_assembly }}"
      - "Chart version: {{ chart_version }}"
      - "Chart name: {{ comp_chart_name }}"
      - "Cluster chart: {{ comp_cluster_chart }}"

# Helm values passed inline to all chart installs below.
# The assembly-specific key (e.g. "zen", "cpfs") must be built via combine because
# Ansible does not evaluate Jinja2 expressions used as YAML dict keys in set_fact.
- name: "Set Helm values for {{ comp_name }}"
  set_fact:
    comp_helm_values: >-
      {{
        {
          'global': {
            'licenseAccept': true,
            'releaseVersion': cpd_product_version,
            'operatorNamespace': cpd_operators_namespace,
            'instanceNamespace': cpd_instance_namespace,
            'controlCenterOperatorNamespace': cpd_operators_namespace,
            'controlCenterInstanceNamespace': cpd_instance_namespace,
            'blockStorageClass': cpd_metadata_storage_class,
            'fileStorageClass': cpd_primary_storage_class,
            'imagePullSecret': ibm_entitlement_key_secret,
            'imagePullPrefix': 'icr.io',
            'installConfigImagePullPrefix': (cpd_airgap_helm_repo_url | regex_replace('^oci://', '') | regex_replace('/charts$', '')) if (cpd_helm_airgap and comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=')) else omit,
            'installConfigImageName': 'cpopen/cpd/olm-utils-v4' if (cpd_helm_airgap and comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=')) else omit,
            'installConfigImageDigest': cpd_olm_utils_image_digest if (cpd_helm_airgap and comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') and cpd_olm_utils_image_digest | default('') != '') else omit
          }
        } | combine({
          comp_assembly: {
            'scaleConfig': cpd_scale_config,
            'version': cpd_product_version,
            'non_olm': true,
            'iamIntegration': cpd_iam_integration | bool
          }
        })
      }}

# Install cluster-scoped chart (CRDs, ClusterRoles, etc.)
# helm template renders manifests into a variable (read-only, no cluster interaction).
# kubernetes.core.k8s then applies each manifest via Ansible's connection context
# with server-side apply to handle field ownership conflicts. No oc binary required.
- name: "Render {{ comp_name }} cluster-scoped chart manifests"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  shell: >
    helm template {{ comp_name | replace('_', '-') }}-cluster
    {{ cpd_helm_repo_name }}/{{ comp_cluster_chart }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
    --set global.operatorNamespace={{ cpd_operators_namespace }}
    --set global.instanceNamespace={{ cpd_instance_namespace }}
    --set global.controlCenterOperatorNamespace={{ cpd_operators_namespace }}
    --set global.controlCenterInstanceNamespace={{ cpd_instance_namespace }}
  register: cluster_chart_manifests
  changed_when: false

- name: "Apply {{ comp_name }} cluster-scoped chart manifests"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  vars:
    # Some charts render ClusterRoleBinding subjects with namespace: null when
    # controlCenterOperatorNamespace is not set. Patch only those null subjects
    # to cpd_operators_namespace — leave subjects that already have a namespace intact.
    _manifest: >-
      {{
        item | combine(
          {'subjects': item.subjects | map('combine', {'namespace': cpd_operators_namespace})
                       | selectattr('namespace', 'equalto', cpd_operators_namespace)
                       | list
                       + item.subjects | rejectattr('namespace', 'none') | list}
          if (item.kind == 'ClusterRoleBinding' and item.subjects is defined
              and item.subjects | selectattr('namespace', 'none') | list | length > 0)
          else {}
        )
      }}
  kubernetes.core.k8s:
    state: present
    definition: "{{ _manifest }}"
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  loop: "{{ cluster_chart_manifests.stdout | from_yaml_all | select('ne', None) | list }}"

- name: "Render {{ comp_name }} cluster-scoped chart manifests (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  command: >
    helm template {{ comp_name | replace('_', '-') }}-cluster
    {{ cpd_airgap_helm_repo_url }}/{{ comp_cluster_chart }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') %}--set global.installConfigImagePullPrefix={{ cpd_airgap_helm_repo_url | regex_replace('^oci://', '') | regex_replace('/charts$', '') }}{% endif %}
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') %}--set global.installConfigImageName=cpopen/cpd/olm-utils-v4{% endif %}
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') and cpd_olm_utils_image_digest | default('') != '' %}--set global.installConfigImageDigest={{ cpd_olm_utils_image_digest }}{% endif %}
    --set global.operatorNamespace={{ cpd_operators_namespace }}
    --set global.instanceNamespace={{ cpd_instance_namespace }}
    --set global.controlCenterOperatorNamespace={{ cpd_operators_namespace }}
    --set global.controlCenterInstanceNamespace={{ cpd_instance_namespace }}
    {{ helm_tls_flag }}
  register: cluster_chart_manifests_airgap
  changed_when: false

- name: "Apply {{ comp_name }} cluster-scoped chart manifests (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  vars:
    _manifest: >-
      {{
        item | combine(
          {'subjects': item.subjects | map('combine', {'namespace': cpd_operators_namespace})
                       | selectattr('namespace', 'equalto', cpd_operators_namespace)
                       | list
                       + item.subjects | rejectattr('namespace', 'none') | list}
          if (item.kind == 'ClusterRoleBinding' and item.subjects is defined
              and item.subjects | selectattr('namespace', 'none') | list | length > 0)
          else {}
        )
      }}
  kubernetes.core.k8s:
    state: present
    definition: "{{ _manifest }}"
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  loop: "{{ cluster_chart_manifests_airgap.stdout | from_yaml_all | select('ne', None) | list }}"

# Workaround: ibm-licensing-cluster-scoped Helm chart (CPD 5.4.0) has two gaps that must
# be fixed immediately after the cluster-scoped chart is applied:
#
# Gap 1: ibm-licensing-opreqs-role ClusterRole is missing operandrequests.operator.ibm.com
#         — without this, the operator cannot watch/manage OperandRequests, so ODLM-driven
#           binding propagation (Gap 4 fix) will silently not work.
#
# Gaps 2 & 3 (ClusterRoleBinding subject namespace mismatch) are resolved upstream by
# passing cpd_ibm_licensing_namespace as the helm chart namespace, so the chart renders
# all SA/RBAC subject namespaces as 'ibm-licensing' directly — no post-install patch needed.
#
# Gap 4 is handled AFTER the namespace-scoped chart installs the operator Deployment.
# See the block below the helm install tasks.

# Gap 1: ibm-licensing-opreqs-role is missing operandrequests.operator.ibm.com permission
- name: "Wait for ibm-licensing-opreqs-role ClusterRole to exist"
  when: comp_name == 'ibm_licensing'
  kubernetes.core.k8s_info:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    name: ibm-licensing-opreqs-role
  register: licensing_clusterrole_check
  until: licensing_clusterrole_check.resources | length > 0
  retries: 30
  delay: 10

- name: "Patch ibm-licensing-opreqs-role to add operandrequests.operator.ibm.com permissions"
  when: comp_name == 'ibm_licensing'
  kubernetes.core.k8s_json_patch:
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    name: ibm-licensing-opreqs-role
    patch:
      - op: add
        path: /rules/-
        value:
          apiGroups:
            - operator.ibm.com
          resources:
            - operandrequests
          verbs:
            - create
            - delete
            - get
            - list
            - patch
            - update
            - watch

- name: "Wait for {{ comp_name }} CRD to be established"
  when: comp_crd_name is defined and comp_crd_name != ""
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ comp_crd_name }}"
  register: crd_check
  until:
    - crd_check.resources | length > 0
    - crd_check.resources[0].status.conditions is defined
    - crd_check.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 10

- name: "Fail if {{ comp_name }} CRD is not established"
  when:
    - comp_crd_name is defined and comp_crd_name != ""
    - crd_check.resources | length == 0
  fail:
    msg: "Timed out waiting for CustomResourceDefinition {{ comp_crd_name }} to be established."

# Pre-install adoption: stamp any existing namespace-scoped resources with Helm ownership metadata
# so that `helm upgrade -i` can adopt them rather than fail on invalid ownership.
# This is required when upgrading from an OLM-based CPD installation (pre-5.4.0) where these
# resources were created without Helm labels/annotations.
- name: "Render {{ comp_name }} namespace-scoped chart manifests for adoption check"
  when:
    - not cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  shell: >
    helm template {{ comp_name | replace('_', '-') }}
    {{ cpd_helm_repo_name }}/{{ comp_chart_name }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
    --set global.operatorNamespace={{ cpd_operators_namespace }}
    --set global.instanceNamespace={{ cpd_instance_namespace }}
    --set global.controlCenterOperatorNamespace={{ cpd_operators_namespace }}
    --set global.controlCenterInstanceNamespace={{ cpd_instance_namespace }}
  register: ns_chart_manifests
  changed_when: false

# Deployments cannot be adopted via metadata-only patch: their spec may differ between the
# OLM-created version and the new Helm chart (e.g. conflicting value/valueFrom on env vars),
# causing Kubernetes to reject the strategic merge patch that Helm issues during install.
# Delete them so Helm creates them fresh with the correct spec.
- name: "Delete existing {{ comp_name }} Deployments for fresh Helm install"
  when:
    - not cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
    - item.kind == 'Deployment'
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.apiVersion }}"
    kind: Deployment
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace | default(comp_namespace) }}"
    wait: true
    wait_timeout: 120
  loop: "{{ ns_chart_manifests.stdout | from_yaml_all | select('ne', None) | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  failed_when: false

- name: "Adopt existing {{ comp_name }} namespace-scoped resources into Helm release"
  when:
    - not cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
    - item.kind != 'Deployment'
  vars:
    _release_name: "{{ comp_name | replace('_', '-') }}"
    _manifest: "{{ item }}"
  kubernetes.core.k8s:
    state: patched
    api_version: "{{ _manifest.apiVersion }}"
    kind: "{{ _manifest.kind }}"
    name: "{{ _manifest.metadata.name }}"
    namespace: "{{ _manifest.metadata.namespace | default(comp_namespace) }}"
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ _release_name }}"
          meta.helm.sh/release-namespace: "{{ comp_namespace }}"
  loop: "{{ ns_chart_manifests.stdout | from_yaml_all | select('ne', None) | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  failed_when: false

- name: "Render {{ comp_name }} namespace-scoped chart manifests for adoption check (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  command: >
    helm template {{ comp_name | replace('_', '-') }}
    {{ cpd_airgap_helm_repo_url }}/{{ comp_chart_name }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') %}--set global.installConfigImagePullPrefix={{ cpd_airgap_helm_repo_url | regex_replace('^oci://', '') | regex_replace('/charts$', '') }}{% endif %}
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') %}--set global.installConfigImageName=cpopen/cpd/olm-utils-v4{% endif %}
    {% if comp_name == 'cpd_platform' and cpd_product_version is version('5.4.0', '>=') and cpd_olm_utils_image_digest | default('') != '' %}--set global.installConfigImageDigest={{ cpd_olm_utils_image_digest }}{% endif %}
    --set global.operatorNamespace={{ cpd_operators_namespace }}
    --set global.instanceNamespace={{ cpd_instance_namespace }}
    --set global.controlCenterOperatorNamespace={{ cpd_operators_namespace }}
    --set global.controlCenterInstanceNamespace={{ cpd_instance_namespace }}
    {{ helm_tls_flag }}
  register: ns_chart_manifests_airgap
  changed_when: false

- name: "Delete existing {{ comp_name }} Deployments for fresh Helm install (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
    - item.kind == 'Deployment'
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.apiVersion }}"
    kind: Deployment
    name: "{{ item.metadata.name }}"
    namespace: "{{ item.metadata.namespace | default(comp_namespace) }}"
    wait: true
    wait_timeout: 120
  loop: "{{ ns_chart_manifests_airgap.stdout | from_yaml_all | select('ne', None) | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  failed_when: false

- name: "Adopt existing {{ comp_name }} namespace-scoped resources into Helm release (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
    - item.kind != 'Deployment'
  vars:
    _release_name: "{{ comp_name | replace('_', '-') }}"
    _manifest: "{{ item }}"
  kubernetes.core.k8s:
    state: patched
    api_version: "{{ _manifest.apiVersion }}"
    kind: "{{ _manifest.kind }}"
    name: "{{ _manifest.metadata.name }}"
    namespace: "{{ _manifest.metadata.namespace | default(comp_namespace) }}"
    definition:
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ _release_name }}"
          meta.helm.sh/release-namespace: "{{ comp_namespace }}"
  loop: "{{ ns_chart_manifests_airgap.stdout | from_yaml_all | select('ne', None) | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  failed_when: false

# Pre-install upgrade patching: update existing CR specs to the target versions
# to prevent Helm three-way merge conflicts from retaining stale OLM versions on upgrade.
- name: "Upgrade OLM -> Helm: Check and patch existing custom resources for {{ comp_name }}"
  when: comp_chart_name is defined and comp_chart_name != ""
  block:
    # --- 1. Handle Ibmcpd CR (cpd_platform component) ---
    - name: "Upgrade OLM -> Helm: Lookup existing Ibmcpd CR"
      when: comp_name == 'cpd_platform'
      kubernetes.core.k8s_info:
        api_version: cpd.ibm.com/v1
        kind: Ibmcpd
        name: "{{ cpd_platform_cr_name }}"
        namespace: "{{ cpd_instance_namespace }}"
      register: _existing_ibmcpd_lookup

    - name: "Upgrade OLM -> Helm: Patch existing Ibmcpd CR version"
      when:
        - comp_name == 'cpd_platform'
        - _existing_ibmcpd_lookup.resources | length > 0
        - (_existing_ibmcpd_lookup.resources[0].spec.version != cpd_components_meta.cpd_platform.cr_version) or
          (_existing_ibmcpd_lookup.resources[0].spec.non_olm is not defined or not _existing_ibmcpd_lookup.resources[0].spec.non_olm)
      kubernetes.core.k8s:
        state: patched
        api_version: cpd.ibm.com/v1
        kind: Ibmcpd
        name: "{{ cpd_platform_cr_name }}"
        namespace: "{{ cpd_instance_namespace }}"
        definition:
          spec:
            version: "{{ cpd_components_meta.cpd_platform.cr_version }}"
            non_olm: true

    # --- 2. Handle ZenService CR (zen component) ---
    - name: "Upgrade OLM -> Helm: Lookup existing ZenService CR"
      when: comp_name == 'zen'
      kubernetes.core.k8s_info:
        api_version: zen.cpd.ibm.com/v1
        kind: ZenService
        name: "{{ zen_cr_name }}"
        namespace: "{{ cpd_instance_namespace }}"
      register: _existing_zenservice_lookup

    - name: "Upgrade OLM -> Helm: Strip legacy ownerReferences from ZenService CR"
      when:
        - comp_name == 'zen'
        - _existing_zenservice_lookup.resources | length > 0
        - _existing_zenservice_lookup.resources[0].metadata.ownerReferences is defined
        - _existing_zenservice_lookup.resources[0].metadata.ownerReferences | length > 0
      kubernetes.core.k8s_json_patch:
        api_version: zen.cpd.ibm.com/v1
        kind: ZenService
        name: "{{ zen_cr_name }}"
        namespace: "{{ cpd_instance_namespace }}"
        patch:
          - op: remove
            path: /metadata/ownerReferences
      failed_when: false

    - name: "Upgrade OLM -> Helm: Delete stale zen-tab-container-extensions configmap"
      when: comp_name == 'zen'
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: zen-tab-container-extensions
        namespace: "{{ cpd_instance_namespace }}"
      failed_when: false

    - name: "Upgrade OLM -> Helm: Resolve target zen_pak_version from rendered chart manifests"
      when:
        - comp_name == 'zen'
        - _existing_zenservice_lookup.resources | length > 0
      set_fact:
        _target_zen_pak_version: >-
          {{
            (
              (
                ns_chart_manifests.stdout
                if (ns_chart_manifests is defined and ns_chart_manifests.stdout is defined and ns_chart_manifests.stdout != '')
                else (ns_chart_manifests_airgap.stdout | default(''))
              )
              | from_yaml_all
              | select('ne', None)
              | selectattr('kind', 'defined')
              | selectattr('kind', 'equalto', 'ZenService')
              | map(attribute='spec.zen_pak_version')
              | select('defined')
              | first
            ) | default('', true)
          }}

    - name: "Upgrade OLM -> Helm: Resolve fallback zen_pak_version from Helm chart values"
      when:
        - comp_name == 'zen'
        - _existing_zenservice_lookup.resources | length > 0
        - _target_zen_pak_version | default('') == ''
      shell: >
        helm show values {{ cpd_helm_repo_name if not cpd_helm_airgap else cpd_airgap_helm_repo_url }}/zen
        --version {{ chart_version }}
        {{ helm_tls_flag }}
        | grep 'zen_pak_version:' | head -1 | awk '{print $2}' | tr -d '"'
      register: _fallback_zen_pak_version_lookup
      changed_when: false
      failed_when: false

    - name: "Upgrade OLM -> Helm: Set fallback zen_pak_version if needed"
      when:
        - comp_name == 'zen'
        - _existing_zenservice_lookup.resources | length > 0
        - _target_zen_pak_version | default('') == ''
        - _fallback_zen_pak_version_lookup is defined
        - _fallback_zen_pak_version_lookup.stdout is defined
        - _fallback_zen_pak_version_lookup.stdout | trim != ''
      set_fact:
        _target_zen_pak_version: "{{ _fallback_zen_pak_version_lookup.stdout | trim }}"

    - name: "Upgrade OLM -> Helm: Patch existing ZenService CR version and zen_pak_version"
      when:
        - comp_name == 'zen'
        - _existing_zenservice_lookup.resources | length > 0
      kubernetes.core.k8s:
        state: patched
        api_version: zen.cpd.ibm.com/v1
        kind: ZenService
        name: "{{ zen_cr_name }}"
        namespace: "{{ cpd_instance_namespace }}"
        definition:
          metadata:
            labels:
              app.kubernetes.io/managed-by: Helm
              component-id: zen
              icpdsupport/addOnId: zen-lite
          spec: >-
            {{
              {
                'version': cpd_components_meta.zen.cr_version,
                'non_olm_deploy': true,
                'non_olm': true
              }
              | combine({'zen_pak_version': _target_zen_pak_version} if (_target_zen_pak_version | default('') != '') else {})
            }}

# Install namespace-scoped chart (Operator, CR) using the native Ansible Helm module
- name: "Install/Upgrade {{ comp_name }} namespace-scoped chart"
  when:
    - not cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  kubernetes.core.helm:
    name: "{{ comp_name | replace('_', '-') }}"
    chart_ref: "{{ cpd_helm_repo_name }}/{{ comp_chart_name }}"
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ comp_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "{{ cpd_helm_timeout }}"
    values: "{{ comp_helm_values }}"

- name: "Write Helm values to temp file for {{ comp_name }} (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  copy:
    content: "{{ comp_helm_values | to_nice_yaml }}"
    dest: "/tmp/{{ comp_name }}-helm-values.yaml"
    mode: "0600"

- name: "Install/Upgrade {{ comp_name }} namespace-scoped chart with Helm (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  command: >
    helm upgrade --install {{ comp_name | replace('_', '-') }}
    {{ cpd_airgap_helm_repo_url }}/{{ comp_chart_name }}
    --version {{ chart_version }}
    -f /tmp/{{ comp_name }}-helm-values.yaml
    --namespace {{ comp_namespace }}
    --create-namespace
    --wait
    --timeout {{ cpd_helm_timeout }}
    {{ helm_tls_flag }}
  register: ns_install
  changed_when: "'has been upgraded' in ns_install.stdout or 'has been installed' in ns_install.stdout"
  retries: 10
  delay: 60
  until: ns_install is not failed

- name: "Remove Helm values temp file for {{ comp_name }} (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  file:
    path: "/tmp/{{ comp_name }}-helm-values.yaml"
    state: absent

- name: "{{ comp_name }} Helm charts installed"
  debug:
    msg:
      - "✓ {{ comp_name }} charts installed successfully"

---
# Install a single Helm component for CPD Platform (cluster-scoped + namespace-scoped charts)
# This task is independent and custom-tailored for cp4d platform installation.
#
# Parameters expected:
# - component_item: Component definition block containing:
#   - name
#   - assembly_name
#   - helm_chart_name
#   - helm_cluster_chart
#   - crd_name
#   - case_version
#   - namespace

- name: "Get component metadata for {{ component_item.name }}"
  set_fact:
    comp_name: "{{ component_item.name }}"
    comp_assembly: "{{ component_item.assembly_name }}"
    comp_chart_name: "{{ component_item.helm_chart_name }}"
    comp_cluster_chart: "{{ component_item.helm_cluster_chart }}"
    comp_crd_name: "{{ component_item.crd_name }}"
    comp_case_version: "{{ component_item.case_version }}"
    comp_namespace: "{{ component_item.namespace }}"

# helm search repo has no module equivalent - command is used for a read-only repo index query.
- name: "Resolve chart version from repo index"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
  vars:
    search_chart_name: "{{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }}"
  command: >
    helm search repo {{ cpd_helm_repo_name }}/{{ search_chart_name }}
    {% if comp_case_version != '' %}--version {{ comp_case_version }}{% endif %}
    --output json
  register: chart_search
  changed_when: false

- name: "Fail if chart not found in repository"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
    - (chart_search.stdout | from_json | length) == 0
  fail:
    msg: "Chart {{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }} version {{ comp_case_version }} not found in repository {{ cpd_helm_repo_name }}"

- name: "Set chart version from repo index"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
    - (chart_search.stdout | from_json | length) > 0
  set_fact:
    chart_version: "{{ (chart_search.stdout | from_json | first).version }}"

# Airgap: pull Chart.yaml from OCI registry to resolve actual version string.
# helm show chart has no module equivalent - shell is required here.
- name: "Resolve chart version from OCI registry (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart != "" or comp_chart_name != ""
  vars:
    search_chart_name: "{{ comp_cluster_chart if comp_cluster_chart != '' else comp_chart_name }}"
  shell: >
    helm show chart {{ cpd_airgap_helm_repo_url }}/{{ search_chart_name }}
    --insecure-skip-tls-verify 2>/dev/null
    | grep '^version:' | awk '{print $2}' | tr -d '"'
  register: chart_version_lookup
  changed_when: false

- name: "Set chart version from OCI registry (airgap)"
  when: cpd_helm_airgap
  set_fact:
    chart_version: "{{ chart_version_lookup.stdout | trim | default(comp_case_version) }}"

- name: "Component {{ comp_name }} chart version"
  debug:
    msg:
      - "Component: {{ comp_name }}"
      - "Assembly: {{ comp_assembly }}"
      - "Chart version: {{ chart_version }}"
      - "Chart name: {{ comp_chart_name }}"
      - "Cluster chart: {{ comp_cluster_chart }}"

# Helm values passed inline to all chart installs below
- name: "Set Helm values for {{ comp_name }}"
  set_fact:
    comp_helm_values:
      global:
        licenseAccept: true
        releaseVersion: "{{ cpd_product_version }}"
        operatorNamespace: "{{ cpd_operators_namespace }}"
        instanceNamespace: "{{ cpd_instance_namespace }}"
        controlCenterOperatorNamespace: "{{ cpd_operators_namespace }}"
        controlCenterInstanceNamespace: "{{ cpd_instance_namespace }}"
        blockStorageClass: "{{ cpd_metadata_storage_class }}"
        fileStorageClass: "{{ cpd_primary_storage_class }}"
        imagePullSecret: "{{ ibm_entitlement_key_secret }}"
        imagePullPrefix: icr.io
      "{{ comp_assembly }}":
        scaleConfig: "{{ cpd_scale_config }}"
        version: "{{ cpd_product_version }}"
        non_olm: true
        iamIntegration: "{{ cpd_iam_integration | bool }}"

# Install cluster-scoped chart (CRDs, ClusterRoles, etc.)
# helm template renders manifests into a variable (read-only, no cluster interaction).
# kubernetes.core.k8s then applies each manifest via Ansible's connection context
# with server-side apply to handle field ownership conflicts. No oc binary required.
- name: "Render {{ comp_name }} cluster-scoped chart manifests"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  shell: >
    helm template {{ comp_name | replace('_', '-') }}-cluster
    {{ cpd_helm_repo_name }}/{{ comp_cluster_chart }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
  register: cluster_chart_manifests
  changed_when: false

- name: "Apply {{ comp_name }} cluster-scoped chart manifests"
  when:
    - not cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    server_side_apply:
      force_conflicts: true
  loop: "{{ cluster_chart_manifests.stdout | from_yaml_all | list }}"

- name: "Render {{ comp_name }} cluster-scoped chart manifests (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  shell: >
    helm template {{ comp_name | replace('_', '-') }}-cluster
    {{ cpd_airgap_helm_repo_url }}/{{ comp_cluster_chart }}
    --version {{ chart_version }}
    --namespace {{ comp_namespace }}
    --set global.licenseAccept=true
    --set global.imagePullPrefix=icr.io
    --insecure-skip-tls-verify
  register: cluster_chart_manifests_airgap
  changed_when: false

- name: "Apply {{ comp_name }} cluster-scoped chart manifests (airgap)"
  when:
    - cpd_helm_airgap
    - comp_cluster_chart is defined and comp_cluster_chart != ""
  kubernetes.core.k8s:
    state: present
    definition: "{{ item }}"
    server_side_apply:
      force_conflicts: true
  loop: "{{ cluster_chart_manifests_airgap.stdout | from_yaml_all | list }}"

- name: "Wait for {{ comp_name }} CRD to be established"
  when: comp_crd_name is defined and comp_crd_name != ""
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ comp_crd_name }}"
  register: crd_check
  until:
    - crd_check.resources | length > 0
    - crd_check.resources[0].status.conditions is defined
    - crd_check.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 10

- name: "Fail if {{ comp_name }} CRD is not established"
  when:
    - comp_crd_name is defined and comp_crd_name != ""
    - crd_check.resources | length == 0
  fail:
    msg: "Timed out waiting for CustomResourceDefinition {{ comp_crd_name }} to be established."

# Install namespace-scoped chart (Operator, CR) using the native Ansible Helm module
- name: "Install/Upgrade {{ comp_name }} namespace-scoped chart"
  when:
    - not cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  kubernetes.core.helm:
    name: "{{ comp_name | replace('_', '-') }}"
    chart_ref: "{{ cpd_helm_repo_name }}/{{ comp_chart_name }}"
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ comp_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "{{ cpd_helm_timeout }}"
    values: "{{ comp_helm_values }}"

- name: "Install/Upgrade {{ comp_name }} namespace-scoped chart (airgap)"
  when:
    - cpd_helm_airgap
    - comp_chart_name is defined and comp_chart_name != ""
  kubernetes.core.helm:
    name: "{{ comp_name | replace('_', '-') }}"
    chart_ref: "{{ cpd_airgap_helm_repo_url }}/{{ comp_chart_name }}"
    chart_version: "{{ chart_version }}"
    release_namespace: "{{ comp_namespace }}"
    create_namespace: true
    wait: true
    wait_timeout: "{{ cpd_helm_timeout }}"
    values: "{{ comp_helm_values }}"

- name: "{{ comp_name }} Helm charts installed"
  debug:
    msg:
      - "✓ {{ comp_name }} charts installed successfully"

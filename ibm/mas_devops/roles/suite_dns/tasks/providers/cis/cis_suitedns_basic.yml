---

# 1. Validate required properties
# =============================================================================
- name: "cis : Fail if required properties are not provided"
  assert:
    that:
      - cis_crn != ""
      - cis_email != ""
      - cis_apikey != ""
    fail_msg: "One or more required properties are missing"


# 2. Lookup the cluster ingress
# =============================================================================
- name: "cis : Get cluster subdomain"
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: _cluster_subdomain

- name: "Configure ingress"
  when: ocp_ingress is not defined or ocp_ingress == ""
  set_fact:
    ocp_ingress: "cis-proxy-route.{{ _cluster_subdomain.resources[0].spec.domain }}"


# 3. Set up the DNS entries
# =============================================================================
- name: "cis : Define DNS Entries"
  set_fact:
    dns_entries: "{{ lookup('ansible.builtin.template', 'dnsentries.yml.j2') | from_yaml }}"

- name: "cis : Debug information"
  debug:
    msg:
      - "CIS CRN ................................ {{ cis_crn }}"
      - "CIS Subdomain .......................... {{ cis_subdomain }}"
      - "CIS Proxy .............................. {{ cis_proxy }}"
      - "OpenShift Ingress ...................... {{ ocp_ingress }}"
      - "DNS Entries (Wildcard) ................. {{ dns_entries['wildcard'] }}"

# 4. Add DNS entries
# =============================================================================
- name: "cis : run cis_dns_entries module"
  ibm.mas_devops.cis_dns_entries:
    ocp_ingress: "{{ ocp_ingress }}"
    cis_crn: "{{ cis_crn }}"
    cis_subdomain: "{{ cis_subdomain }}"
    update_dns: true
    ibmcloud_apikey: "{{ cis_apikey }}"
    dns_entries: "{{ dns_entries['wildcard'] }}"
    cis_waf: null
    cis_proxy: "{{ cis_proxy }}"
  register: dnsoutput

- name: "cis : dump output"
  debug:
    msg: '{{ dnsoutput }}'

# Apply CIS WAF custom rule from allow_list.
# ibmcloud login is required here because this path does not invoke the
# ibmcloud CLI before this point (it uses the Python cis_dns_entries module instead).
- name: "cis : login to IBM Cloud for WAF custom rule"
  ansible.builtin.shell: |
    ibmcloud login --apikey "{{ cis_apikey }}" -q --no-region
  retries: 10
  delay: 60 # 1 minute
  when: allow_list | string != "[]" and allow_list | string | length > 0

- name: "cis : configure CIS WAF custom rule from allow_list"
  ansible.builtin.include_tasks: tasks/providers/cis/cis_waf_custom_rule_lockdown.yml

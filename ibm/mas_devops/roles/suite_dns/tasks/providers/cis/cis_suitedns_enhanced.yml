---
- name: "cis : suite dns — full CIS block"
  block:

    - ansible.builtin.include_tasks: tasks/providers/cis/cis_dns_mgmt.yml

    - name: "cis : login to IBM Cloud"
      ansible.builtin.shell: |
        ibmcloud login --apikey "{{ cis_apikey }}" -q --no-region
      retries: 10
      delay: 60 # 1 minute
      no_log: true

    - name: "cis: configure edge certificate (MAS mode)"
      when: is_mas_mode
      ansible.builtin.include_tasks: tasks/providers/cis/cis_edge_certificate.yml
      vars:
        instance_id: "{{ mas_instance_id }}"
        edge_cert_entries: "{{ edge_cert_routes['mas'] }}"

    # Decide once which allowlist passes apply, and whether feature status can be reported.
    # Status reporting needs every variable below; subscription_id is optional and is only
    # passed to the status call when set.
    - name: "cis : ip-allowlist — work out what applies"
      ansible.builtin.set_fact:
        _cis_mas_allowlist_enabled: >-
          {{ is_mas_mode and (cis_waf | bool)
             and mas_channel is defined and mas_channel != ""
             and mas_channel.split('.')[:2] | join('.') is version('9.1', '>=') }}
        _cis_aiservice_allowlist_enabled: "{{ is_aiservice_mode and (cis_waf | bool) }}"
        _cis_status_missing_vars: >-
          {{ {'devops_mongo_uri': devops_mongo_uri,
              'account_id': account_id,
              'cluster_id': cluster_id,
              'region_id': region_id}
             | dict2items | selectattr('value', 'equalto', '') | map(attribute='key') | list }}

    - name: "cis : ip-allowlist — feature status reporting"
      ansible.builtin.set_fact:
        _cis_status_enabled: "{{ is_mas_mode and _cis_status_missing_vars | length == 0 }}"

    - name: "cis : ip-allowlist — feature status reporting disabled"
      when:
        - _cis_mas_allowlist_enabled | bool
        - not (_cis_status_enabled | bool)
      ansible.builtin.debug:
        msg: "Allow-list feature status will not be written, these variables are not set: {{ _cis_status_missing_vars | join(', ') }}"

    # set REQUESTED if allowlist config changed (create / update / delete paths)
    - name: "cis : ip-allowlist — set REQUESTED status"
      when: _cis_mas_allowlist_enabled | bool
      ansible.builtin.include_tasks: tasks/providers/cis/cis_ip_allowlist_requested.yml

    - name: "cis : Reset facts"
      set_fact:
        dedicated_list: []
        non_dro_list: []
        hasDedicated: false
        dedicatedId: ""
        edge_cert_output: {}
        _deleted_certificate: {}

    - name: "cis: configure edge certificate (AI Service mode)"
      when: is_aiservice_mode
      ansible.builtin.include_tasks: tasks/providers/cis/cis_edge_certificate.yml
      vars:
        instance_id: "{{ aiservice_instance_id }}"
        edge_cert_entries: "{{ edge_cert_routes['aiservice'] }}"

    - name: "cis: use managed_rulesets"
      ansible.builtin.shell: |
        ibmcloud cis waf-packages {{ _cis_domain_id}} \
        -i "{{ cis_service_name }}"
      failed_when: false
      register: error_output

    - name: "cis: configure WAF rules"
      when: error_output.rc == 0
      block:
        # Load the WAF rules to disable

        - name: "cis : WAF rules to disable"
          include_vars: vars/waf_rules_to_disable.yml

        - include_tasks: tasks/providers/cis/cis_waf_rule.yml
          loop: "{{ waf_rules_to_disable }}"

    - name: "cis: Configure WAF managed rulesets"
      when: error_output.rc != 0
      block:

        - name: "cis: list of managed ruleset rules to disable"
          ansible.builtin.include_vars: vars/managed_ruleset_rules_to_disable.yml

        - name: "cis: get deployed rule id for CIS Managed Ruleset"
          ansible.builtin.shell: |
            ibmcloud cis managed-waf deployments {{ _cis_domain_id }} \
            -i "{{ cis_service_name }}" --output json | jq -r \
            '(.rules // [])[] | select(.action_parameters.id != null) | .id' | head -1
          register: _cis_rule_id_result

        - name: "cis: set deployed rule id fact"
          ansible.builtin.set_fact:
            _cis_rule_id: "{{ _cis_rule_id_result.stdout | trim }}"

        - name: "cis: get IAM token for CIS API"
          ansible.builtin.shell: |
            ibmcloud iam oauth-tokens --output json | jq -r '.iam_token'
          register: _cis_iam_token_result
          when: _cis_rule_id | trim | length == 0
          no_log: true

        - name: "cis: check if http_request_firewall_managed entry point ruleset exists"
          ansible.builtin.shell: |
            curl -s -X GET \
              "https://api.cis.cloud.ibm.com/v1/{{ cis_crn }}/zones/{{ _cis_domain_id }}/rulesets/phases/http_request_firewall_managed/entrypoint" \
              -H "X-Auth-User-Token: {{ _cis_iam_token_result.stdout }}" \
              -H "Content-Type: application/json"
          register: _cis_entrypoint_check_result
          failed_when: false
          when: _cis_rule_id | trim | length == 0
          no_log: true

        - name: "cis: debug entry point ruleset check result"
          ansible.builtin.debug:
            msg: "{{ _cis_entrypoint_check_result.stdout | from_json }}"
          when: _cis_rule_id | trim | length == 0

        - name: "cis: create http_request_firewall_managed entry point ruleset via API"
          ansible.builtin.shell: |
            curl -s -X POST \
              "https://api.cis.cloud.ibm.com/v1/{{ cis_crn }}/zones/{{ _cis_domain_id }}/rulesets" \
              -H "X-Auth-User-Token: {{ _cis_iam_token_result.stdout }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"Zone-level phase entry point","kind":"zone","description":"WAF managed rule entrypoint ruleset.","phase":"http_request_firewall_managed"}'
          register: _cis_entrypoint_create_result
          when:
            - _cis_rule_id | trim | length == 0
            - not (_cis_entrypoint_check_result.stdout | from_json).success
          no_log: true

        - name: "cis: debug entry point ruleset creation response"
          ansible.builtin.debug:
            msg: "{{ _cis_entrypoint_create_result.stdout | from_json }}"
          when:
            - _cis_rule_id | trim | length == 0
            - not (_cis_entrypoint_check_result.stdout | from_json).success

        - name: "cis: verify http_request_firewall_managed entry point ruleset after creation"
          ansible.builtin.shell: |
            curl -s -X GET \
              "https://api.cis.cloud.ibm.com/v1/{{ cis_crn }}/zones/{{ _cis_domain_id }}/rulesets/phases/http_request_firewall_managed/entrypoint" \
              -H "X-Auth-User-Token: {{ _cis_iam_token_result.stdout }}" \
              -H "Content-Type: application/json"
          register: _cis_entrypoint_verify_result
          when:
            - _cis_rule_id | trim | length == 0
            - not (_cis_entrypoint_check_result.stdout | from_json).success
          no_log: true

        - name: "cis: debug entry point ruleset verification result"
          ansible.builtin.debug:
            msg: "{{ _cis_entrypoint_verify_result.stdout | from_json }}"
          when:
            - _cis_rule_id | trim | length == 0
            - not (_cis_entrypoint_check_result.stdout | from_json).success

        - name: "cis: deploy and enable WAF managed rulesets"
          ansible.builtin.include_tasks: tasks/providers/cis/cis_deploy_managed_ruleset.yml
          loop:
            - name: "CIS Managed Ruleset"
            - name: "CIS OWASP Core Ruleset"

        - ansible.builtin.include_tasks: tasks/providers/cis/cis_managed_ruleset.yml
          loop: "{{ managed_ruleset_rules_to_disable }}"

    - ansible.builtin.include_tasks: tasks/providers/cis/cis_domain_setting.yml

    - name: "cis : ip-allowlist — mas version check"
      when:
        - cis_allowed_ips is defined and cis_allowed_ips | trim | length > 0
      ansible.builtin.debug:
        msg: >-
          {% if mas_channel is not defined or mas_channel == "" %}
          MAS channel is not set — IP allowlist is not supported, skipping.
          {% elif mas_channel.split('.')[:2] | join('.') is version('9.1', '>=') %}
          MAS channel is '{{ mas_channel }}' (>= 9.1) — IP allowlist will run.
          {% else %}
          MAS channel is '{{ mas_channel }}' (< 9.1) — IP allowlist is not supported, skipping.
          {% endif %}

    - name: "cis : configure WAF IP allowlist for MAS"
      when: _cis_mas_allowlist_enabled | bool
      ansible.builtin.include_tasks: tasks/providers/cis/cis_ip_allowlist.yml
      vars:
        instance_id: "{{ mas_instance_id }}"
        domain: "{{ mas_domain }}"

    - name: "cis : configure WAF IP allowlist for AI Service"
      when: _cis_aiservice_allowlist_enabled | bool
      ansible.builtin.include_tasks: tasks/providers/cis/cis_ip_allowlist.yml
      vars:
        instance_id: "{{ aiservice_instance_id }}"
        domain: "{{ aiservice_domain }}"

    # Raised whether or not status reporting is active, so a failed CIS call always fails the job.
    - name: "cis : raise captured soft failure"
      ansible.builtin.fail:
        msg: "CIS task failed: {{ _cis_error.msg }} (rc={{ _cis_error.rc }})"
      when: _cis_error is defined

  rescue:
    # ERROR is only written when an allowlist change was requested for MAS and has not
    # completed. A failure after the change completed leaves ACTIVE / DEACTIVATED untouched.
    - name: "cis : status update: ERROR (rescue)"
      when:
        - _cis_status_enabled | default(false) | bool
        - _cis_allowlist_status_base_args is defined
        - not (_cis_mas_allowlist_completed | default(false) | bool)
      vars:
        _cis_failure_message: "{{ ansible_failed_result.msg | default(_cis_error.msg | default('Unknown CIS error')) | string }}"
        _cis_error_status_details: >-
          {{ {'message': _cis_failure_message,
              'error_code': (ansible_failed_result.rc | default(_cis_error.rc | default(-1))) | int,
              'error_source': {
                'gitops_version': lookup('env', 'GITOPS_VERSION') | default('', true),
                'filename': 'cis_suitedns_enhanced.yml',
                'log_file': 'oc logs -n mas-' ~ mas_instance_id ~ '-syncres ' ~ lookup('env', 'HOSTNAME'),
                'stacktrace': _cis_failure_message
              },
              'request_configuration': _cis_normalised_ips | default([]) | join(', ')} }}
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status ERROR \
          --status-details {{ _cis_error_status_details | to_json | quote }} \
          --deployment-end {{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') | quote }}
      failed_when: false
      register: _cis_status_error_rescue_result

    - name: "cis : status update: ERROR rescue (result)"
      ansible.builtin.debug:
        var: _cis_status_error_rescue_result
      when: _cis_status_error_rescue_result is not skipped

    - name: "cis : re-raise failure after ERROR status written"
      ansible.builtin.fail:
        msg: "CIS suite_dns job failed: {{ ansible_failed_result.msg | default('see above') }}"

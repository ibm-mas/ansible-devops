---
# Manage a CIS WAF custom rule that blocks all traffic except from IPs in cis_allowed_ips.
- name: "cis : ip-allowlist — set unique rule description for MAS"
  when: is_mas_mode
  ansible.builtin.set_fact:
    _cis_allowlist_rule_desc: "mas-ip-allowlist-{{ domain }}"

- name: "cis : ip-allowlist — set unique rule description for AI Service"
  when: is_aiservice_mode
  ansible.builtin.set_fact:
    _cis_allowlist_rule_desc: "aiservice-ip-allowlist-{{ domain }}"

# Reuse preflight fetch result from cis_ip_allowlist_requested.yml if available (MAS create/update).
# For AI Service and MAS delete path (requested skipped), fetch fresh.
- name: "cis : ip-allowlist — preflight rules result (already fetched)"
  ansible.builtin.set_fact:
    _cis_custom_rules_result: "{{ _cis_preflight_rules_result }}"
  when: _cis_preflight_rules_result is defined

- name: "cis : ip-allowlist — get existing custom WAF rules (no preflight available)"
  ansible.builtin.shell: |
    ibmcloud cis custom-waf rules {{ _cis_domain_id }} \
      -i "{{ cis_service_name }}" --output json
  register: _cis_custom_rules_result
  failed_when: false
  when: _cis_preflight_rules_result is not defined

- name: "cis : ip-allowlist — capture failure (fetch rules)"
  ansible.builtin.set_fact:
    _cis_error:
      rc: "{{ _cis_custom_rules_result['rc'] }}"
      msg: "{{ ((_cis_custom_rules_result['stdout_lines'] | default([])) + (_cis_custom_rules_result['stderr_lines'] | default([]))) | join(' ') | replace(\"'\", '') }}"
  when: _cis_custom_rules_result['rc'] != 0

- name: "cis : ip-allowlist — find existing rule id by description"
  ansible.builtin.set_fact:
    _cis_allowlist_rule_id: >-
      {{ (_cis_custom_rules_result['stdout'] | from_json).get('rules', [])
         | selectattr('description', 'defined')
         | selectattr('description', 'equalto', _cis_allowlist_rule_desc)
         | map(attribute='id') | list | first | default('') }}
  when: _cis_custom_rules_result['rc'] == 0 and _cis_custom_rules_result['stdout'] | trim | length > 0

- name: "cis : ip-allowlist — set rule id to empty when rules could not be fetched"
  ansible.builtin.set_fact:
    _cis_allowlist_rule_id: ""
  when: _cis_custom_rules_result['rc'] != 0 or _cis_custom_rules_result['stdout'] | trim | length == 0

- name: "cis : ip-allowlist — manage deletion (allow_list empty or removed)"
  when: cis_allowed_ips | trim | length == 0
  block:

    - name: "cis : ip-allowlist — no existing rule to delete (nothing to do)"
      ansible.builtin.debug:
        msg: "No WAF allowlist rule found for '{{ _cis_allowlist_rule_desc }}', nothing to delete"
      when: _cis_allowlist_rule_id | trim | length == 0

    - name: "cis : ip-allowlist — delete existing WAF block rule"
      ansible.builtin.shell: |
        ibmcloud cis custom-waf rule-delete {{ _cis_domain_id }} \
          {{ _cis_allowlist_rule_id }} \
          -i "{{ cis_service_name }}" --force
      register: _cis_allowlist_delete_result
      retries: 5
      delay: 30
      until: _cis_allowlist_delete_result.rc == 0
      failed_when: false
      when: _cis_allowlist_rule_id | trim | length > 0

    - name: "cis : ip-allowlist — capture failure (delete)"
      ansible.builtin.set_fact:
        _cis_error:
          rc: "{{ _cis_allowlist_delete_result.rc }}"
          msg: "{{ ((_cis_allowlist_delete_result.stdout_lines | default([])) + (_cis_allowlist_delete_result.stderr_lines | default([]))) | join(' ') | replace(\"'\", '') }}"
      when:
        - _cis_allowlist_delete_result is defined
        - _cis_allowlist_delete_result.rc != 0

    - name: "cis : ip-allowlist — capture deployment end timestamp (delete)"
      ansible.builtin.set_fact:
        _cis_allowlist_deployment_end: "{{ ansible_facts['date_time']['iso8601'] }}"
      when:
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_allowlist_delete_result is defined
        - _cis_allowlist_delete_result.rc == 0

    - name: "cis : ip-allowlist — build status-update base args (delete)"
      ansible.builtin.set_fact:
        _cis_allowlist_status_base_args: >-
          --region "{{ region_id }}"
          --instance-id "{{ mas_instance_id }}"
          --account "{{ account_id }}"
          --cluster "{{ cluster_id }}"
          --subscription-id "{{ subscription_id }}"
          --type allow-list
          --feature-details '{"ips": []}'
          --deployment-start "{{ _cis_allowlist_deployment_end }}"
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_allowlist_delete_result is defined
        - _cis_allowlist_delete_result.rc == 0

    - name: "cis : ip-allowlist — status update: DEACTIVATED (delete)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status DEACTIVATED \
          --status-details '{"message": "Allow list has been deactivated.", "request_configuration": ""}' \
          --deployment-end "{{ _cis_allowlist_deployment_end }}"
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_allowlist_delete_result is defined
        - _cis_allowlist_delete_result.rc == 0
      failed_when: false
      register: _cis_status_deactivated_result

    - name: "cis : ip-allowlist — status update: DEACTIVATED (result)"
      ansible.builtin.debug:
        var: _cis_status_deactivated_result
      when: _cis_status_deactivated_result is defined

    - name: "cis : ip-allowlist — deletion confirmed"
      ansible.builtin.debug:
        msg: "WAF IP allowlist rule '{{ _cis_allowlist_rule_desc }}' deleted successfully for instance {{ instance_id }}"
      when: _cis_allowlist_rule_id | trim | length > 0

- name: "cis : ip-allowlist — manage create/update (allow_list set)"
  when: cis_allowed_ips | trim | length > 0
  block:

    - name: "cis : ip-allowlist — normalise allowed IPs"
      ansible.builtin.set_fact:
        _cis_normalised_ips: >-
          {{ cis_allowed_ips
             | regex_replace('(^\[|\]$)', '')
             | regex_replace(',', ' ')
             | split()
             | select('match', '.+')
             | list }}

    - name: "cis : ip-allowlist — build WAF expression"
      ansible.builtin.set_fact:
        _cis_allowlist_expression: >-
          {{ '(not ip.src in {' + (_cis_normalised_ips | join(' ')) + '} and http.host contains "' + domain + '")' }}

    # -------------------------------------------------------------------------
    # Fetch current expression BEFORE any status or API decision.
    # Set to empty string when no rule exists (create path) so the comparison
    # _cis_existing_expression != _cis_allowlist_expression is always true there.
    # -------------------------------------------------------------------------
    - name: "cis : ip-allowlist — fetch current rule expression (existing rule)"
      ansible.builtin.set_fact:
        _cis_existing_expression: >-
          {{ (_cis_custom_rules_result['stdout'] | from_json).get('rules', [])
             | selectattr('description', 'equalto', _cis_allowlist_rule_desc)
             | map(attribute='expression') | list | first | default('') }}
      when: _cis_allowlist_rule_id | trim | length > 0

    - name: "cis : ip-allowlist — set existing expression to empty (no rule yet)"
      ansible.builtin.set_fact:
        _cis_existing_expression: ""
      when: _cis_allowlist_rule_id | trim | length == 0

    - name: "cis : ip-allowlist — show configuration"
      ansible.builtin.debug:
        msg:
          - "Rule Description ......... {{ _cis_allowlist_rule_desc }}"
          - "CIS Allowed IPs .......... {{ cis_allowed_ips }}"
          - "Normalised IPs ........... {{ _cis_normalised_ips }}"
          - "WAF Expression ........... {{ _cis_allowlist_expression }}"
          - "Existing Expression ...... {{ _cis_existing_expression | default('(none)') }}"
          - "Existing Rule ID ......... {{ _cis_allowlist_rule_id | default('(none — will create)') }}"
          - "Config changed ........... {{ _cis_existing_expression != _cis_allowlist_expression }}"

    # -------------------------------------------------------------------------
    # No-op: rule already exists with the same expression.
    # No CIS API call, no status update.
    # -------------------------------------------------------------------------
    - name: "cis : ip-allowlist — no change detected, skipping"
      ansible.builtin.debug:
        msg: >-
          WAF IP allowlist rule '{{ _cis_allowlist_rule_desc }}' is already up to date,
          no status update or CIS API call required for instance {{ instance_id }}
      when:
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression == _cis_allowlist_expression

    # -------------------------------------------------------------------------
    # Create path: no existing rule
    #   IN_PROGRESS → ibmcloud rule-create → ACTIVE / ERROR
    # -------------------------------------------------------------------------
    - name: "cis : ip-allowlist — status update: IN_PROGRESS (create)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status IN_PROGRESS \
          --status-details '{"message": "Allow list deployment in progress.", "request_configuration": "{{ _cis_normalised_ips | join(", ") }}"}'
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length == 0
      failed_when: false
      register: _cis_status_in_progress_create_result

    - name: "cis : ip-allowlist — status update: IN_PROGRESS create (result)"
      ansible.builtin.debug:
        var: _cis_status_in_progress_create_result
      when: _cis_status_in_progress_create_result is defined

    # TODO: REMOVE — inject bad service name to force CIS error for error block testing (mvidev3 only)
    - name: "cis : ip-allowlist — [TEST] inject bad CIS service name for mvidev3"
      ansible.builtin.set_fact:
        cis_service_name: "INVALID-SERVICE-NAME-TEST"
      when:
        - _cis_allowlist_rule_id | trim | length == 0
        - instance_id == "mvidev3"

    - name: "cis : ip-allowlist — create WAF block rule (new)"
      ansible.builtin.shell: |
        EXPR='{{ _cis_allowlist_expression }}'
        ibmcloud cis custom-waf rule-create {{ _cis_domain_id }} \
          -i "{{ cis_service_name }}" \
          --action block \
          --match "$EXPR" \
          --description "{{ _cis_allowlist_rule_desc }}" \
          --enabled true
      register: _cis_allowlist_create_result
      retries: 5
      delay: 30
      until: _cis_allowlist_create_result.rc == 0
      failed_when: false
      when: _cis_allowlist_rule_id | trim | length == 0

    - name: "cis : ip-allowlist — capture deployment end timestamp (create)"
      ansible.builtin.set_fact:
        _cis_allowlist_deployment_end: "{{ ansible_facts['date_time']['iso8601'] }}"
      when:
        - _cis_allowlist_rule_id | trim | length == 0
        - _cis_allowlist_create_result is defined

    - name: "cis : ip-allowlist — capture failure (create)"
      ansible.builtin.set_fact:
        _cis_error:
          rc: "{{ _cis_allowlist_create_result.rc }}"
          msg: "{{ ((_cis_allowlist_create_result.stdout_lines | default([])) + (_cis_allowlist_create_result.stderr_lines | default([]))) | join(' ') | replace(\"'\", '') }}"
      when:
        - _cis_allowlist_create_result is defined
        - _cis_allowlist_create_result.rc != 0

    - name: "cis : ip-allowlist — status update: ACTIVE (create)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status ACTIVE \
          --status-details '{"message": "Allow list is active.", "request_configuration": "{{ _cis_normalised_ips | join(", ") }}"}' \
          --deployment-end "{{ _cis_allowlist_deployment_end }}"
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length == 0
        - _cis_allowlist_create_result is defined
        - _cis_allowlist_create_result.rc == 0
      failed_when: false
      register: _cis_status_active_create_result

    - name: "cis : ip-allowlist — status update: ACTIVE create (result)"
      ansible.builtin.debug:
        var: _cis_status_active_create_result
      when: _cis_status_active_create_result is defined

    # -------------------------------------------------------------------------
    # Update path: rule exists AND expression has changed
    #   IN_PROGRESS → ibmcloud rule-update → ACTIVE / ERROR
    # When expression is unchanged: none of these tasks run (no API call, no status).
    # -------------------------------------------------------------------------
    - name: "cis : ip-allowlist — status update: IN_PROGRESS (update)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status IN_PROGRESS \
          --status-details '{"message": "Allow list deployment in progress.", "request_configuration": "{{ _cis_normalised_ips | join(", ") }}"}'
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression != _cis_allowlist_expression
      failed_when: false
      register: _cis_status_in_progress_update_result

    - name: "cis : ip-allowlist — status update: IN_PROGRESS update (result)"
      ansible.builtin.debug:
        var: _cis_status_in_progress_update_result
      when: _cis_status_in_progress_update_result is defined

    # TODO: REMOVE — inject bad service name to force CIS error for error block testing (mvidev3 only)
    - name: "cis : ip-allowlist — [TEST] inject bad CIS service name for mvidev3"
      ansible.builtin.set_fact:
        cis_service_name: "INVALID-SERVICE-NAME-TEST"
      when:
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression != _cis_allowlist_expression
        - instance_id == "mvidev3"

    - name: "cis : ip-allowlist — update WAF block rule (existing)"
      ansible.builtin.shell: |
        EXPR='{{ _cis_allowlist_expression }}'
        ibmcloud cis custom-waf rule-update {{ _cis_domain_id }} \
          {{ _cis_allowlist_rule_id }} \
          -i "{{ cis_service_name }}" \
          --action block \
          --match "$EXPR" \
          --description "{{ _cis_allowlist_rule_desc }}" \
          --enabled true
      register: _cis_allowlist_update_result
      retries: 5
      delay: 30
      until: _cis_allowlist_update_result.rc == 0
      failed_when: false
      when:
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression != _cis_allowlist_expression

    - name: "cis : ip-allowlist — capture deployment end timestamp (update)"
      ansible.builtin.set_fact:
        _cis_allowlist_deployment_end: "{{ ansible_facts['date_time']['iso8601'] }}"
      when:
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression != _cis_allowlist_expression
        - _cis_allowlist_update_result is defined

    - name: "cis : ip-allowlist — capture failure (update)"
      ansible.builtin.set_fact:
        _cis_error:
          rc: "{{ _cis_allowlist_update_result.rc }}"
          msg: "{{ ((_cis_allowlist_update_result.stdout_lines | default([])) + (_cis_allowlist_update_result.stderr_lines | default([]))) | join(' ') | replace(\"'\", '') }}"
      when:
        - _cis_allowlist_update_result is defined
        - _cis_allowlist_update_result.rc != 0

    - name: "cis : ip-allowlist — status update: ACTIVE (update)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status ACTIVE \
          --status-details '{"message": "Allow list is active.", "request_configuration": "{{ _cis_normalised_ips | join(", ") }}"}' \
          --deployment-end "{{ _cis_allowlist_deployment_end }}"
      when:
        - is_mas_mode
        - _cis_allowlist_rule_id | trim | length > 0
        - _cis_existing_expression != _cis_allowlist_expression
        - _cis_allowlist_update_result is defined
        - _cis_allowlist_update_result.rc == 0
      failed_when: false
      register: _cis_status_active_update_result

    - name: "cis : ip-allowlist — status update: ACTIVE update (result)"
      ansible.builtin.debug:
        var: _cis_status_active_update_result
      when: _cis_status_active_update_result is defined

    - name: "cis : ip-allowlist — result"
      ansible.builtin.debug:
        msg: >-
          WAF IP allowlist rule '{{ _cis_allowlist_rule_desc }}'
          {{ 'created' if _cis_allowlist_rule_id | trim | length == 0 else 'updated' }}
          successfully for instance {{ instance_id }}
      when: _cis_existing_expression != _cis_allowlist_expression

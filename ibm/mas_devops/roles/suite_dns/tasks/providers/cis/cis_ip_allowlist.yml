---
# Manage CIS IP allowlist for a MAS instance using firewall lockdown rules.
#
# cis_allowed_ips is a comma-separated string e.g. "1.2.3.4,5.6.7.8,10.0.0.0/8"
# It may also arrive as a bracketed list string e.g. "[1.2.3.4/32]" from
# Helm rendering a YAML list — brackets are stripped before use.
#
# Behaviour:
#   - If cis_allowed_ips is empty  → skip entirely (no rule created or deleted)
#   - If cis_allowed_ips is set    →
#       1. Delete any existing custom WAF rule named "mas-ip-allowlist-<instance>"
#       2. Create/update a firewall lockdown rule for the instance domain
#
# Lockdown rules only evaluate IPv4. IPv6 traffic passes through unaffected,
# which avoids blocking internal OCP callbacks and dual-stack clients.
# =============================================================================

- name: "cis : skip IP allowlist — cis_allowed_ips is not set"
  ansible.builtin.debug:
    msg: "cis_allowed_ips is empty, skipping IP allowlist configuration"
  when: cis_allowed_ips | trim | length == 0

- name: "cis : configure IP allowlist via firewall lockdown"
  when: cis_allowed_ips | trim | length > 0
  block:

    # ------------------------------------------------------------------
    # Normalise IPs — strip brackets, split on whitespace or comma
    # ------------------------------------------------------------------
    - name: "cis : normalise allowed IPs"
      ansible.builtin.set_fact:
        _cis_normalised_ips: "{{ cis_allowed_ips | regex_replace('(^\\[|\\]$)', '') | regex_replace(',', ' ') | split() | select('match', '.+') | list }}"

    - name: "cis : show normalised IPs"
      ansible.builtin.debug:
        msg:
          - "CIS Allowed IPs (raw) .... {{ cis_allowed_ips }}"
          - "Normalised IPs ........... {{ _cis_normalised_ips }}"

    # ------------------------------------------------------------------
    # Step 1 — Delete existing custom WAF rule if present
    # ------------------------------------------------------------------
    - name: "cis : get existing custom WAF rules"
      ansible.builtin.shell: |
        ibmcloud cis custom-waf rules {{ (_cis_domains_result.stdout | from_json)[0].id }} \
          -i "{{ cis_service_name }}" --output json
      register: _cis_custom_rules_result
      failed_when: false

    - name: "cis : find existing custom WAF allowlist rule id"
      ansible.builtin.set_fact:
        _cis_waf_rule_id: >-
          {{ (_cis_custom_rules_result.stdout | from_json).get('rules', [])
             | selectattr('description', 'defined')
             | selectattr('description', 'equalto', 'mas-ip-allowlist-' ~ mas_instance_id)
             | map(attribute='id') | list | first | default('') }}
      when: _cis_custom_rules_result.rc == 0 and _cis_custom_rules_result.stdout | trim | length > 0

    - name: "cis : set waf rule id to empty when no custom rules exist"
      ansible.builtin.set_fact:
        _cis_waf_rule_id: ""
      when: _cis_custom_rules_result.rc != 0 or _cis_custom_rules_result.stdout | trim | length == 0

    - name: "cis : delete existing custom WAF allowlist rule"
      ansible.builtin.shell: |
        ibmcloud cis custom-waf rule-delete {{ (_cis_domains_result.stdout | from_json)[0].id }} \
          {{ _cis_waf_rule_id }} \
          -i "{{ cis_service_name }}" -f
      when: _cis_waf_rule_id | trim | length > 0
      register: _cis_waf_delete_result
      retries: 3
      delay: 10
      until: _cis_waf_delete_result.rc == 0

    - name: "cis : confirm custom WAF rule deleted"
      ansible.builtin.debug:
        msg: "Deleted custom WAF rule {{ _cis_waf_rule_id }} for instance {{ mas_instance_id }}"
      when: _cis_waf_rule_id | trim | length > 0

    - name: "cis : no custom WAF rule to delete"
      ansible.builtin.debug:
        msg: "No existing custom WAF rule found for mas-ip-allowlist-{{ mas_instance_id }}"
      when: _cis_waf_rule_id | trim | length == 0

    # ------------------------------------------------------------------
    # Step 2 — Build lockdown rule JSON
    # Correct CLI syntax (from sample):
    #   ibmcloud cis firewall-create --type lockdowns --domain <zone_id>
    #     --json '{"urls":["*.domain.com"],"configurations":[{"target":"ip","value":"1.2.3.4"}]}'
    #     --instance <service_name>
    # Notes:
    #   - IP values must be plain IPs, no CIDR suffix (strip /32 etc.)
    #   - URLs do not need trailing /*
    #   - JSON must be single-line (no embedded newlines)
    # ------------------------------------------------------------------
    - name: "cis : build lockdown configurations list"
      ansible.builtin.set_fact:
        _cis_lockdown_configs: "{{ _cis_normalised_ips | map('regex_replace', '/.*$', '') | map('regex_replace', '^(.+)$', '{\"target\":\"ip\",\"value\":\"\\1\"}') | list | join(',') }}"

    - name: "cis : build lockdown JSON payload (single-line)"
      ansible.builtin.set_fact:
        _cis_lockdown_json: '{"urls":["*.{{ mas_domain }}","{{ mas_domain }}"],"configurations":[{{ _cis_lockdown_configs }}],"description":"mas-ip-allowlist-{{ mas_instance_id }}"}'

    - name: "cis : show lockdown payload"
      ansible.builtin.debug:
        msg:
          - "All IPs for lockdown ..... {{ _cis_normalised_ips }}"
          - "Lockdown JSON ............ {{ _cis_lockdown_json }}"

    # ------------------------------------------------------------------
    # Step 3 — Find ALL existing lockdown rules for this instance
    # ------------------------------------------------------------------
    - name: "cis : get existing firewall lockdown rules"
      ansible.builtin.shell: |
        ibmcloud cis firewalls \
          -t lockdowns \
          -d {{ (_cis_domains_result.stdout | from_json)[0].id }} \
          -i "{{ cis_service_name }}" --output json
      register: _cis_lockdown_list_result
      failed_when: false

    - name: "cis : build list of all existing lockdown rule ids for this instance"
      ansible.builtin.set_fact:
        _cis_lockdown_all_ids: >-
          {{ (_cis_lockdown_list_result.stdout | from_json)
             | selectattr('description', 'defined')
             | selectattr('description', 'equalto', 'mas-ip-allowlist-' ~ mas_instance_id)
             | map(attribute='id') | list }}
      when: _cis_lockdown_list_result.rc == 0 and _cis_lockdown_list_result.stdout | trim | length > 0

    - name: "cis : set empty lockdown id list when none exist"
      ansible.builtin.set_fact:
        _cis_lockdown_all_ids: []
      when: _cis_lockdown_list_result.rc != 0 or _cis_lockdown_list_result.stdout | trim | length == 0

    - name: "cis : show existing lockdown rule ids"
      ansible.builtin.debug:
        msg: "Existing lockdown rule ids for mas-ip-allowlist-{{ mas_instance_id }}: {{ _cis_lockdown_all_ids }}"

    # ------------------------------------------------------------------
    # Step 4 — Delete ALL existing rules (handles duplicates), then create fresh
    # ------------------------------------------------------------------
    - name: "cis : delete all existing lockdown rules for this instance"
      ansible.builtin.shell: |
        ibmcloud cis firewall-delete {{ item }} \
          -t lockdowns \
          -d {{ (_cis_domains_result.stdout | from_json)[0].id }} \
          -i "{{ cis_service_name }}"
      loop: "{{ _cis_lockdown_all_ids }}"
      when: _cis_lockdown_all_ids | length > 0
      register: _cis_lockdown_delete_result
      retries: 3
      delay: 10
      until: _cis_lockdown_delete_result.rc == 0

    - name: "cis : create firewall lockdown rule"
      ansible.builtin.shell: |
        ibmcloud cis firewall-create \
          --type lockdowns \
          -d {{ (_cis_domains_result.stdout | from_json)[0].id }} \
          -i "{{ cis_service_name }}" \
          --json '{{ _cis_lockdown_json }}'
      register: _cis_lockdown_create_result
      retries: 5
      delay: 30
      until: _cis_lockdown_create_result.rc == 0

    - name: "cis : show lockdown rule result"
      ansible.builtin.debug:
        msg: "Firewall lockdown rule created for instance {{ mas_instance_id }}"

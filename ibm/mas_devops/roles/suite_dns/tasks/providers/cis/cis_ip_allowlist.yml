---
# Manage CIS IP allowlist for a MAS instance using firewall lockdown rules.
#
# TEMPORARY: Firewall lockdown rule creation is disabled.
# This task only deletes any existing lockdown rules for the instance.
# =============================================================================

- name: "cis : skip IP allowlist — firewall lockdown disabled"
  ansible.builtin.debug:
    msg: "Firewall lockdown rule creation is temporarily disabled — only cleaning up existing rules"

# ------------------------------------------------------------------
# Delete existing custom WAF allowlist rule if present
# ------------------------------------------------------------------
- name: "cis : get existing custom WAF rules"
  ansible.builtin.shell: |
    ibmcloud cis custom-waf rules {{ (_cis_domains_result.stdout | from_json)[0].id }} \
      -i "{{ cis_service_name }}" --output json
  register: _cis_custom_rules_result
  failed_when: false

- name: "cis : find existing custom WAF allowlist rule id"
  ansible.builtin.set_fact:
    _cis_waf_rule_id: >-
      {{ (_cis_custom_rules_result.stdout | from_json).get('rules', [])
         | selectattr('description', 'defined')
         | selectattr('description', 'equalto', 'mas-ip-allowlist-' ~ mas_instance_id)
         | map(attribute='id') | list | first | default('') }}
  when: _cis_custom_rules_result.rc == 0 and _cis_custom_rules_result.stdout | trim | length > 0

- name: "cis : set waf rule id to empty when no custom rules exist"
  ansible.builtin.set_fact:
    _cis_waf_rule_id: ""
  when: _cis_custom_rules_result.rc != 0 or _cis_custom_rules_result.stdout | trim | length == 0

- name: "cis : delete existing custom WAF allowlist rule"
  ansible.builtin.shell: |
    ibmcloud cis custom-waf rule-delete {{ (_cis_domains_result.stdout | from_json)[0].id }} \
      {{ _cis_waf_rule_id }} \
      -i "{{ cis_service_name }}" -f
  when: _cis_waf_rule_id | trim | length > 0

# ------------------------------------------------------------------
# Delete ALL existing lockdown rules for this instance
# ------------------------------------------------------------------
- name: "cis : get existing firewall lockdown rules"
  ansible.builtin.shell: |
    ibmcloud cis firewalls \
      -t lockdowns \
      -d {{ (_cis_domains_result.stdout | from_json)[0].id }} \
      -i "{{ cis_service_name }}" --output json
  register: _cis_lockdown_list_result
  failed_when: false

- name: "cis : build list of all existing lockdown rule ids for this instance"
  ansible.builtin.set_fact:
    _cis_lockdown_all_ids: >-
      {{ (_cis_lockdown_list_result.stdout | from_json)
         | selectattr('description', 'defined')
         | selectattr('description', 'equalto', 'mas-ip-allowlist-' ~ mas_instance_id)
         | map(attribute='id') | list }}
  when: _cis_lockdown_list_result.rc == 0 and _cis_lockdown_list_result.stdout | trim | length > 0

- name: "cis : set empty lockdown id list when none exist"
  ansible.builtin.set_fact:
    _cis_lockdown_all_ids: []
  when: _cis_lockdown_list_result.rc != 0 or _cis_lockdown_list_result.stdout | trim | length == 0

- name: "cis : show existing lockdown rule ids"
  ansible.builtin.debug:
    msg: "Existing lockdown rule ids for mas-ip-allowlist-{{ mas_instance_id }}: {{ _cis_lockdown_all_ids }}"

- name: "cis : delete all existing lockdown rules for this instance"
  ansible.builtin.shell: |
    ibmcloud cis firewall-delete {{ item }} \
      -t lockdowns \
      -d {{ (_cis_domains_result.stdout | from_json)[0].id }} \
      -i "{{ cis_service_name }}"
  loop: "{{ _cis_lockdown_all_ids }}"
  when: _cis_lockdown_all_ids | length > 0

- name: "cis : confirm all lockdown rules deleted"
  ansible.builtin.debug:
    msg: "Deleted {{ _cis_lockdown_all_ids | length }} lockdown rule(s) for instance {{ mas_instance_id }}"

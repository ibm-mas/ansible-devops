---
# CIS WAF Custom Rule — allow_list enforcement (replaces Firewall Lockdown)
# =============================================================================
# The legacy CIS Firewall Lockdown API is deprecated. This file implements the
# same allow-list enforcement using WAF Custom Rules (Ruleset Engine).
#
# When `allow_list` is non-empty, a WAF custom rule is created that BLOCKS any
# request to "*.{{ mas_domain }}" whose source IP is NOT in the allow list.
#
# When `allow_list` is empty or "[]", any existing WAF custom rule tagged with
# the description sentinel "mas-allow-list:{{ mas_domain }}" is deleted
# (cleanup / idempotency).
#
# Variables consumed:
#   allow_list       - JSON array string, e.g. '["203.0.113.10","10.0.0.0/16"]'
#                      (set via ALLOW_LIST env var; default "[]" in defaults/main.yaml)
#   mas_domain       - MAS instance domain, e.g. "inst1.ibmmasfvt.com"
#   cis_service_name - CIS instance name used in every `ibmcloud cis` call
#
# IBM Cloud CLI reference:
#   https://cloud.ibm.com/docs/cis?topic=cis-about-waf-custom-rules&interface=cli
#
# ibmcloud cis CLI must already be authenticated before this file is included
# (same requirement as cis_suitedns_basic.yml — login is performed before this file is included).
# =============================================================================

# 1. Parse allow_list and derive facts
# -----------------------------------------------------------------------------
- name: "cis : set allow_list facts (waf custom rule)"
  ansible.builtin.set_fact:
    _allow_list_entries: "{{ allow_list | from_json if (allow_list is string) else allow_list }}"
    _waf_rule_description: "mas-allow-list:{{ mas_domain }}"
    _waf_new_rule_id: ""

- name: "cis : debug allow_list configuration (waf custom rule)"
  ansible.builtin.debug:
    msg:
      - "Allow List ............... {{ _allow_list_entries }}"
      - "WAF Rule description ..... {{ _waf_rule_description }}"
      - "CIS Service Name ......... {{ cis_service_name }}"

# 2. Resolve the CIS zone ID for the parent zone of mas_domain
#    e.g. "inst1.ibmmasfvt.com" -> look up zone "ibmmasfvt.com"
# -----------------------------------------------------------------------------
- name: "cis : resolve zone ID for {{ mas_domain }} (waf custom rule)"
  ansible.builtin.shell: |
    parent_zone="{{ mas_domain | regex_replace('^[^.]+\\.', '') }}"
    ibmcloud cis domains \
      --instance "{{ cis_service_name }}" --output json \
      | jq -r --arg domain "${parent_zone}" '.[] | select(.name == $domain) | .id'
  register: _waf_zone_id_result
  changed_when: false

- name: "cis : fail if CIS zone ID could not be resolved (waf custom rule)"
  ansible.builtin.fail:
    msg: >-
      Could not resolve CIS zone ID for '{{ mas_domain | regex_replace('^[^.]+\\.', '') }}'.
      Ensure it is a registered zone in CIS instance '{{ cis_service_name }}'.
  when: _waf_zone_id_result.stdout | trim | length == 0

- name: "cis : set zone ID fact (waf custom rule)"
  ansible.builtin.set_fact:
    _waf_zone_id: "{{ _waf_zone_id_result.stdout | trim }}"

# 3. Find any existing WAF custom rule with the sentinel description
#    (idempotency / cleanup when allow_list is removed)
# -----------------------------------------------------------------------------
- name: "cis : list existing WAF custom rules for {{ mas_domain }}"
  ansible.builtin.shell: |
    ibmcloud cis custom-rules "{{ _waf_zone_id }}" \
      --instance "{{ cis_service_name }}" --output json \
      | jq -r --arg desc "{{ _waf_rule_description }}" \
        '.[] | select(.description == $desc) | .id' 2>/dev/null || true
  register: _waf_existing_ids_result
  changed_when: false
  failed_when: false

- name: "cis : delete stale WAF custom rule {{ item }}"
  ansible.builtin.shell: |
    ibmcloud cis custom-rule-delete "{{ _waf_zone_id }}" "{{ item }}" \
      --instance "{{ cis_service_name }}" -f
  loop: "{{ _waf_existing_ids_result.stdout_lines | select('match', '.+') | list }}"
  when: _waf_existing_ids_result.stdout | trim | length > 0

# 4. Create a new WAF custom rule when allow_list is non-empty
#
#    Ruleset Engine expression logic:
#      Match every request to the MAS domain (or any subdomain) whose source
#      IP is NOT in the allow list  ->  action: block
#
#    ip.src in {a b c} supports plain IPs and CIDR ranges natively.
# -----------------------------------------------------------------------------
- name: "cis : create WAF custom rule for {{ mas_domain }}"
  ansible.builtin.shell: |
    # Build a space-separated list of IPs/CIDRs for the Ruleset Engine expression.
    IP_LIST=$(echo '{{ allow_list }}' | jq -r '.[] | .' | tr '\n' ' ' | sed 's/ *$//')

    # Expression: block any request hitting the MAS domain that is NOT from an allowed IP.
    EXPRESSION="(http.host eq \"{{ mas_domain }}\" or http.host matches \".*\\.{{ mas_domain }}\") and not ip.src in {${IP_LIST}}"

    ibmcloud cis custom-rule-create "{{ _waf_zone_id }}" \
      --action block \
      --expression "${EXPRESSION}" \
      --description "{{ _waf_rule_description }}" \
      --enabled true \
      --instance "{{ cis_service_name }}" \
      --output json
  register: _waf_create_result
  when: _allow_list_entries | length > 0

# 5. Capture the new rule ID from creation output
# -----------------------------------------------------------------------------
- name: "cis : extract new WAF custom rule ID"
  ansible.builtin.set_fact:
    _waf_new_rule_id: >-
      {{ _waf_create_result.stdout
         | from_json
         | json_query('result.id')
         | default('') }}
  when: _allow_list_entries | length > 0

- name: "cis : fail if rule ID was not returned by create"
  ansible.builtin.fail:
    msg: >-
      WAF custom rule creation returned no rule ID.
      Raw output: {{ _waf_create_result.stdout }}
  when:
    - _allow_list_entries | length > 0
    - _waf_new_rule_id | trim | length == 0

# 6. Readiness probe — poll until the rule is active
# -----------------------------------------------------------------------------
- name: "cis : wait for WAF custom rule to become active"
  ansible.builtin.shell: |
    ibmcloud cis custom-rule "{{ _waf_zone_id }}" "{{ _waf_new_rule_id }}" \
      --instance "{{ cis_service_name }}" --output json \
      | jq -r '.result.enabled'
  register: _waf_rule_active_check
  until: _waf_rule_active_check.stdout | trim == "true"
  retries: "{{ cis_waf_probe_retries | default(10) | int }}"
  delay: "{{ cis_waf_probe_delay | default(30) | int }}"
  failed_when: _waf_rule_active_check.rc != 0
  changed_when: false
  when:
    - _allow_list_entries | length > 0
    - _waf_new_rule_id | trim | length > 0

- name: "cis : confirm WAF custom rule is active"
  ansible.builtin.debug:
    msg: "WAF custom rule {{ _waf_new_rule_id }} is active for {{ mas_domain }}"
  when:
    - _allow_list_entries | length > 0
    - _waf_new_rule_id | trim | length > 0

# 7. Persist provisioning status
# -----------------------------------------------------------------------------
- name: "cis : persist allowlist provisioning status"
  ansible.builtin.include_tasks: tasks/providers/cis/cis_waf_status_persist.yml

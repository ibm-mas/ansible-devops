---
# Write one allowlist feature status to MongoDB (never fails the play).
# Requires _cis_allowlist_status_base_args to be set by the caller.
# Skipped when devops_mongo_uri is not set.
- name: "cis : ip-allowlist — status update: {{ allowlist_status }}"
  when: devops_mongo_uri | length > 0
  ansible.builtin.shell: |
    mas-devops-feature-status-update status-update \
      {{ _cis_allowlist_status_base_args }} \
      --status {{ allowlist_status }} \
      --status-details '{"message": "{{ allowlist_status_message }}", "request_configuration": "{{ allowlist_status_request | default('') }}"}' {{ ('--deployment-end "' ~ allowlist_deployment_end ~ '"') if allowlist_deployment_end | default('') | length > 0 else '' }}
  failed_when: false
  register: _cis_status_result

- name: "cis : ip-allowlist — status update: {{ allowlist_status }} (result)"
  when: devops_mongo_uri | length > 0
  ansible.builtin.debug:
    var: _cis_status_result

---
# Run one CIS custom WAF rule call (with retries) and record the outcome.
- name: "cis : ip-allowlist — {{ allowlist_action }} WAF rule"
  ansible.builtin.shell: |
    EXPR='{{ _cis_allowlist_expression | default('') }}'
    ibmcloud cis custom-waf rule-{{ allowlist_action }} {{ _cis_domain_id }} {{ _cis_allowlist_rule_id }} \
      -i "{{ cis_service_name }}{{ '-INVALID-TEST' if (mas_instance_id == 'test19592' and allowlist_action in ['create', 'update']) else '' }}" \
      {{ '--force' if allowlist_action == 'delete' else ('--action block --match "$EXPR" --description "' ~ _cis_allowlist_rule_desc ~ '" --enabled true') }}
  register: _cis_rule_result
  retries: 5
  delay: 30
  until: _cis_rule_result.rc == 0
  failed_when: false

- name: "cis : ip-allowlist — capture deployment end timestamp ({{ allowlist_action }})"
  ansible.builtin.set_fact:
    _cis_allowlist_deployment_end: "{{ ansible_facts['date_time']['iso8601'] }}"
  when: _cis_rule_result.rc == 0

- name: "cis : ip-allowlist — capture failure ({{ allowlist_action }})"
  ansible.builtin.set_fact:
    _cis_error:
      rc: "{{ _cis_rule_result.rc }}"
      msg: "{{ ((_cis_rule_result.stdout_lines | default([])) + (_cis_rule_result.stderr_lines | default([]))) | join(' ') | replace(\"'\", '') }}"
  when: _cis_rule_result.rc != 0

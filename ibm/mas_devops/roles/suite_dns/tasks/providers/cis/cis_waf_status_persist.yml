---
- name: "cis status : compute allow_list hash"
  ansible.builtin.shell: |
    echo '{{ _allow_list_entries | sort | to_json }}' \
      | sha256sum | awk '{print "sha256:" $1}'
  register: _waf_allow_list_hash
  changed_when: false

- name: "cis status : set status facts"
  ansible.builtin.set_fact:
    _cis_status_block:
      provisioned: "{{ (_allow_list_entries | length) > 0 }}"
      rule_id: "{{ _waf_new_rule_id | default('') }}"
      zone_id: "{{ _waf_zone_id }}"
      mas_domain: "{{ mas_domain }}"
      allow_list_hash: "{{ _waf_allow_list_hash.stdout | trim }}"
      last_applied: "{{ ansible_date_time.iso8601 }}"
      applied_by: "suite_dns/cis"

- name: "cis status : debug status block"
  ansible.builtin.debug:
    var: _cis_status_block

- name: "cis status : resolve status file path"
  ansible.builtin.set_fact:
    _cis_status_file: >-
      {{
        gitops_params_file
        | default(output_dir + '/' + mas_instance_id + '-cis-allowlist-status.yaml')
      }}

- name: "cis status : write status file"
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by suite_dns/cis — do not edit manually.
      # Last written: {{ ansible_date_time.iso8601 }}
      cis_allowlist_status:
        provisioned: {{ _cis_status_block.provisioned | lower }}
        rule_id: "{{ _cis_status_block.rule_id }}"
        zone_id: "{{ _cis_status_block.zone_id }}"
        mas_domain: "{{ _cis_status_block.mas_domain }}"
        allow_list_hash: "{{ _cis_status_block.allow_list_hash }}"
        last_applied: "{{ _cis_status_block.last_applied }}"
        applied_by: "{{ _cis_status_block.applied_by }}"
    dest: "{{ _cis_status_file }}"
    mode: "0644"

---
- name: "Pause for 2 minutes before continuing..."
  pause:
    minutes: 2

- block:

    - name: "cis : Update CIS TLSv1.2 Cipher suites"
      ansible.builtin.shell: |
        ibmcloud cis domain-settings-update {{_cis_domain_id}} -i "{{cis_service_name}}" -f ciphers -v ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384
      register: _cis_tls_cipher_suites_result
      retries: 10
      delay: 60
      until: _cis_tls_cipher_suites_result.rc == 0 and '429' not in _cis_tls_cipher_suites_result.stderr

    - name: "cis : Output WAF rule disable result"
      debug:
        msg: CIS TLSv1.2 cipher suites updated {{_cis_tls_cipher_suites_result}}

    - name: "Pause for 2 minutes before continuing..."
      pause:
        minutes: 2

    - name: "cis : Update CIS always https"
      ansible.builtin.shell: |
        ibmcloud cis domain-settings-update {{_cis_domain_id}} -i "{{cis_service_name}}" -f always_use_https -v on
      register: _cis_enforce_https_result
      retries: 10
      delay: 60
      until: _cis_enforce_https_result.rc == 0 and '429' not in _cis_enforce_https_result.stderr

    - name: "cis : Output of update CIS always https"
      debug:
        msg: CIS enforce https {{_cis_enforce_https_result}}

    - name: "Pause for 2 minutes before continuing..."
      pause:
        minutes: 2

    - name: "cis : Update CIS https rewrites"
      ansible.builtin.shell: |
        ibmcloud cis domain-settings-update {{_cis_domain_id}} -i "{{cis_service_name}}" -f automatic_https_rewrites -v on
      register: _cis_https_rewrites_result
      retries: 10
      delay: 60
      until: _cis_https_rewrites_result.rc == 0 and '429' not in _cis_https_rewrites_result.stderr

    - name: "cis : Output CIS https rewrites"
      debug:
        msg: CIS enforce https {{_cis_https_rewrites_result}}

  rescue:

    - name: "cis : capture failure message (domain setting)"
      ansible.builtin.set_fact:
        _cis_domain_setting_error_msg: "{{ ansible_failed_result.msg | default(ansible_failed_task.name + ' failed') | replace(\"'\", '') }}"

    - name: "cis : status update: ERROR (domain setting)"
      ansible.builtin.shell: |
        mas-devops-feature-status-update status-update \
          {{ _cis_allowlist_status_base_args }} \
          --status ERROR \
          --status-details '{
            "message": "{{ _cis_domain_setting_error_msg }}",
            "error_code": 1,
            "error_source": {
              "gitops_version": "{{ lookup("env", "GITOPS_VERSION") | default("", true) }}",
              "filename": "cis_domain_setting.yml",
              "log_file": "oc logs -n mas-{{ mas_instance_id }}-syncres {{ lookup("env", "HOSTNAME") }}",
              "stacktrace": "{{ _cis_domain_setting_error_msg }}"
            },
            "request_configuration": "{{ _cis_normalised_ips | default([]) | join(", ") }}"
          }' \
          --deployment-end "{{ ansible_facts['date_time']['iso8601'] }}"
      when:
        - is_mas_mode
        - _cis_allowlist_status_base_args is defined
      failed_when: false

    - name: "cis : re-raise failure (domain setting)"
      ansible.builtin.fail:
        msg: "{{ _cis_domain_setting_error_msg }}"

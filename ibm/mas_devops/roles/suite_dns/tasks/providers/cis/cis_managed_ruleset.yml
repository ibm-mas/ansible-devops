---
- name: "cis: validate rule {{ item.rule_id }} exists"
  ansible.builtin.shell: |
    ibmcloud cis managed-waf ruleset {{ _cis_domain_id }} {{ item.ruleset_id }} \
    -i "{{ cis_service_name }}" --output json | jq -r --arg rule_id {{ item.rule_id }} '.rules[] | select(.id == $rule_id) | .id'
  failed_when: false
  register: _cis_rule_check

- name: "cis: Check if rule exists. "
  ansible.builtin.debug:
    msg: "cis: rule {{ item.rule_id }} does not exist. Skipping"
  when: _cis_rule_check.stdout | trim | length == 0
  failed_when: false

- name: "cis: disable rule {{ item.rule_id }}"
  ansible.builtin.shell: |
    ibmcloud cis managed-waf deployment-update-ruleset {{ _cis_domain_id }} {{ _cis_rule_id_result.stdout }} \
    --override-rules rule={{ item.rule_id }},action=block,enabled=false -i "{{ cis_service_name }}"
  register: _cis_ruleset_rule_disable_result
  failed_when: false
  when: _cis_rule_check.stdout | trim | length > 0

- name: "cis: extract disable result rc ({{ item.rule_id }})"
  ansible.builtin.set_fact:
    _cis_ruleset_rule_disable_rc: "{{ _cis_ruleset_rule_disable_result.rc | default(-1) | int }}"
    _cis_ruleset_rule_disable_msg: "{{ ((_cis_ruleset_rule_disable_result.stdout_lines | default([])) + (_cis_ruleset_rule_disable_result.stderr_lines | default([]))) | join(' ') | replace(\"'\", '') }}"
  when: _cis_ruleset_rule_disable_result is defined

- name: "cis: capture failure (managed ruleset disable: {{ item.rule_id }})"
  ansible.builtin.set_fact:
    _cis_error:
      rc: "{{ _cis_ruleset_rule_disable_rc }}"
      msg: "{{ _cis_ruleset_rule_disable_msg }}"
  when:
    - _cis_ruleset_rule_disable_rc is defined
    - _cis_ruleset_rule_disable_rc != 0

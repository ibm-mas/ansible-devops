---
# Setup PodMonitor and NetworkPolicy for Prometheus scraping in target namespace
# -----------------------------------------------------------------------------
- name: "Apply PodMonitor in {{ targetNamespace }}"
  kubernetes.core.k8s:
    apply: yes
    template: "templates/podmonitor.yml.j2"

- name: "Apply Prometheus NetworkPolicy in {{ targetNamespace }}"
  kubernetes.core.k8s:
    apply: yes
    template: "templates/networkpolicy-prometheus.yml.j2"

---
# create_gateways_per_namespace.yml
# Called once per MAS app namespace. Applies mesh networking resources and
# creates a Gateway + VirtualService + Route for each routeref ConfigMap found.
#
# Input variables:
#   ns_suffix   Namespace suffix (e.g. "manage", "core", "iot")
# Sets:
#   target_namespace  Fully-qualified namespace (mas-<instance>-<ns_suffix>)
# -----------------------------------------------------------------------------

# 1. Derive the fully-qualified target namespace
# -----------------------------------------------------------------------------
- name: "Set target_namespace for {{ ns_suffix }}"
  set_fact:
    target_namespace: "mas-{{ mas_instance }}-{{ ns_suffix }}"

# 2. Log resolved namespace context
# -----------------------------------------------------------------------------
- name: "Debug: namespace context for {{ target_namespace }}"
  debug:
    msg:
      - "Target namespace ..................... {{ target_namespace }}"
      - "Gateway namespace .................... {{ servicemesh_gateway_namespace }}"
      - "MAS domain ........................... {{ mas_domain }}"
      - "Gateway strategy ..................... {{ gateway_strategy }}"

# 3. Discover routeref ConfigMaps in this namespace
# -----------------------------------------------------------------------------
- name: "Fetch all ConfigMaps in {{ target_namespace }}"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: "{{ target_namespace }}"
  register: _all_configmaps

- name: "Filter routeref ConfigMaps in {{ target_namespace }}"
  set_fact:
    routeref_configmaps: "{{ _all_configmaps.resources |
                             selectattr('metadata.name', 'match', '^routeref-') |
                             list }}"

- name: "Debug: routeref ConfigMaps found in {{ target_namespace }}"
  debug:
    msg: "Found {{ routeref_configmaps | length }} routeref ConfigMap(s): \
          {{ routeref_configmaps | map(attribute='metadata.name') | list }}"

# 4. Apply mesh network policies and PodMonitor (always — not gated on routes)
# -----------------------------------------------------------------------------
- name: "Configure network policies and monitoring for {{ target_namespace }}"
  when: routeref_configmaps | length > 0
  include_tasks: "tasks/setup_namespace_monitoring.yml"

# 5. Create gateway resources for each routeref ConfigMap
# -----------------------------------------------------------------------------
- name: "Create gateways for {{ target_namespace }} using {{ gateway_strategy }} strategy"
  when: routeref_configmaps | length > 0
  include_tasks: "tasks/{{ gateway_strategy }}/create_gateways.yml"

---
# servicemesh_domain_config
# Configures Istio service mesh routing for a MAS instance on OpenShift.
# For each MAS application namespace it creates: a dedicated gateway namespace,
# mesh-wide observability, per-namespace network policies, and a Gateway +
# VirtualService + Route stack for every routeref ConfigMap it finds.
#
# Required variables:
#   mas_instance              MAS instance ID
#   mas_domain                MAS domain (auto-resolved from cluster if empty)
#   mas_app_id                Scope to one app namespace only (empty = all apps)
#   servicemesh_namespace     Istio control-plane namespace (default: istio-system)
#   servicemesh_gateway_namespace  Gateway namespace (default: mas-<instance>-servicemesh)
#   gateway_strategy          Gateway creation strategy (default: many_gateways)
# -----------------------------------------------------------------------------

# 1. Validate required properties
# -----------------------------------------------------------------------------
- name: "Fail if mas_instance is not provided"
  assert:
    that:
      - mas_instance is defined
      - mas_instance | length > 0
    fail_msg: "mas_instance property is required (set MAS_INSTANCE_ID)"

# 2. Resolve MAS domain from the cluster if not supplied
# -----------------------------------------------------------------------------
- name: "Resolve cluster subdomain"
  when: mas_domain == ""
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: _cluster_subdomain

- name: "Set mas_domain from cluster subdomain"
  when: mas_domain == ""
  set_fact:
    mas_domain: "{{ mas_instance }}.{{ _cluster_subdomain.resources[0].spec.domain }}"

# 3. Log resolved configuration
# -----------------------------------------------------------------------------
- name: "Debug: resolved configuration"
  debug:
    msg:
      - "MAS instance ......................... {{ mas_instance }}"
      - "MAS domain ........................... {{ mas_domain }}"
      - "Service mesh namespace ............... {{ servicemesh_namespace }}"
      - "Gateway namespace .................... {{ servicemesh_gateway_namespace }}"
      - "Target app ........................... {{ mas_app_id | default('(all)', true) }}"
      - "Gateway strategy ..................... {{ gateway_strategy }}"

# 4. Preflight: verify the Istio control plane exists and is ready
# -----------------------------------------------------------------------------
# The Istio resource (sailoperator.io/v1) is cluster-scoped, so it cannot be looked
# up "in" a namespace. List them all and keep only those whose spec.namespace (the
# namespace the control plane is deployed into) matches servicemesh_namespace.
# failed_when is disabled so that a missing Istio CRD (Service Mesh operator not
# installed) is reported by the assert below rather than as an opaque API error.
- name: "Look up Istio control planes"
  kubernetes.core.k8s_info:
    api_version: sailoperator.io/v1
    kind: Istio
  register: _istio_lookup
  failed_when: false

- name: "Select the Istio control plane deployed to {{ servicemesh_namespace }}"
  set_fact:
    _istio_control_planes: "{{ _istio_lookup.resources | default([]) | selectattr('spec', 'defined') | selectattr('spec.namespace', 'defined') | selectattr('spec.namespace', 'equalto', servicemesh_namespace) | list }}"

- name: "Fail if no Istio control plane is found for {{ servicemesh_namespace }}"
  assert:
    that:
      - _istio_control_planes | length > 0
    fail_msg: >-
      No Istio control plane found with spec.namespace '{{ servicemesh_namespace }}'
      (Istio resources found on the cluster: {{ _istio_lookup.resources | default([]) | map(attribute='spec.namespace', default='?') | list }}).
      Install Red Hat OpenShift Service Mesh first (role: ibm.mas_devops.servicemesh)
      or set SERVICEMESH_NAMESPACE to the namespace that contains your Istio instance.
      {{ ('Lookup error: ' ~ _istio_lookup.msg) if _istio_lookup.msg is defined else '' }}

- name: "Fail if the Istio control plane is not ready"
  assert:
    that:
      - _istio_control_planes
        | map(attribute='status.conditions', default=[])
        | flatten
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True')
        | list | length > 0
    fail_msg: >-
      Istio control plane for namespace '{{ servicemesh_namespace }}' is not Ready.
      Check 'oc get istio' before configuring MAS routing using servicemesh.

# 5. Create the dedicated gateway namespace with Istio injection labels
# -----------------------------------------------------------------------------
- name: "Create gateway namespace {{ servicemesh_gateway_namespace }}"
  kubernetes.core.k8s:
    apply: yes
    template: "{{ role_path }}/../../common_templates/namespace.yml.j2"
  vars:
    namespace_name: "{{ servicemesh_gateway_namespace }}"
    namespace_labels:
      istio-injection: enabled
      istio.io/rev: default
      istio-discovery: enabled

# 6. Apply mesh-wide observability resources (Telemetry, ServiceMonitor, Kiali RBAC)
# -----------------------------------------------------------------------------
- name: "Configure mesh-wide observability"
  include_tasks: "tasks/setup_mesh_observability.yml"

# 7. Apply per-namespace network policies and PodMonitor for the gateway namespace
# -----------------------------------------------------------------------------
- name: "Configure network policies and monitoring for gateway namespace"
  include_tasks: "tasks/setup_namespace_monitoring.yml"
  vars:
    target_namespace: "{{ servicemesh_gateway_namespace }}"

# 6a. Configure a single target app namespace (when mas_app_id is set)
# -----------------------------------------------------------------------------
- name: "Configure gateways for namespace: mas-{{ mas_instance }}-{{ mas_app_id }}"
  when: mas_app_id != ""
  include_tasks: "tasks/create_gateways_per_namespace.yml"
  vars:
    ns_suffix: "{{ mas_app_id }}"

# 6b. Configure all standard MAS app namespaces (when mas_app_id is not set)
# -----------------------------------------------------------------------------
- name: "Configure gateways for all MAS namespaces"
  when: mas_app_id == ""
  include_tasks: "tasks/create_gateways_per_namespace.yml"
  loop:
    - core
    - facilities
    - iot
    - manage
    - monitor
    - optimizer
    - predict
  loop_control:
    loop_var: ns_suffix
    label: "mas-{{ mas_instance }}-{{ ns_suffix }}"

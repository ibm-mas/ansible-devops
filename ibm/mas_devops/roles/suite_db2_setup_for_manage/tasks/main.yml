---
# Should should be part of the manage operator, but is not so we have to do it
# as a seperate step in the install flow for now :(

# 1. Provide debug information to the user
# -----------------------------------------------------------------------------
- name: "Check required properties are set"
  assert:
    that:
      - db2_namespace is defined and db2_namespace != ""
      - db2_instance_name is defined and db2_instance_name != ""
    fail_msg: "db2_namespace and db2_instance_name are both required properties"

- name: "Debug information - part 1"
  debug:
    msg:
      - "Db2 namespace .......................... {{ db2_namespace }}"
      - "Db2 instance name ...................... {{ db2_instance_name }}"
      - "Db2 database name ...................... {{ db2_dbname }}"


# 2. Determine which pod to run in
# -----------------------------------------------------------------------------
# TODO: We should do this locally, connecting to the Db2 instance using the route
# that we have created.  Execing into a container is considered bad practice in
# production environment, and we want this collection to be production friendly.
#
# However given that we want to get all of this moved into the manage operator
# ASAP, there is little point investing the effort to fix this in this collection,
# rather that effort should be put into migrating this code into the manage
# operator itself, so that this isn't even necessary!

- name: "Lookup db2 Pod"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ db2_namespace }}"
    label_selectors:
      - type=engine
      - app={{ db2_instance_name }}
    wait: yes
    wait_sleep: 30
    wait_timeout: 300 # 5 mins until we give up waiting for the pod to get into the expected state
    wait_condition:
      type: Ready
      status: "True"
  register: db2_pod

- name: Configure facts
  set_fact:
    db2_pod_name: "{{ db2_pod.resources[0].metadata.name }}"

- name: "Debug information - part 2"
  debug:
    msg:
      - "Pod name ............................... {{ db2_pod_name }}"


# 3. Prepare database for use with Maximo TPAE
# -----------------------------------------------------------------------------
- name: Create setupdb script in local /tmp
  ansible.builtin.template:
    src: setupdb.sh.j2
    dest: /tmp/setupdb.sh
    mode: '777'

- name: Copy the setupdb script into the db2u pod
  shell: "oc cp /tmp/setupdb.sh {{ db2_namespace }}/{{ db2_pod_name }}:/tmp/setupdb.sh -c db2u"
  register: copy_result
  retries: 10
  delay: 30 # seconds
  until: copy_result.rc == 0


# The log file will also be available inside the pod /tmp/setupdb.log
# The script will exit early if /tmp/setupdb_complete exists to avoid unnecessarily re-running
# the setup, however this file will be lost after pod restarts.
- name: Run setupdb to prepare Db2 for use with Maximo TPAE
  shell: |
    oc exec -n {{db2_namespace}} {{db2_pod_name}} -c db2u -- bash -l -c '/tmp/setupdb.sh | tee /tmp/setupdb.log'
  register: prepare_cmds_status
  ignore_errors: true
  retries: 10
  delay: 30 # seconds
  until:
    - prepare_cmds_status.rc == 0  ## Always going to be zero in this case, but let's check anyway.
    - prepare_cmds_status.stdout | regex_search('DBstatus-Success', multiline=True) | length > 0

- name: "Print setupdb.sh return code"
  when: prepare_cmds_status.rc is defined
  debug:
    msg:
      - "SetupDB return code (rc) .......................... {{ prepare_cmds_status.rc }}"
      - "SetupDB Registered Status  ........................ {{ prepare_cmds_status }}"

- name: "Database setup debug information"
  when: prepare_cmds_status.stdout is defined
  debug:
    msg:
      - "Result (stdout) ........................ {{ prepare_cmds_status.stdout }}"
      - "result (stderr) ........................ {{ prepare_cmds_status.stderr }}"

- name: Assert that manage tablespace or bufferpools are created
  assert:
    that:
      - prepare_cmds_status.rc is defined
      - prepare_cmds_status.rc == 0
      - prepare_cmds_status.stdout | regex_search('DBstatus-Success', multiline=True) | length > 0
    fail_msg: "setupdb.sh failed for Manage Maxinst -  tablespace or bufferpools may not have been created"
    success_msg: "Manage DB setup ran successfully"


# 4. Grant DB2 roles (temporary workaround for pre-release next-gen DB2U Helm chart)
# -----------------------------------------------------------------------------
# This is only needed when using the Helm-based DB2 operator
- name: Create grantroles script in local /tmp
  when: db2_use_helm_operator | default(false) | bool
  ansible.builtin.template:
    src: grantroles.sh.j2
    dest: /tmp/grantroles.sh
    mode: '777'

- name: Copy the grantroles script into the db2u pod
  when: db2_use_helm_operator | default(false) | bool
  shell: "oc cp /tmp/grantroles.sh {{ db2_namespace }}/{{ db2_pod_name }}:/tmp/grantroles.sh -c db2u"
  register: copy_grantroles_result
  retries: 10
  delay: 30 # seconds
  until: copy_grantroles_result.rc == 0

- name: Run grantroles to grant DB2 roles
  when: db2_use_helm_operator | default(false) | bool
  shell: |
    oc exec -n {{db2_namespace}} {{db2_pod_name}} -c db2u -- bash -l -c '/tmp/grantroles.sh | tee /tmp/grantroles.log'
  register: grantroles_status
  ignore_errors: true
  retries: 10
  delay: 30 # seconds
  until:
    - grantroles_status.rc == 0
    - grantroles_status.stdout | regex_search('DBstatus-Success', multiline=True) | length > 0

- name: "Print grantroles.sh return code"
  when:
    - db2_use_helm_operator | default(false) | bool
    - grantroles_status.rc is defined
  debug:
    msg:
      - "GrantRoles return code (rc) .......................... {{ grantroles_status.rc }}"
      - "GrantRoles Registered Status  ........................ {{ grantroles_status }}"

- name: "Role grants debug information"
  when:
    - db2_use_helm_operator | default(false) | bool
    - grantroles_status.stdout is defined
  debug:
    msg:
      - "Result (stdout) ........................ {{ grantroles_status.stdout }}"
      - "result (stderr) ........................ {{ grantroles_status.stderr }}"

- name: Assert that DB2 roles were granted successfully
  when: db2_use_helm_operator | default(false) | bool
  assert:
    that:
      - grantroles_status.rc is defined
      - grantroles_status.rc == 0
      - grantroles_status.stdout | regex_search('DBstatus-Success', multiline=True) | length > 0
    fail_msg: "grantroles.sh failed - DB2 roles may not have been granted"
    success_msg: "DB2 roles granted successfully"


# 5. Set up WLM service classes per tenant
# Only applies when using the Helm-based DB2 operator with a Db2uInstance CR
# -----------------------------------------------------------------------------
- name: "WLM - Detect Db2 CR type"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
  include_tasks: "{{ role_path }}/../../common_tasks/detect_db2_cr_type.yml"

- name: "WLM - Skip: not applicable for this configuration"
  when: >-
    not (db2_use_helm_operator | default(false) | bool)
    or not (db2_wlm_enabled | default(false) | bool)
    or (db2_cr_type | default('') != 'Db2uInstance')
  debug:
    msg: >-
      Skipping WLM setup.
      db2_use_helm_operator={{ db2_use_helm_operator | default(false) }},
      db2_wlm_enabled={{ db2_wlm_enabled | default(false) }},
      db2_cr_type={{ db2_cr_type | default('not detected') }}.
      WLM requires helm operator=true and CR type=Db2uInstance.

- name: "WLM - Read tenant IDs from tenantgroup-ids ConfigMap"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: tenantgroup-ids
    namespace: "{{ db2_wlm_namespace | default(db2_namespace) }}"
  register: _wlm_tenantgroup_ids_cm

- name: "WLM - Fail if tenantgroup-ids ConfigMap not found"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - _wlm_tenantgroup_ids_cm.resources | default([]) | length == 0
  fail:
    msg: >-
      ConfigMap 'tenantgroup-ids' not found in namespace
      '{{ db2_wlm_namespace | default(db2_namespace) }}'.
      Set db2_wlm_namespace if the ConfigMap lives in a different namespace.

- name: "WLM - Extract tenant IDs from ConfigMap"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - _wlm_tenantgroup_ids_cm.resources | default([]) | length > 0
  set_fact:
    db2_tenant_ids: >-
      {{
        (_wlm_tenantgroup_ids_cm.resources[0].data['id-json'] | from_json).tenantIds.values() | list
      }}

- name: "WLM - Debug tenant discovery"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
  debug:
    msg:
      - "ConfigMap namespace .................... {{ db2_wlm_namespace | default(db2_namespace) }}"
      - "Discovered tenant IDs .................. {{ db2_tenant_ids | default([]) }}"
      - "WLM max concurrent activities .......... {{ db2_wlm_max_concurrent | default(10) }}"

- name: "WLM - Create setupwlm script in local /tmp"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - db2_tenant_ids | default([]) | length > 0
  ansible.builtin.template:
    src: setupwlm.sh.j2
    dest: /tmp/setupwlm.sh
    mode: '700'

- name: "WLM - Copy setupwlm script into the db2u pod"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - db2_tenant_ids | default([]) | length > 0
  shell: "oc cp /tmp/setupwlm.sh {{ db2_namespace }}/{{ db2_pod_name }}:/tmp/setupwlm.sh -c db2u"
  register: copy_wlm_result
  retries: 10
  delay: 30
  until: copy_wlm_result.rc == 0

- name: "WLM - Run setupwlm to configure WLM service classes"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - db2_tenant_ids | default([]) | length > 0
  shell: |
    oc exec -n {{ db2_namespace }} {{ db2_pod_name }} -c db2u -- bash -l -c '/tmp/setupwlm.sh | tee /tmp/setupwlm.log'
  register: wlm_status
  ignore_errors: true
  retries: 3
  delay: 30
  until:
    - wlm_status.rc == 0
    - wlm_status.stdout | regex_search('WLMSetup-Success', multiline=True) | length > 0

- name: "WLM - Debug output"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - wlm_status is defined
    - wlm_status.stdout is defined
  debug:
    msg:
      - "Result (stdout) ........................ {{ wlm_status.stdout }}"
      - "Result (stderr) ........................ {{ wlm_status.stderr }}"

- name: "WLM - Assert WLM setup completed successfully"
  when:
    - db2_use_helm_operator | default(false) | bool
    - db2_wlm_enabled | default(false) | bool
    - db2_cr_type | default('') == 'Db2uInstance'
    - db2_tenant_ids | default([]) | length > 0
  assert:
    that:
      - wlm_status.rc is defined
      - wlm_status.rc == 0
      - wlm_status.stdout | regex_search('WLMSetup-Success', multiline=True) | length > 0
    fail_msg: "setupwlm.sh failed - WLM service classes may not have been created for all tenants"
    success_msg: "WLM service classes configured successfully for tenants: {{ db2_tenant_ids }}"

# 6. Execute DB2 config enforcement
# -----------------------------------------------------------------------------
- include_tasks: tasks/db2_dbconfig.yml

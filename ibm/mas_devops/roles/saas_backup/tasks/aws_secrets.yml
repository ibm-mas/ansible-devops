---
# Collect explicitly listed AWS Secrets Manager secrets into the staging directory.
# Only the exact secret IDs in SAAS_BACKUP_AWS_SECRET_IDS are read. The AWS credentials used by the aws CLI come
# from the ambient environment and are never written anywhere. Secret values are never logged.
# -----------------------------------------------------------------------------
- name: "AWS secrets: read cluster-params.yaml secrets configuration"
  ansible.builtin.set_fact:
    _sb_aws_cfg: "{{ _sb_cluster_params.secrets | default({}) }}"

- name: "AWS secrets: fail if the cluster does not use AWS Secrets Manager"
  ansible.builtin.assert:
    quiet: true
    that:
      - _sb_aws_cfg.avp_type | default('') == 'aws'
      - _sb_aws_cfg.avp_aws_secret_region | default('') | length > 0
    fail_msg: >-
      SAAS_BACKUP_AWS_SECRET_IDS was set but saas-envs cluster-params.yaml for this cluster does not declare
      secrets.avp_type: aws with secrets.avp_aws_secret_region, so the secrets region cannot be determined.

- name: "AWS secrets: check the aws CLI is available"
  ansible.builtin.command:
    argv: [aws, --version]
  register: _sb_aws_cli
  changed_when: false
  failed_when: false

- name: "AWS secrets: fail if the aws CLI is not available"
  ansible.builtin.fail:
    msg: "The aws CLI is required to collect SAAS_BACKUP_AWS_SECRET_IDS but 'aws --version' failed"
  when: _sb_aws_cli.rc != 0

- name: "AWS secrets: create the secrets directory"
  ansible.builtin.file:
    path: "{{ _sb_staging }}/aws-secrets"
    state: directory
    mode: "0700"

- name: "AWS secrets: fetch secret values (no_log)"
  ansible.builtin.command:
    argv:
      - aws
      - secretsmanager
      - get-secret-value
      - --secret-id
      - "{{ item }}"
      - --region
      - "{{ _sb_aws_cfg.avp_aws_secret_region }}"
      - --query
      - SecretString
      - --output
      - text
  loop: "{{ _sb_aws_secret_ids }}"
  loop_control:
    index_var: _sb_aws_idx
    label: "{{ item }}"
  register: _sb_aws_fetch
  changed_when: false
  failed_when: false
  no_log: true

# Loop items are echoed in task output, so only a projection without secret values is ever looped over in clear
- name: "AWS secrets: summarise fetch results (no secret values)"
  ansible.builtin.set_fact:
    _sb_aws_status: >-
      {{ _sb_aws_status | default([]) + [{
           'id': item.item,
           'rc': item.rc | default(1),
           'has_value': (item.stdout | default('') | trim | length) > 0,
           'error': (item.stderr | default(item.msg | default('unknown error')) | truncate(300))
         }] }}
  loop: "{{ _sb_aws_fetch.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: "AWS secrets: fail if any secret could not be read"
  ansible.builtin.fail:
    msg: >-
      Unable to read AWS secret '{{ item.id }}' in region {{ _sb_aws_cfg.avp_aws_secret_region }}
      (rc={{ item.rc }}, value {{ 'present' if item.has_value else 'empty' }}): {{ item.error }}
  loop: "{{ _sb_aws_status }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.rc != 0 or not item.has_value

- name: "AWS secrets: write secret values (no_log)"
  ansible.builtin.copy:
    dest: "{{ _sb_staging }}/aws-secrets/{{ '%02d' | format(idx) }}-{{ item.item | regex_replace('[^A-Za-z0-9._-]', '_') }}.secret"
    content: "{{ item.stdout }}"
    mode: "0600"
  vars:
    idx: "{{ ansible_loop.index0 }}"
  loop: "{{ _sb_aws_fetch.results }}"
  loop_control:
    label: "{{ item.item }}"
    extended: true
  no_log: true

- name: "AWS secrets: record collected secret IDs (never values)"
  ansible.builtin.set_fact:
    _sb_aws_collected:
      region: "{{ _sb_aws_cfg.avp_aws_secret_region }}"
      secret_ids: "{{ _sb_aws_secret_ids }}"
      files: "{{ _sb_aws_secret_ids | map('regex_replace', '[^A-Za-z0-9._-]', '_') | list }}"

[tool.black]
line-length = 160

[tool.ruff]
line-length = 160
# requires_ansible >= 2.20.0 implies Python >= 3.11 on the controller; 3.10 is
# the conservative floor for the pyupgrade (UP) rule suggestions we accept.
target-version = "py310"

[tool.ruff.lint]
# flake8/pycodestyle/pyflakes (F, E, W) + flake8-bugbear (B) + pylint error
# class (PLE) + pyupgrade (UP) + isort (I), replacing the unused .flake8 config.
select = ["F", "E", "W", "B", "PLE", "UP", "I"]
ignore = [
    # Imports below the module docstring/ANSIBLE_METADATA are idiomatic in
    # Ansible module and action plugin files.
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections.ibm.mas_devops"]

[project]
name = "ansible-devops"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-mock>=3.11.1", "pytest-asyncio>=0.21.0",
    "responses>=0.23.0", "freezegun>=1.2.2", "ansible>=2.9.0", "kubernetes>=12.0.0",
    "setuptools>=65.0.0", "mas-devops>=5.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mas-devops = { path = "../python-devops", editable = true }
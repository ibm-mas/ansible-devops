apiVersion: apps.mas.ibm.com/v1
kind: ManageWorkspace
metadata:
  finalizers:
  - manageworkspace.apps.mas.ibm.com/finalizer
  labels:
    mas.ibm.com/applicationId: manage
    mas.ibm.com/instanceId: inst01
    mas.ibm.com/workspaceId: main
  name: inst01-main
  namespace: mas-inst01-manage
spec:
  bindings:
    jdbc: workspace-application
  components:
    base:
      customizationArchive:
        customizationArchiveUrl: https://mas-logging-inst01-noble8.s3.us-east-2.amazonaws.com/customizations/manage-lafix.zip
        useS3:
          accessKey: AKIAWKXUCZ553TBAKOVO
          region: us-east-2
          s3Credentials:
            secretName: custom-s3-credentials
      version: latest
    collaborate:
      version: latest
  settings:
    db:
      dbSchema: maximo
      encryptionSecret: main-manage-encryption-secret
      maxinst:
        bypassUpgradeVersionCheck: false
        db2Vargraphic: true
        demodata: false
        indexSpace: MAXINDEX
        tableSpace: MAXDATA
      upgrade:
        upgradeType: regularUpgrade
    deployment:
      buildTag: latest
      defaultJMS: true
      developmentMode: 0
      ephemeralVolumes: []
      loggingS3Destination:
        accessKey: AKIAWKXUCZ553TBAKOVO
        bucketName: mas-logging-inst01-noble8
        endpointURL: https://s3.us-east-2.amazonaws.com
        secretKey:
          secretName: cos-logging
      mode: up
      patchMode: 0
      persistentVolumes:
      - accessModes:
        - ReadWriteMany
        mountPath: /jmsstore
        pvcName: mas-inst01-jmsserver-pvc
        size: 25Gi
        storageClassName: nfs-client
      serverBundles:
      - additionalServerConfig:
          secretName: main-manage-d--sb0--asc--sn
        bundleType: standalonejms
        isDefault: false
        isMobileTarget: false
        name: jmsserver
        replica: 1
        routeSubDomain: jmsserver
      - additionalServerConfig:
          secretName: main-manage-d--sb1--asc--sn
        bundleLevelProperties: |-
          mxe.doclink.path01=cos:doclinks=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maximo/oslc/cosdoclinks
          mxe.doclink.doctypes.defpath=cos:doclinks/default
          mxe.doclink.doctypes.topLevelPaths=cos:doclinks
          mxe.doclink.securedAttachment=true
          mxe.int.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/meaweb
          mxe.oslc.restwebappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest/oslc
          mxe.oslc.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maximo/oslc
          mxe.rest.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest
          mxe.attachmentstorage=com.ibm.tivoli.maximo.oslc.provider.COSAttachmentStorage
          mxe.rest.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest
          mxe.cosendpointuri=a
          mxe.cosbucketname=a
          mxe.cosaccesskey=a
          mxe.cossecretkey=a
          mxe.plg.endpoint=MASPLG
        bundleType: all
        isDefault: true
        isMobileTarget: true
        name: default
        replica: 2
        routeSubDomain: bundle1
      serverTimezone: GMT
    languages:
      baseLang: EN
      secondaryLangs: []

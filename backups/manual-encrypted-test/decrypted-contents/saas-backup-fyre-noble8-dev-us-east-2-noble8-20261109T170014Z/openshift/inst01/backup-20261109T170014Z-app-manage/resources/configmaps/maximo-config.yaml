apiVersion: v1
data:
  delServerSession: delete from serversession
  isNewMaximo: select 1 from maxvars
  validatedb: 'true'
  validatefoundation: varname = 'MAXFOUNDUPG' and (varvalue like 'V9%')
  validateqry: varname = 'MAXUPG' and (varvalue like 'V761%' or varvalue like 'V76010%'
    or varvalue like 'V8%' or varvalue like 'V9%')
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: inst01
    app.kubernetes.io/managed-by: ibm-mas-manage
    app.kubernetes.io/name: ibm-mas-manage
  name: maximo-config
  namespace: mas-inst01-manage

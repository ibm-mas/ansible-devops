apiVersion: v1
data:
  config.json: |
    {
      "initialDelay": 30,
      "numThreads": 1,
      "retryCount": 999999999,
      "retrySleepTime": 60,
      "thisServer": "/members/thisserver",
      "isJSONFileCreation": false,
      "jsonPath": "/monitoringJSON",
      "jsonFileExtension": ".json",
      "jsonFileNameSeparator": "@@@",
      "jsonFileCount": 2,
      "automationBuildSleepTime": 0,
      "automationBuildScriptFile": "",
      "appsToMonitor": "manage",
      "mmiurl": {
        "dbtablesize": {
          "endpoint": "/members/thisserver/tablesize",
          "className": "com.ibm.monitoring.agent.metrics.DBTableSizeMetrics",
          "delayTime": 14400,
          "metrics": {
            "mas_manage_db_top5tablesize_bytes": {
              "helpText": "Top 5 database table size on instance",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        },
        "pingdb": {
          "endpoint": "/members/thisserver/pingdb",
          "className": "com.ibm.monitoring.agent.metrics.PingDBMetrics",
          "delayTime": 60,
          "metrics": {
            "mas_manage_pingdb_totaltime_seconds": {
              "helpText": "Total time for the DB Connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            },
            "mas_manage_pingdb_availability" : {
              "helpText": "Status for the DB2 connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        },
        "reportcount": {
          "endpoint": "/members/thisserver/report",
          "className": "com.ibm.monitoring.agent.metrics.ReportMetrics",
          "delayTime": 3600,
          "metrics": {
            "mas_manage_report_total": {
              "helpText": "Count of the number of reports run",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        },
        "reportruntime": {
          "endpoint": "/members/thisserver/report",
          "className": "com.ibm.monitoring.agent.metrics.ReportMetrics",
          "delayTime": 14400,
          "metrics": {
            "mas_manage_report_runtime_seconds_total" : {
              "helpText": "Total accumulated report run time",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        },
        "pingcos": {
          "endpoint": "/members/thisserver/pingcos",
          "className": "com.ibm.monitoring.agent.metrics.PingCOSMetrics",
          "delayTime": 60,
          "metrics": {
            "mas_manage_pingcos_totaltime_seconds": {
              "helpText": "Total time for the COS Connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            },
            "mas_manage_pingcos_availability" : {
              "helpText": "Status for the COS connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        },
        "pingkafka": {
          "endpoint": "/members/thisserver/pingkafka",
          "className": "com.ibm.monitoring.agent.metrics.PingKafkaMetrics",
          "delayTime": 60,
          "metrics": {
            "mas_manage_pingkafka_totaltime_seconds": {
              "helpText": "Total time for the Kafka Connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            },
            "mas_manage_pingkafka_availability" : {
              "helpText": "Status for the Kafka connectivity",
              "labelNames": ["masappid","masworkspaceid","masinstanceid"]
            }
          }
        }
      }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: inst01
    app.kubernetes.io/managed-by: ibm-mas-manage
    app.kubernetes.io/name: ibm-mas-manage
  name: inst01-main-instance-monitor-cfg
  namespace: mas-inst01-manage

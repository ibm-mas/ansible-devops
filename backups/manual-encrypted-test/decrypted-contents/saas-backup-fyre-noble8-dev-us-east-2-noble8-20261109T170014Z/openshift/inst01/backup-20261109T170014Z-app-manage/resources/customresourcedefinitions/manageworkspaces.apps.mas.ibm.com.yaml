                            <non-end-item-select-oracle> select a.assetid, a.siteid,
                            coalesce((select max(updatedtime) from plusaanbdistatus
                            where assetid = a.assetid and siteid = a.siteid and inactivetime
                            is null and currentconfig = 1), (sysdate-365)), a.tenantid
                            from asset a where not exists (select 1 from synonymdomain
                            where value=a.status and maxvalue in ('DECOMMISSIONED',
                            'NOT READY') and domainid='LOCASSETSTATUS') and a.moved
                            = 0 and a.plusacatid is not null and a.parent is null
                            and a.plusamodelid is null order by 3 asc </non-end-item-select-oracle>
                            <non-end-item-select-db2> select a.assetid, a.siteid,
                            coalesce((select max(updatedtime) from plusaanbdistatus
                            where assetid = a.assetid and siteid = a.siteid and inactivetime
                            is null and currentconfig = 1), (current timestamp - 1
                            year)), a.tenantid from asset a where not exists (select
                            1 from synonymdomain where value=a.status and maxvalue
                            in ('DECOMMISSIONED', 'NOT READY') and domainid='LOCASSETSTATUS')
                            and a.moved = 0 and a.plusacatid is not null and a.parent
                            is null and a.plusamodelid is null order by 3 asc </non-end-item-select-db2>
                            <non-end-item-select-sqlserver> select a.assetid, a.siteid,
                            coalesce((select max(updatedtime) from plusaanbdistatus
                            where assetid = a.assetid and siteid = a.siteid and inactivetime
                            is null and currentconfig = 1), (getDate()-365)), a.tenantid
                            from asset a where not exists (select 1 from synonymdomain
                            where value=a.status and maxvalue in ('DECOMMISSIONED',
                            'NOT READY') and domainid='LOCASSETSTATUS') and a.moved
                            = 0 and a.plusacatid is not null and a.parent is null
                            and a.plusamodelid is null order by 3 asc </non-end-item-select-sqlserver>
                            <service-monitor-select> select a.plusaantranid, a.rowstamp,
                            a.assetid, a.siteid, a.checkmode, a.tenantid from plusaantran
                            a where a.priority > 0 and exists (select 1 from synonymdomain
                            sd where sd.domainid='PLUSAANTRANSTATUS' and sd.maxvalue='PENDING'
                            and sd.value=a.status) order by a.plusaantranid </service-monitor-select>
                            <cache-select> select a.assetuid, a.assetid, a.siteid,
                            a.tenantid from asset a where a.plusacatid is not null
                            order by a.assetuid </cache-select> <masterpm-select>
                            select %%1 from masterpm mpm where mpm.plusaintaction
                            is not null and mpm.plusastatus in (select sd.value from
                            synonymdomain sd where sd.domainid = 'PLUSAMASTERPMSTAT'
                            and sd.maxvalue = 'ACTIVE') </masterpm-select> </bdi-select>
                          description: XML string which controls which assets are

                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_heapmemory_used_total": {
                        "helpText": "Count of session stats created on Liberty",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"

                "endpoint": "/members/thisserver/apimetrics",
                "metrics": {
                    "health_histogram_metrics": {
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid"
                        ]
                    }
                }
            },
            "mbocount": {
                "className": "com.ibm.monitoring.agent.metrics.MboCountMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/mbocount",
                "metrics": {
                    "mas_manage_mbo_total": {
                        "helpText": "Count of session stats created on Liberty",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "tenant"
                        ]
                    },
                    "mas_manage_mboset_total": {
                        "helpText": "Count of session stats created on Liberty",
                        "labelNames": [

apiVersion: v1
data:
  config.json: |
    {
        "appsToMonitor": "maximo",
        "automationBuildScriptFile": "",
        "automationBuildSleepTime": 0,
        "initialDelay": 30,
        "isJSONFileCreation": false,
        "jsonFileCount": 2,
        "jsonFileExtension": ".json",
        "jsonFileNameSeparator": "@@@",
        "jsonPath": "/monitoringJSON",
        "mmiurl": {
            "cronthreadmetrics": {
                "className": "com.ibm.monitoring.agent.metrics.CronThreadMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/cronthread",
                "metrics": {
                    "mas_manage_cronthread_peak_total": {
                        "helpText": "Peak count of crontask thread",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_cronthread_total": {
                        "helpText": "Count of crontask thread",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },
            "dbinfo": {
                "className": "com.ibm.monitoring.agent.metrics.DBInfoMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/dbinfo/dbmanager",
                "metrics": {
                    "mas_manage_db_connection_total": {
                        "helpText": "Total of DB Connections",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_db_connectionfree_total": {
                        "helpText": "Free number of DB Connections",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_db_connectionused_total": {
                        "helpText": "Used number of DB Connections",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },
            "errcountmetrics": {
                "className": "com.ibm.monitoring.agent.metrics.ErrorCountMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/errcountmetrics",
                "metrics": {
                    "mas_manage_applicationexception_total": {
                        "helpText": "Total count of MXApplicationException created",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_systemexception_total": {
                        "helpText": "Total count of MXSystemException created",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },

                "className": "com.ibm.monitoring.agent.metrics.ServletStatsMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/servletstats",
                "metrics": {
                    "mas_manage_oslcservlet_responsetime_seconds": {
                        "helpText": "Average oslc servlet response time per minute",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    },
                    "mas_manage_oslcservlet_total": {
                        "helpText": "Count of oslc servlet calls on this server",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    },
                    "mas_manage_restservlet_responsetime_seconds": {
                        "helpText": "Average REST servlet response time per minute",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    },
                    "mas_manage_restservlet_total": {
                        "helpText": "Count of REST servlet calls on this server",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    },
                    "mas_manage_uiservlet_responsetime_seconds": {
                        "helpText": "Average servlet response time per minute",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    },
                    "mas_manage_uiservlet_total": {
                        "helpText": "Count of servlet calls on this server",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server",
                            "bundle"
                        ]
                    }
                }
            },

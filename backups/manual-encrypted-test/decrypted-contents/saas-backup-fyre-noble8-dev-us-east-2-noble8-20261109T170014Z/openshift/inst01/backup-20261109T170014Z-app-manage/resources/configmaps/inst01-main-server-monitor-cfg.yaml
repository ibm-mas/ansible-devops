                "className": "com.ibm.monitoring.agent.metrics.SessionStatsMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/sessionstatsinfo",
                "metrics": {
                    "mas_manage_sessionstats_active_total": {
                        "helpText": "Count of active sessions",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_sessionstats_create_total": {
                        "helpText": "Count of session stats created on Liberty",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_sessionstats_live_total": {
                        "helpText": "Count of live sesions",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },
            "thisserver": {
                "className": "com.ibm.monitoring.agent.metrics.ThisServerMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver",
                "metrics": {
                    "mas_manage_concurrentuser_total": {
                        "helpText": "Total concurrent users",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },
            "threadmetrics": {
                "className": "com.ibm.monitoring.agent.metrics.ThreadMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/threads",
                "metrics": {
                    "mas_manage_thread_deadlock_total": {
                        "helpText": "Count of deadlocked threads",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_thread_peak_total": {
                        "helpText": "Count of peak concurrent active threads",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_thread_total": {
                        "helpText": "Count of concurrent active threads",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            },
            "threadpool": {
                "className": "com.ibm.monitoring.agent.metrics.ThreadPoolMetrics",
                "delayTime": 60,
                "endpoint": "/members/thisserver/threadpoolinfo",
                "metrics": {
                    "mas_manage_threadpool_active_total": {
                        "helpText": "Count of active sessions",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    },
                    "mas_manage_threadpool_size_total": {
                        "helpText": "Count of session stats created on Liberty",
                        "labelNames": [
                            "masappid",
                            "masworkspaceid",
                            "masinstanceid",
                            "server"
                        ]
                    }
                }
            }
        },
        "numThreads": 1,
        "retryCount": 999999999,
        "retrySleepTime": 60,
        "thisServer": "/members/thisserver"
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: inst01
    app.kubernetes.io/managed-by: ibm-mas-manage
    app.kubernetes.io/name: ibm-mas-manage
  name: inst01-main-server-monitor-cfg

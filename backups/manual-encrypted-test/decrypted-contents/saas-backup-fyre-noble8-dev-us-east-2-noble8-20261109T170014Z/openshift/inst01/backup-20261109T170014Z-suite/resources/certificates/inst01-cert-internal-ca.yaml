apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/instance: inst01
    app.kubernetes.io/managed-by: ibm-mas
    app.kubernetes.io/name: ibm-mas
    mas.ibm.com/instanceId: inst01
  name: inst01-cert-internal-ca
  namespace: cert-manager
spec:
  commonName: internal.inst01.mas.ibm.com
  duration: 175200h0m0s
  isCA: true
  issuerRef:
    kind: Issuer
    name: mas-inst01-core-internal-ca-issuer
  renewBefore: 2160h0m0s
  secretName: inst01-cert-internal-ca
  subject:
    countries:
    - GB
    localities:
    - London
    organizationalUnits:
    - IBM Maximo Application Suite (Internal)
    streetAddresses:
    - London
  usages:
  - cert sign

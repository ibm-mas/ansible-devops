apiVersion: v1
data:
  applicationSettings.yaml: |
    # Supported Attributes:
    # id: 'predict' <'Offering ID'>
    # supportedReleases: <array with all available releases>
    #   - release: "8.0" <specific release version>
    #     userSync: False <whether the offering has a user sync agent>
    #     groupSync: False <whether the offering has a group sync agent>
    #     workspaceSync: True <whether the offering has an workspace sync agent>
    #     sync_timeout: 10 <workspace synchronization timeout>
    #     entrypoint: '/maximo' <Path for the navigation URL used by profile api>
    #     (optional) entrypointPrefix: 'health' <Prefix to replace offering name from the offering navigation URL>
    #     (optional) enforceUserMembership: 'health' <if set, the user will be automatically set as a member of the offering set here>
    #     (optional) enforceUserRemoval: 'predict' <if set, when removing the user, it will also be removed from the ofering set here>

    # Important: versions should always be written as a string ("1.0", not 1.0)

    # IoT
    # -----------------------------------------------------------------------------
    iot:
      id: iot
      supportedReleases:
        - release: "9.1"
          userSync: True
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/ibmssologin'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: False
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/ibmssologin'
          routingModes: ["subdomain"]

    # Health
    # -----------------------------------------------------------------------------
    health:
      id: health
      supportedReleases:
        - release: "9.1"
          userSync: True
          groupSync: True
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/relengineer'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: True
          groupSync: True
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/relengineer'
          routingModes: ["subdomain" , "path"]

    # Manage
    # -----------------------------------------------------------------------------
    manage:
      id: manage
      supportedReleases:
        - release: "9.1"
          userSync: True
          groupSync: True
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/manage-shell'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: True
          groupSync: True
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/manage-shell'
          routingModes: ["subdomain","path"]

    # Monitor
    # -----------------------------------------------------------------------------
    monitor:
      id: monitor
      supportedReleases:
        - release: "9.1"
          userSync: False
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: False
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain","path"]

    # Predict
    # -----------------------------------------------------------------------------
    predict:
      id: predict
      supportedReleases:
        - release: "9.1"
          userSync: False
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/relengineer'
          entrypointPrefix: 'health'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: False
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/maximo/oslc/graphite/relengineer'
          entrypointPrefix: 'health'
          routingModes: ["subdomain","path"]

    # Facilities
    # -----------------------------------------------------------------------------
    facilities:
      id: facilities
      supportedReleases:
        - release: "9.1"
          userSync: True
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: True
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain","path"]

    # Visual Inspection
    # -----------------------------------------------------------------------------
    visualinspection:
      id: visualinspection
      supportedReleases:
        - release: "9.1"
          userSync: False
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: False
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain","path"]

    # Assist
    # -----------------------------------------------------------------------------
    assist:
      id: assist
      supportedReleases:
        - release: "9.0"
          userSync: True
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain"]
        - release: "9.1"
          userSync: False
          groupSync: False
          workspaceSync: True
          sync_timeout: 10
          entrypoint: '/'
          routingModes: ["subdomain"]

    # Optimizer
    # -----------------------------------------------------------------------------
    optimizer:
      id: optimizer
      supportedReleases:
        - release: "9.1"
          userSync: False
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/jobs'
          routingModes: ["subdomain"]
        - release: "9.2"
          userSync: False
          groupSync: False
          workspaceSync: False
          sync_timeout: 10
          entrypoint: '/jobs'
          routingModes: ["subdomain", "path"]
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: inst01
    app.kubernetes.io/managed-by: ibm-mas
    app.kubernetes.io/name: ibm-mas
    mas.ibm.com/instanceId: inst01
  name: inst01-settings-applications
  namespace: mas-inst01-core

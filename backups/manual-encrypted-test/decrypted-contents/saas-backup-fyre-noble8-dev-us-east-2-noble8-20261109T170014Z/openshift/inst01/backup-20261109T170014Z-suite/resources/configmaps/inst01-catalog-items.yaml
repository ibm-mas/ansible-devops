    \        features:\n        - title: Technical features\n          description:\
    \ Maximo NXT is an AI-driven accelerator designed to streamline Maximo Application\
    \ Suite upgrades by modernizing legacy Java customizations. Using AI-powered virtual\
    \ assistants, the solution converts existing Java code into Python-based automation\
    \ scripts, while also supporting automated code generation, review, and explanation.\
    \ This approach delivers 25\u201330% developer productivity gains and up to 70%\
    \ effort reduction during MAS upgrades. Maximo NXT enables enterprises to modernize\
    \ long-standing customizations with higher accuracy, reduced risk, and improved\
    \ upgrade velocity across greenfield, brownfield, and migration programs.\n  \
    \        bullets: null\n        - title: Solution Features\n          description:\
    \ |\n            We are leveraging IBM watsonx to infuse the generative AI capabilities\
    \ in these use cases. With watsonx.ai, we identify the appropriate model for each\
    \ business need, tune them and deploy them with ease.\n            Maximo NXT\
    \ offers several key functionalities using Generative AI, which are listed below\n\
    \            Code Review & Recommendation: Review source code of Maximo and provide\
    \ recommendation to improve the quality of the code. It also generates the improved\
    \ code.\n          bullets: null\n        - title: \"Code Generation:\"\n    \
    \      description: Enterprises continue to have a demand for new code in Maximo\
    \ to incorporate capabilities that is not available out-of-the-box in the latest\
    \ MAS. This solution generate code based on natural language input.\n        \

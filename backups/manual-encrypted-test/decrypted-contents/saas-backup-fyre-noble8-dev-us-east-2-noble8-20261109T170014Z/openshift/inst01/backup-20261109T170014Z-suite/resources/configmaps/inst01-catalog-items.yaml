    \ - inmapz-max-maps-for-maximo\n    productRating: null\n    productType: SOFTWARE\n\
    \    publishedContent:\n      industries: null\n      legal:\n        licenseAgreementUrl:\
    \ https://inmapz.com/msa/\n        licenseType: ''\n        privacyPolicyUrl:\
    \ https://inmapz.com/privacy-policy-2/\n      localizedContent:\n        descriptions:\n\
    \          long: Save time and costs (over 300% ROI on your facilities staff time)\
    \ from wasted service trips. Convert static floor plans into interactive digital\
    \ indoor maps with InMapz MAX\u2122. Mark locations of your buildings' mechanical\
    \ equipment and assets. Integrate visual maps into your Maximo Work Orders. When\
    \ work orders are assigned to your staff and contractors, they know exactly where\
    \ to go. In emergencies, locate shutoff valves (gas, water) immediately and minimized\
    \ damage to your buildings.\n        documentation:\n          productUrls:\n\
    \            quickStart: https://inmapz.com/contact-us/\n            configuration:\
    \ https://inmapz.com/contact-us/\n            troubleshooting: ''\n          \
    \  faqs: ''\n            readme: ''\n            additionalLinks: []\n       \
    \     support: ''\n          readme: ''\n        features:\n        - title: Digital\
    \ interactive maps of buildings' equipment and assets\n          description:\
    \ Show digital interactive maps created from floor plans. Show each floor of the\
    \ building. Show locations of each room on each floor. Label each room location.\
    \ Show locations of equipment and devices, such as electrical, mechanical, air,\
    \ water. Create custom maps for specific types of devices, such as maps of only\
    \ alarms.\n          bullets: null\n        - title: Integrate maps into Maximo\
    \ Work Orders\n          description: No more wasting time getting lost when servicing\
    \ repairs and maintenance. When service person arrives at site, they can open\
    \ work orders to perform and locate exactly where that equipment is located on\
    \ a map. They can get directions how to get to that location.\n          bullets:\
    \ null\n        - title: Cloud-based hosting for quick deployment.\n         \
    \ description: INMAPZ MAX is easy to get started because in-house IT resource\
    \ is not required to deploy our solution. How MAX works is simply upload your\
    \ buildings' floor plans. Our digital twin platform converts your floor plans\
    \ to dynamic, interactive maps. Equipment are then mapped to their exact locations.\
    \ Then you are ready to use our software.\n          bullets: null\n        -\
    \ title: Compatible on all web and mobile devices (phones, tablets)\n        \
    \  description: \"NMAPZ MAX is built to run on any device: computer, mobile phones.\
    \ We have a user web portal that will run on any standard browser: Microsoft Edge,\
    \ Google Chrome, Firefox, Safari. Our software also runs on any mobile phone and\
    \ tablet/:/ Android, iPhone, iPad. In the office use our web portal on your big\

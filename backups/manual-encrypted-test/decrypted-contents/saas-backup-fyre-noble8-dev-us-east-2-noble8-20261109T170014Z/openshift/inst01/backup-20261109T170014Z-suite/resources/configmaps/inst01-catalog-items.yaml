    \ accelerators that include industry-standard manual and automated business processes\
    \ and workflows.\n          bullets: null\n        - title: Transportation Asset\
    \ Hierarchies, Attributes & Modelling\n          description: Gain unparalleled\
    \ visibility and control over your assets. EAM Core's industry-focused solution\
    \ captures and manages complex transportation industry specific infrastructure\
    \ asset hierarchies, such as tracks, switches, signalling systems, and rolling\
    \ stock, as well as facilities, buildings, bridges, structures, electrical systems,\
    \ and ancillary equipment.\n          bullets: null\n        - title: Enhanced\
    \ Regulatory Compliance and Safety\n          description: Experience robust regulatory\

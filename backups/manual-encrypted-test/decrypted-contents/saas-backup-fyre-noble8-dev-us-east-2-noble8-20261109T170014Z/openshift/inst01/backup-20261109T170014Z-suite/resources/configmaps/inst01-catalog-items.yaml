    \          readme: ''\n        features:\n        - title: Four methodologies\
    \ to implement\n          description: There are 4 different on-ramps to offer\
    \ a straightforward path to harnessing the power of AI in IBM Maximo Application\
    \ Suite, wherever you may be on your MAS AI/ML modernization journey. Explore\

    \      localizedContent:\n        descriptions:\n          long: As part of the\
    \ IBM Maximo Application Suite, the IBM Maximo Test Automation Framework can be\
    \ utilized to validate or re-validate Maximo Manage processes and capabilities\
    \ for a given release based on approved and certified configurations from IBM.\
    \ The IBM Maximo Test Automation Framework consists of a series of validation\
    \ test scripts that encompass asset and work management business processes. These\
    \ test scripts contain information that can be built upon to develop and document\
    \ a manufacturer's policies and procedures according to the implementation and\
    \ use of Maximo Manage application software.\n        documentation:\n       \

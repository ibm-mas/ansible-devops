    \      localizedContent:\n        descriptions:\n          long: Visualise Info\
    \ (VI) directly addresses common pain points in asset-intensive industries. Target\
    \ sectors like utilities, hospitals, railways, and manufacturing all struggle\
    \ with fragmented asset data and complex legacy systems; siloed data and shortages\
    \ of skilled staff. Visualise Info's unified approach aims to streamline their\
    \ operations and decision-making. Visualise Info is positioned as an intuitive,\
    \ \"single pane of glass\" solution for Asset Lifecycle Management. This means\
    \ it provides one centralized, intuitive, role-based user interface, consolidating\
    \ data from many sources into a single source of truth. This solution enables\
    \ effective AI implementation through interoperability (agnostic integration with\
    \ existing systems), ease of use, and automation, providing a pathway to predictive\
    \ maintenance for the client and ultimately driving productivity gains, and cost\
    \ savings.\n        documentation:\n          productUrls:\n            quickStart:\
    \ https://www.youtube.com/@VisualiseInfo/videos\n            configuration: https://vil.visualiseinfo.co.uk/img/VoxelVueIntegratedApplicationArchitecture.png\n\

    \  category: accelerator\n  name: InMapz MAX - Maps for Maximo\n  description:\
    \ Add a visual dimension to Maximo work orders by mapping locations of your buildings\
    \ equipment and assets. Save time and costs (get 300%+ ROI on your facilities\
    \ staff's time) searching for equipment in your buildings by using interactive\
    \ digital indoor mapping and equipment tracking application. Respond quickly to\
    \ emergencies when you need to locate shut off valves for gas, water, electricity.\n\
    \  entitlement: NONE\n  plans:\n  - id: onesize\n    cost: 0\n  ref:\n    type:\

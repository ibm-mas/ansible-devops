    \            additionalLinks: []\n            support: ''\n          readme: ''\n\
    \        features:\n        - title: Interoperability\n          description:\
    \ VI is system agnostic and can integrate a wide range of data sources for Asset\
    \ lifecycle management (ALM), including enterprise asset management (EAM) software,\
    \ Building management systems (BMS), enterprise internet of things (IoT) solutions,\
    \ Artificial Intelligence (AI and Machine Learning (ML). VI's solution transcends\
    \ verticals rather than focusing on a single vertical, by removing silos and integrating\
    \ systems together. By bringing a client's disparate systems and data sources\
    \ together VI enables the effective use of AI through a consolidated single source\
    \ of truth, allowing it to drive productivity gains as well as cost savings.\n\
    \          bullets: null\n        - title: Ease of use\n          description:\
    \ VI's role-based user interface gives users data at the point of need in a format\
    \ that they can easily consume, rather than having to understand how to use multiple\
    \ complex systems. Through the geolocation of data and assets VI's user interface\
    \ also gives the user instant asset and site knowledge no matter their experience,\
    \ reducing the skills gap and the impact of losing experienced staff.\n      \
    \    bullets: null\n        - title: Automation\n          description: through\
    \ integration of systems and data sources VI can drive automation of workflows.\
    \ IoT, EAM, BMS, AI and ML all have their individual strengths but their true\
    \ power can only be harnessed through integration. By bringing different technologies\
    \ together VI acts as the enabler of predictive maintenance, putting clients on\
    \ a pathway to zero defects, zero downtime.\n          bullets: null\n       \

    \        bullets: null\n        - title: Key Features of Maximo Test Automation\
    \ Framework\n          description: These scripts can be used as quality assurance\
    \ test cases to validate information systems. They will be updated for every Maximo\
    \ Application Suite release. The IBM Maximo Test Automation Framework is a Java\
    \ framework based on the Selenium API. The IBM Maximo Test Automation Framework\
    \ can be used to automate the testing of Manage applications in non-production\
    \ environments. The scripts have been developed to validate out of the box processes,\
    \ but can be modified in order to align with any customer specific configurations\
    \ of business processes. Selenium is a free tool, widely used in the software\
    \ development community, which can be easily downloaded and installed in an existing\
    \ Eclipse environment. There are tutorials about how to install and configure\
    \ your Eclipse/Selenium environment.\n          bullets: null\n        - title:\

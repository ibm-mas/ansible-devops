mas_appws_spec:
  bindings:
    jdbc: workspace-application
  components:
    base:
      version: latest
    collaborate:
      version: latest
  settings:
    defaultRegion: "us-east-2"
    customizationList:
      - customizationArchiveName: "cust_archive.zip"
        customizationArchiveUrl: "https://mas-logging-inst01-noble8.s3.us-east-2.amazonaws.com/cust_archive.zip"
        useS3:
          accessKey: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_customization/cos-customization#accessKey>
          region: "us-east-2"
          s3Credentials:
            secretName: custom-s3-credentials
    db:
      encryptionSecret: "main-manage-encryption-secret"
      dbSchema: maximo
      maxinst:
        bypassUpgradeVersionCheck: false
        db2Vargraphic: true
        demodata: false
        indexSpace: MAXINDEX
        tableSpace: MAXDATA
      upgrade:
        upgradeType: regularUpgrade
    deployment:
      buildTag: latest
      defaultJMS: true
      loggingS3Destination:
        accessKey: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_logging/cos-logging#accessKey>
        bucketName: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_logging/cos-logging#bucketName>
        endpointURL: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_logging/cos-logging#endpointURL>
        region: "us-east-2"
        secretKey:
          secretName: cos-logging
      persistentVolumes:
        - accessModes:
            - ReadWriteMany
          mountPath: /jmsstore
          pvcName: mas-inst01-jmsserver-pvc
          size: 25Gi
          storageClassName: nfs-client
      serverBundles:
        - additionalServerConfig: 
            secretName: main-manage-d--sb0--asc--sn
          bundleType: standalonejms
          isDefault: false
          isMobileTarget: false
          name: jmsserver
          replica: 1
          routeSubDomain: jmsserver
        - name: default
          additionalServerConfig: 
            secretName: main-manage-d--sb1--asc--sn
          bundleLevelProperties: |-
            mxe.doclink.path01=cos:doclinks=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maximo/oslc/cosdoclinks
            mxe.doclink.doctypes.defpath=cos:doclinks/default
            mxe.doclink.doctypes.topLevelPaths=cos:doclinks
            mxe.doclink.securedAttachment=true
            mxe.int.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/meaweb
            mxe.oslc.restwebappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest/oslc
            mxe.oslc.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maximo/oslc
            mxe.rest.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest
            mxe.attachmentstorage=com.ibm.tivoli.maximo.oslc.provider.COSAttachmentStorage
            mxe.rest.webappurl=https://main.manage.inst01.apps.noble8.cp.fyre.ibm.com/maxrest
            mxe.cosendpointuri=<path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_attachments/cos-attachments#endpointURL>
            mxe.cosbucketname=<path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_attachments/cos-attachments#bucketName>
            mxe.cosaccesskey=<path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_attachments/cos-attachments#accessKey>
            mxe.cossecretkey=<path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_attachments/cos-attachments#access_secret_key>
            mxe.plg.endpoint=MASPLG
          isDefault: true
          replica: 2
          routeSubDomain: bundle1
          bundleType: all
          isMobileTarget: true
      serverTimezone: GMT
    languages:
      baseLang: EN
      secondaryLangs: []
customization_archive_secret_names:
  - secret_name: custom-s3-credentials
    access_secret_key: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/inst01/manage_customization/cos-customization#accessSecretKey>

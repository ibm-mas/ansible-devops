---
manage:
  app_channel: 9.2.x-dev
  app_install_plan: Automatic
  workspace_action: activate
  appws_spec_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/appws_spec_manage.yaml>
  app_server_bundles_combined_add_server_config_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/manage/app_server_bundles_combined_add_server_config_manage.yaml>
  db2_instance_registry_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/db2_instance_registry_manage.yaml>
  db2_database_db_config_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/db2_database_db_config_manage.yaml>
  db2_instance_dbm_config_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/db2_instance_dbm_config_manage.yaml>
  db2_addons_audit_config_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/db2_addons_audit_config_manage.yaml>
  app_catalog_source: ibm-operator-catalog
  app_api_version: apps.mas.ibm.com/v1
  app_kind: ManageApp
  appws_api_version: apps.mas.ibm.com/v1
  appws_kind: ManageWorkspace
  jdbc:
    type: incluster-db2
    jdbc_connection_url_additional_params: sslConnection=true
    route: default # By default routes are not exposed to public. To expose route, set this to public.
# MAS 9.2+: Collaborate is handled as a Manage component (see appws_spec_manage.yaml)
# No separate Assist/Collaborate application definition needed
monitor:
  app_channel: 9.2.x-dev
  app_install_plan: Automatic
  workspace_action: activate
  app_spec_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/app_spec_monitor.yaml>
  db2_addons_audit_config_yaml: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/db2_addons_audit_config_monitor.yaml>
  app_catalog_source: ibm-operator-catalog
  app_api_version: apps.mas.ibm.com/v1
  app_kind: MonitorApp
  appws_api_version: apps.mas.ibm.com/v1
  appws_kind: MonitorWorkspace
  jdbc:
    type: incluster-db2
    jdbc_connection_url_additional_params: "sslConnection=true;sslVersion=TLSv1.2;"
    route: default # By default routes are not exposed to public. To expose route, set this to public.






predict:
  app_channel: 9.1.x-dev
  app_install_plan: Automatic
  app_catalog_source: ibm-operator-catalog
  app_api_version: apps.mas.ibm.com/v1
  app_kind: PredictApp
  workspace_action: install  

---
mas_instance:
  id: inst01
  domain: inst01.apps.noble8.cp.fyre.ibm.com
  manual_cert_mgmt: false
  trust_default_cas: false
  channel: 9.2.x-dev
  install_plan: Automatic
  mas_feature_usage: "true"
  mas_deployment_progression: "true"
  mas_usability_metrics: "true"
  annotations: 
    mas.ibm.com/hyperscalerLifecycle: provisioning
    mas.ibm.com/hyperscalerFormat: saas
    mas.ibm.com/hyperscalerProvider: aws
    mas.ibm.com/hyperscalerChannel: aws
    mas.ibm.com/operationalMode: production
    mas.ibm.com/hyperscalerTier: standard
    mas.ibm.com/saasSubscriptionId: not-marketplace-order
    mas.ibm.com/saasTenantId: not-marketplace-order
    mas.ibm.com/instanceId: "not-marketplace-order"
    mas.ibm.com/saasPlanId: "mas_custom"
  edition: standard
  wipe_mongo_data: true
  routing_mode: subdomain
  pod_template_file: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/pod_template_ibm_mas_suite.yaml>

mas_workspaces:
  id: main
  name: "main"

sls:
  channel: 3.x
  license:
    expiry_date: "01-nov-3000"
    app_points: 1000
    customer_name: "Development"
    country: "US"
    icn: "0x1"
  install_plan: Automatic
  pod_template_file: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/pod_template_ibm_mas_slscfg.yaml>

dro:
  ca_certificate_file: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/dro-ca-cert.pem>
  contact_lastname: Barnes
  contact_firstname: John
  contact_email: johnbarnes@uk.ibm.com
  pod_template_file: <ref:gitops/fyre-noble8-dev/us-east-2/noble8/inst01/pod_template_ibm_mas_bascfg.yaml>


db2u:
  action: install
  install_plan: Automatic
  manage:
    version: s12.1.5.0-cn1
    tls_version: TLSv1.3
    channel: v120105.0
    db2_timezone: UTC
    audit_logs_storage_class: nfs-client
    meta_storage_class: nfs-client
    backup_storage_class: nfs-client
    data_storage_class: nfs-client
    logs_storage_class: nfs-client
    archivelogs_storage_class: nfs-client
    backup_storage_size: 20Gi
    data_storage_size: 20Gi
    db2_cpu_requests: 2
    db2_cpu_limits: 2
    db2_memory_requests: 4Gi
    db2_memory_limits: 8Gi
  monitor:
    version: s11.5.9.0-cn2
    tls_version: TLSv1.3
    channel: v120105.0
    db2_timezone: UTC
    audit_logs_storage_class: nfs-client
    meta_storage_class: nfs-client
    backup_storage_class: nfs-client
    data_storage_class: nfs-client
    logs_storage_class: nfs-client
    archivelogs_storage_class: nfs-client
    backup_storage_size: 20Gi
    data_storage_size: 20Gi
    db2_cpu_requests: 2
    db2_cpu_limits: 2
    db2_memory_requests: 4Gi
    db2_memory_limits: 8Gi


cp4d:
  product_version: "5.4.0"
  action: install
  wsl_action: install
  watson_machine_learning_action: install
  analytics_engine_action: install
  spss_modeler_action: install
  cognos_analytics_action: install
  cpd_primary_storage_class: nfs-client
  cpd_metadata_storage_class: nfs-client
  cpd_service_storage_class: nfs-client 
  cpd_service_block_storage_class: nfs-client
  
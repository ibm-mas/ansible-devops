merge-key: "fyre-noble8-dev/noble8/inst01"
ibm_db2u_databases:
  - db2_namespace: db2u-inst01
    db2_instance_name: db2wh-inst01-manage
    db2_dbname: BLUDB
    db2_version: s12.1.5.0-cn1
    db2_tls_version: TLSv1.3
    db2_table_org: ROW
    db2_node_label:
    db2_dedicated_node:
    replica_db: false
    db2_instance_registry:
      DB2_CDE_REDUCED_LOGGING: 'REDUCED_REDO:NO'
      DB2_OBJECT_STORAGE_LOCAL_STAGING_PATH: '/mnt/backup/staging'
      DB2_BCKP_PAGE_VERIFICATION: 'TRUE'
      DB2_WORKLOAD: 'MAXIMO'
      DB2_SKIPINSERTED: 'ON'
      DB2_INLIST_TO_NLJN: 'YES'
      DB2_MINIMIZE_LISTPREFETCH: 'Y'
      DB2_EVALUNCOMMITTED: 'YES'
      DB2_SKIPDELETED: 'ON'
      DB2_FMP_COMM_HEAPSZ: '65536'
      DB2_USE_ALTERNATE_PAGE_CLEANING: 'ON'
      DB2AUTH: 'OSAUTHDB,ALLOW_LOCAL_FALLBACK,PLUGIN_AUTO_RELOAD'
      DB2_4K_DEVICE_SUPPORT: 'ON'
      DB2_FMP_RUN_AS_CONNECTED_USER: 'NO'
    db2_database_db_config:
      CHNGPGS_THRESH: '40'
      DFT_QUERYOPT: '5'
      DFT_DEGREE: 'ANY'
      LOGBUFSZ: '16384'
      LOCKLIST: 'AUTOMATIC'
      MAXFILOP: '61440'
      NUM_IOCLEANERS: 'AUTOMATIC'
      NUM_IOSERVERS: 'AUTOMATIC'
      STMTHEAP: '20000 AUTOMATIC'
      CUR_COMMIT: 'ON'
      AUTO_REVAL: 'DEFERRED'
      DEC_TO_CHAR_FMT: 'NEW'
      DATABASE_MEMORY: 'AUTOMATIC'
      PCKCACHESZ: 'AUTOMATIC'
      DBHEAP: 'AUTOMATIC'
      STAT_HEAP_SZ: 'AUTOMATIC'
      SOFTMAX: '0'
      CATALOGCACHE_SZ: '4096'
      LOCKTIMEOUT: '300'
      LOGPRIMARY: '100'
      LOGSECOND: '156'
      LOGFILSIZ: '32768'
      LOGINDEXBUILD: 'ON'
      MIRRORLOGPATH: '/mnt/backup/MIRRORLOGPATH'
      STMT_CONC: 'LITERALS'
      DDL_CONSTRAINT_DEF: 'YES'
      TRACKMOD: 'YES'
      AUTO_DEL_REC_OBJ: 'ON'
      REC_HIS_RETENTN: '60'
      NUM_DB_BACKUPS: '60'
      DFT_TABLE_ORG: 'ROW'
      AUTO_MAINT: 'ON'
      AUTO_TBL_MAINT: 'ON'
      AUTO_RUNSTATS: 'ON'
      AUTO_REORG: 'OFF'
      AUTO_DB_BACKUP: 'OFF'
      WLM_ADMISSION_CTRL: 'NO'
      SHEAPTHRES_SHR: 'automatic'
      SORTHEAP: 'automatic'
      SELF_TUNING_MEM: 'ON'
      AUTHN_CACHE_USERS: '100'
      AUTHN_CACHE_DURATION: '10'
      APPLHEAPSZ: '8192 AUTOMATIC'
      LOGARCHCOMPR1: 'ON'
    db2_addons_audit_config:
      enableAudit: true
      interval: "15"
      applyDefaultPolicy: true
      archiveToDb: false
    db2_instance_dbm_config:
      AGENT_STACK_SZ: '1024'
      RQRIOBLK: '65535'
      HEALTH_MON: 'OFF'
      MON_HEAP_SZ: 'AUTOMATIC'
      KEEPFENCED: 'NO'
      FENCED_POOL: '50'
    db2_mln_count: 1
    db2_num_pods: 1
    db2_meta_storage_class: nfs-client
    db2_meta_storage_size: 20Gi
    db2_meta_storage_accessmode: ReadWriteMany
    db2_data_storage_class: nfs-client
    db2_data_storage_size: 20Gi
    db2_data_storage_accessmode: ReadWriteOnce
    db2_backup_storage_class: nfs-client
    db2_backup_storage_size: 20Gi
    db2_backup_storage_accessmode: ReadWriteMany
    db2_logs_storage_class: nfs-client
    db2_logs_storage_size: 100Gi
    db2_logs_storage_accessmode: ReadWriteOnce
    db2_audit_logs_storage_class: nfs-client
    db2_audit_logs_storage_size: 100Gi
    db2_audit_logs_storage_accessmode: ReadWriteMany
    db2_archivelogs_storage_class: nfs-client
    db2_archivelogs_storage_size: 100Gi
    db2_archivelogs_storage_accessmode: ReadWriteMany
    db2_cpu_requests: 4
    db2_cpu_limits: 6
    db2_memory_requests: 8Gi
    db2_memory_limits: 16Gi
    db2_affinity_key:
    db2_affinity_value:
    db2_tolerate_key:
    db2_tolerate_value:
    db2_tolerate_effect:
    cluster_domain: <path:arn:aws:secretsmanager:us-east-2:435377327995:secret:fyre-noble8-dev/noble8/cluster_domain#cluster_domain>
    mas_application_id: manage
    jdbc_route: default
    jdbc_connection_url_additional_params: sslConnection=true
    db2_timezone: UTC
    auto_backup: false

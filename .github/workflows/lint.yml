name: Lint

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]

# Ensure only one lint run at a time for any branch, cancelling any in-progress runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[doc]') && !contains(github.event.head_commit.message, '[skip tests]') }}
    steps:
      - name: Install Python v3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout
        uses: actions/checkout@v4

      # This job is deliberately self-contained: no collection build pipeline
      # and no test dependencies, so that linting runs independently of the build.
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Run lint
        run: |
          make lint
